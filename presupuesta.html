<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VCP Terminal</title>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=DM+Sans:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    
    <!-- Iconos: Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- VARIABLES (TEMA TERMINAL) --- */
        :root {
            --bg-app: #000000;
            --bg-panel: #111111;
            --primary: #a3e635;      /* Lima vibrante */
            --primary-light: rgba(163, 230, 53, 0.15);
            --text-main: #ffffff;
            --text-gray: #737373;
            --border: #333333;
            --input-bg: #222222;
            --overlay-bg: rgba(17, 17, 17, 0.95);
            
            --radius: 16px;
            --font: 'Outfit', sans-serif;
            --shadow-float: 0 10px 40px -10px rgba(0,0,0,0.8);
            
            /* Etiquetas de Precio */
            --tag-retail: #f87171; /* Rojo */
            --tag-base: #60a5fa;   /* Azul */
            --tag-whls: #4ade80;   /* Verde */
        }

        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); background: var(--bg-app); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- APP SHELL --- */
        .app-shell { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* --- NAVEGACIÓN --- */
        .nav-container {
            background: var(--bg-panel); flex-shrink: 0; z-index: 50;
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; width: 240px; padding: 20px; gap: 10px;
        }
        
        .nav-logo {
            font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 20px; padding: 0 10px;
            display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;
        }

        .nav-item {
            cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            color: var(--text-gray); font-weight: 600; font-size: 14px; border-radius: 12px;
            transition: all 0.2s;
        }
        .nav-item i { font-size: 22px; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .nav-item.active { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-light); }

        /* --- ÁREA PRINCIPAL --- */
        .content-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; padding: 25px; gap: 25px; overflow-y: auto; max-width: 1000px; margin: 0 auto; width: 100%; }

        /* --- INPUTS --- */
        .input-row { display: flex; gap: 15px; }
        .input-card {
            flex: 1; background: var(--input-bg); border-radius: var(--radius); padding: 15px 20px;
            border: 1px solid var(--border); display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }
        .input-card:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
        .input-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 5px; }
        .input-field {
            background: transparent; border: none; font-family: var(--font); color: var(--text-main);
            font-size: 24px; font-weight: 700; width: 100%; outline: none;
        }
        /* Decoración */
        .input-card::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); opacity: 0; transition: 0.2s; }
        .input-card:focus-within::after { opacity: 1; }

        /* --- GRID SERVICIOS --- */
        .grid-section-title { font-size: 13px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; padding-left: 10px; border-left: 3px solid var(--primary); line-height: 1; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding-bottom: 120px; }
        
        /* --- BOTONES DE SERVICIO (HOVER STYLE) --- */
        .svc-card {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
            height: 130px; position: relative; overflow: hidden;
            display: flex; flex-direction: column; 
            cursor: default; transition: border-color 0.2s;
        }
        
        /* Vista por defecto */
        .svc-default-view {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.3s; z-index: 1;
        }
        .svc-card:hover .svc-default-view { transform: translateY(-5px) scale(0.9); opacity: 0.3; filter: blur(2px); }
        
        /* Overlay Opciones */
        .svc-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg); backdrop-filter: blur(2px);
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 10;
        }
        .svc-card:hover .svc-overlay { opacity: 1; pointer-events: auto; }
        
        .svc-opt-btn {
            flex: 1; border: none; background: transparent; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-main); cursor: pointer; transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .svc-opt-btn:last-child { border-bottom: none; }
        .svc-opt-btn:hover { background: var(--primary); color: #000; }
        
        .opt-label { font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .opt-price { font-size: 14px; font-weight: 800; }

        .svc-icon { font-size: 32px; transition: transform 0.3s; }
        .svc-name { font-size: 13px; font-weight: 600; text-align: center; color: var(--text-main); line-height: 1.1; padding: 0 5px; }

        /* Single Action (Cards sin opciones) */
        .svc-card.single-action { cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        /* Fix para que no se borre el contenido en single action al hover */
        .svc-card.single-action .svc-default-view { position: relative; width: auto; height: auto; opacity: 1 !important; filter: none !important; transform: none !important; }
        .svc-card.single-action:hover { border-color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.2); transform: translateY(-2px); }
        .svc-card.single-action .svc-price { font-size: 11px; font-weight: 700; color: var(--text-gray); background: var(--input-bg); padding: 4px 8px; border-radius: 8px; }

        /* LISTA DISEÑO */
        .design-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 120px; }
        .design-item {
            background: var(--bg-panel); border: 1px solid var(--border); padding: 15px; border-radius: var(--radius);
            display: flex; align-items: center; gap: 15px; cursor: pointer;
        }
        .design-item:hover { border-color: var(--primary); background: var(--input-bg); }
        .d-icon { font-size: 28px; width: 40px; display: flex; justify-content: center; }
        .d-content { flex: 1; }
        .d-title { font-weight: 700; font-size: 14px; color: var(--text-main); margin-bottom: 3px; }
        .d-desc { font-size: 11px; color: var(--text-gray); }
        .d-price { font-weight: 700; font-size: 13px; color: var(--primary); text-align: right; }

        /* --- BOTÓN FLOTANTE INTELIGENTE --- */
        .fab-container {
            position: fixed; bottom: 30px; right: 30px; z-index: 80;
            display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
        }
        .fab-btn {
            width: 65px; height: 65px; border-radius: 50%; background: var(--primary); color: #000;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); cursor: pointer; border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fab-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--primary-light); }
        .fab-btn:active { transform: scale(0.9); }
        
        .fab-content { font-size: 13px; font-weight: 800; font-family: var(--font); display: flex; flex-direction: column; align-items: center; line-height: 1; }
        
        /* --- TICKET DESLIZABLE (DRAWER) --- */
        .ticket-drawer {
            position: fixed; bottom: 110px; right: 30px; width: 340px;
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; box-shadow: var(--shadow-float); z-index: 90;
            display: flex; flex-direction: column; gap: 15px;
            opacity: 0; visibility: hidden; transform: translateY(30px) scale(0.9);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .ticket-drawer.visible { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        .ticket-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 15px; }
        .ticket-title { font-weight: 800; text-transform: uppercase; font-size: 12px; color: var(--text-gray); letter-spacing: 1px; }
        
        /* Botón Cerrar Ticket Mejorado */
        .close-ticket { 
            background: transparent; border: none; color: var(--text-gray); 
            cursor: pointer; font-size: 20px; padding: 5px; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: background 0.2s;
            position: relative; z-index: 10;
        }
        .close-ticket:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

        .ticket-body { max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .total-amount { font-size: 28px; font-weight: 800; color: var(--primary); line-height: 1; }
        
        /* Etiquetas de Precio */
        .price-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; color: #000; margin-left: auto; }
        .tag-retail { background: var(--tag-retail); }
        .tag-base { background: var(--tag-base); }
        .tag-whls { background: var(--tag-whls); }

        .action-btn {
            background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s; margin-top: 10px; width: 100%;
        }
        .action-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        @keyframes flashItem { 0% { background-color: var(--primary); color: black; } 100% { background-color: transparent; color: inherit; } }
        .new-item-flash { animation: flashItem 1s ease-out; border-radius: 4px; padding: 2px 5px; }

        /* --- MODAL CONFIRMACIÓN --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-box {
            background: var(--bg-panel); border: 1px solid var(--border);
            padding: 25px; border-radius: 20px; width: 300px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.9); transition: all 0.2s;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        
        .modal-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; }
        .modal-desc { font-size: 13px; color: var(--text-gray); margin-bottom: 20px; }
        
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-modal {
            flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-size: 13px;
        }
        .btn-cancel { background: var(--input-bg); color: var(--text-main); }
        .btn-confirm { background: #ef4444; color: white; }

        /* --- MOBILE MEDIA QUERY --- */
        @media (max-width: 768px) {
            .app-shell { flex-direction: column; }
            .nav-container {
                width: 100%; height: 75px; order: 2; flex-direction: row; 
                justify-content: space-around; align-items: center; padding: 0 10px;
                border-right: none; border-top: 1px solid var(--border); box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            }
            .nav-logo { display: none; }
            .nav-item { flex-direction: column; gap: 4px; padding: 8px; font-size: 10px; background: transparent !important; color: var(--text-gray) !important; box-shadow: none !important; }
            .nav-item i { font-size: 24px; margin-bottom: 2px; }
            .nav-item.active { color: var(--primary) !important; }
            .content-wrapper { padding: 15px; padding-bottom: 0; }
            .fab-container { bottom: 90px; right: 20px; }
            .ticket-drawer { right: 15px; left: 15px; width: auto; bottom: 165px; }
        }
    </style>
</head>
<body class="theme-terminal">

    <div class="app-shell">
        
        <!-- NAVEGACIÓN -->
        <nav class="nav-container">
            <div class="nav-logo"><i class="ph ph-terminal-window" style="font-size: 28px;"></i> VCP</div>
            <div class="nav-item active" onclick="switchTab('impresiones', this)"><i class="ph ph-printer"></i> <span>Impresiones</span></div>
            <div class="nav-item" onclick="switchTab('diseno', this)"><i class="ph ph-pen-nib"></i> <span>Diseño</span></div>
            <div class="nav-item" onclick="switchTab('especiales', this)"><i class="ph ph-star"></i> <span>Especiales</span></div>
            <div class="nav-item" onclick="resetCart()" style="margin-top: auto; color: #ef4444;"><i class="ph ph-trash"></i> <span>Limpiar</span></div>
        </nav>

        <!-- CONTENIDO -->
        <div class="content-wrapper">
            <div class="input-row">
                <div class="input-card">
                    <label id="lbl-qty">Páginas</label>
                    <input type="number" class="input-field" value="" placeholder="1" id="inp-qty">
                </div>
                <div class="input-card" id="card-copies">
                    <label>Copias</label>
                    <input type="number" class="input-field" value="" placeholder="1" id="inp-copies">
                </div>
            </div>
            <div id="dynamic-area"></div>
        </div>

        <!-- TICKET DRAWER -->
        <div class="ticket-drawer" id="ticket-drawer">
            <div class="ticket-header">
                <div class="ticket-title">Resumen</div>
                <div id="price-status"></div> <!-- Etiqueta Minorista/Mayorista -->
                <button class="close-ticket" type="button" onclick="closeTicket()"><i class="ph ph-x"></i></button>
            </div>
            
            <div class="ticket-body" id="ticket-items">
                <!-- Items se inyectan aquí -->
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 10px; margin-top: 5px;">
                <div class="ticket-row">
                    <div class="total-label">TOTAL</div>
                    <div class="total-amount" id="ticket-total">$0</div>
                </div>
                <button class="action-btn" onclick="shareWhatsApp()"><i class="ph ph-whatsapp-logo" style="font-size: 18px;"></i> Enviar WhatsApp</button>
            </div>
        </div>

        <!-- FAB (BOTÓN FLOTANTE) -->
        <div class="fab-container">
            <button class="fab-btn" id="main-fab" onclick="toggleTicket()">
                <i class="ph ph-receipt" style="font-size: 24px;"></i>
            </button>
        </div>

    </div>

    <!-- MODAL CONFIRMACIÓN (REEMPLAZO ALERT) -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">¿Reiniciar Todo?</div>
            <div class="modal-desc">Se borrarán todos los ítems cargados.</div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-modal btn-confirm" onclick="confirmReset()">Sí, Borrar</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN & ESTADO ---
        let cart = [];
        let ticketTimeout;
        const RETAIL_PRICE_BASE = 200; // Precio Base Minorista por hoja
        
        // --- PRECIOS MAYORISTAS ---
        const WHOLESALE_PRICES = {
            'byn': 90, 'byn2': 60,
            'color': 120, 'color2': 80
        };

        // --- DATOS SERVICIOS ---
        const servicesImp = [
            { 
                name: 'Blanco y Negro', icon: 'ph-file-text', color: '#94A3B8',
                options: [ { label: 'Simple', code: 'byn' }, { label: 'Doble', code: 'byn2' } ]
            },
            { 
                name: 'Color', icon: 'ph-printer', color: '#F87171',
                options: [ { label: 'Simple', code: 'color' }, { label: 'Doble', code: 'color2' } ]
            },
            { 
                name: 'Full Color', icon: 'ph-image', color: '#FBBF24',
                options: [ { label: 'Simple', price: 200 }, { label: 'Doble', price: 150 } ] 
            },
        ];

        const servicesEsp = [
            { 
                name: 'Grueso', icon: 'ph-stack', color: '#A78BFA',
                options: [ { label: 'Simple', price: 1800 }, { label: 'Doble', price: 1250 } ]
            },
            { 
                name: 'Papel Foto', icon: 'ph-camera', color: '#C084FC',
                options: [ { label: 'Simple', price: 1200 }, { label: 'Doble', price: 900 } ]
            },
            { name: 'Sticker', icon: 'ph-sticker', color: '#4ADE80', price: 1800 },
            { name: 'Anillado', icon: 'ph-notebook', color: '#60A5FA', price: 1800 }
        ];

        const servicesDesign = [
            { title: 'Ajuste Básico', desc: 'Centrar, mover.', price: 1200, icon: 'ph-sliders', color: '#2DD4BF' },
            { title: 'Armado Letras', desc: 'Formato canción.', price: 300, icon: 'ph-music-notes', color: '#F472B6' },
            { title: 'Armado A4', desc: 'Etiquetas en hoja.', price: 3000, icon: 'ph-ruler', color: '#FB923C' },
            { title: 'Diseño 0', desc: 'Desde cero.', price: 4000, icon: 'ph-pencil-circle', color: '#A3E635' },
        ];

        // --- INIT ---
        document.addEventListener("DOMContentLoaded", () => {
            renderImpresiones();
            document.getElementById('inp-qty').focus();
        });

        // --- CORE LOGIC: PRECIOS ---
        function addToCart(name, priceOrCode, type) {
            const qtyInput = document.getElementById('inp-qty');
            const copiesInput = document.getElementById('inp-copies');
            
            const qty = parseInt(qtyInput.value) || 1;
            const copies = parseInt(copiesInput.value) || 1;
            
            let item = {
                id: Date.now(),
                name: name,
                qty: qty,
                copies: copies,
                type: type,
                finalPrice: 0 // Se calcula luego
            };

            if (type === 'design') {
                item.label = `${qty} un.`;
                item.basePrice = priceOrCode; 
                item.isWholesale = false;
            } else if (type === 'print') {
                item.label = `${qty}p x ${copies}c`;
                if (typeof priceOrCode === 'string') {
                    item.wholesaleCode = priceOrCode;
                    item.isWholesale = true;
                } else {
                    item.basePrice = priceOrCode;
                    item.isWholesale = false;
                }
            } else { 
                item.label = `${qty * copies} un.`;
                item.basePrice = priceOrCode;
                item.isWholesale = false;
            }

            cart.push(item);
            recalculateCart();
            
            // RESET FLOW
            qtyInput.value = "";
            copiesInput.value = "";
            qtyInput.focus();

            // Flash Ticket
            const drawer = document.getElementById('ticket-drawer');
            drawer.classList.add('visible');
            if(ticketTimeout) clearTimeout(ticketTimeout);
            ticketTimeout = setTimeout(() => { drawer.classList.remove('visible'); }, 1500);
        }

        function addManualItem() {
            const name = prompt("Nombre del servicio:");
            if (!name) { document.getElementById('inp-qty').focus(); return; }
            const price = prompt("Precio total:");
            if (!price) { document.getElementById('inp-qty').focus(); return; }
            
            cart.push({
                id: Date.now(),
                name: name + " (Manual)",
                label: "1 un.",
                basePrice: parseFloat(price),
                isWholesale: false,
                qty: 1, copies: 1, type: 'manual',
                finalPrice: parseFloat(price) 
            });
            recalculateCart();
            document.getElementById('inp-qty').focus();
        }

        function recalculateCart() {
            let totalRetailValue = 0;
            let totalWholesaleValue = 0;
            let wholesaleItems = [];

            cart.forEach(item => {
                if (item.isWholesale) {
                    const units = item.qty * item.copies;
                    totalRetailValue += units * RETAIL_PRICE_BASE;
                    totalWholesaleValue += units * WHOLESALE_PRICES[item.wholesaleCode];
                    wholesaleItems.push(item);
                } else {
                    let units = (item.type === 'design' || item.type === 'manual') ? 1 : (item.qty * item.copies);
                    if (item.type === 'design') units = item.qty; // Fix for design logic
                    if (item.type === 'manual') item.finalPrice = item.basePrice; // Manual is fixed
                    else item.finalPrice = item.basePrice * units; 
                }
            });

            // Target Calc
            let printTargetTotal = 0;
            let priceLabelHtml = "";

            if (wholesaleItems.length > 0) {
                if (totalRetailValue < 1500) {
                    printTargetTotal = totalRetailValue;
                    priceLabelHtml = '<span class="price-tag tag-retail">MINORISTA</span>';
                } else {
                    printTargetTotal = Math.max(1500, totalWholesaleValue);
                    if (printTargetTotal === 1500) {
                        priceLabelHtml = '<span class="price-tag tag-base">BASE</span>';
                    } else {
                        priceLabelHtml = '<span class="price-tag tag-whls">MAYORISTA</span>';
                    }
                }

                wholesaleItems.forEach(item => {
                    const itemRetailVal = (item.qty * item.copies) * RETAIL_PRICE_BASE;
                    const ratio = itemRetailVal / totalRetailValue;
                    item.finalPrice = printTargetTotal * ratio;
                });
            }

            document.getElementById('price-status').innerHTML = priceLabelHtml;
            renderTicket();
        }

        function renderTicket() {
            const list = document.getElementById('ticket-items');
            const totalEl = document.getElementById('ticket-total');
            const fab = document.getElementById('main-fab');

            const finalTotal = cart.reduce((acc, curr) => acc + curr.finalPrice, 0);
            const formattedTotal = `$${Math.round(finalTotal).toLocaleString()}`;
            totalEl.textContent = formattedTotal;

            if (finalTotal > 0) {
                fab.innerHTML = `<span class="fab-content">${formattedTotal}</span>`;
            } else {
                fab.innerHTML = `<i class="ph ph-receipt" style="font-size: 24px;"></i>`;
            }

            if (cart.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-gray); padding: 20px; font-size: 12px;">El carrito está vacío</div>';
                return;
            }

            list.innerHTML = cart.map(item => `
                <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div>
                        <span class="new-item-flash" style="color: var(--text-main); font-weight:600;">${item.name}</span>
                        <div style="font-size:10px; color: var(--text-gray);">${item.label}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:700; color:var(--primary);">$${Math.round(item.finalPrice).toLocaleString()}</span>
                        <i class="ph ph-trash" onclick="removeFromCart(${item.id})" style="cursor:pointer; color:#ef4444; font-size:14px;"></i>
                    </div>
                </div>
            `).join('');
            list.scrollTop = list.scrollHeight;
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            recalculateCart();
        }

        // --- RESET LOGIC (MODAL) ---
        function resetCart() {
            document.getElementById('confirm-modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }
        function confirmReset() {
            cart = [];
            recalculateCart();
            closeTicket();
            closeModal();
            document.getElementById('inp-qty').focus();
        }

        // --- UI HELPERS ---
        function toggleTicket() { 
            const drawer = document.getElementById('ticket-drawer');
            if(drawer.classList.contains('visible')) closeTicket();
            else {
                drawer.classList.add('visible');
                if(ticketTimeout) clearTimeout(ticketTimeout);
            }
        }
        
        function closeTicket() { 
            const drawer = document.getElementById('ticket-drawer');
            drawer.classList.remove('visible'); 
            if(ticketTimeout) clearTimeout(ticketTimeout);
            setTimeout(() => { document.getElementById('inp-qty').focus(); }, 50);
        }

        function renderImpresiones() {
            const html = `
                <div class="grid-section-title">Impresiones</div>
                <div class="services-grid">
                    ${servicesImp.map(s => `
                        <div class="svc-card">
                            <div class="svc-default-view">
                                <i class="svc-icon ph ${s.icon}" style="color: ${s.color}"></i>
                                <div class="svc-name">${s.name}</div>
                            </div>
                            <div class="svc-overlay">
                                ${s.options.map(opt => {
                                    let displayPrice = typeof opt.price === 'number' ? '$'+opt.price : (WHOLESALE_PRICES[opt.code] ? 'Var.' : '');
                                    let valParam = typeof opt.price === 'number' ? opt.price : `'${opt.code}'`;
                                    
                                    return `<button class="svc-opt-btn" onclick="addToCart('${s.name} ${opt.label}', ${valParam}, 'print')">
                                        <span class="opt-label">${opt.label}</span>
                                        <span class="opt-price">${displayPrice}</span>
                                    </button>`;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('dynamic-area').innerHTML = html;
            updateInputs(true);
        }

        function renderEspeciales() {
            const html = `
                <div class="grid-section-title">Especiales</div>
                <div class="services-grid">
                    ${servicesEsp.map(s => {
                        if(s.options) {
                            return `
                            <div class="svc-card">
                                <div class="svc-default-view">
                                    <i class="svc-icon ph ${s.icon}" style="color: ${s.color}"></i>
                                    <div class="svc-name">${s.name}</div>
                                </div>
                                <div class="svc-overlay">
                                    ${s.options.map(opt => `
                                        <button class="svc-opt-btn" onclick="addToCart('${s.name} ${opt.label}', ${opt.price}, 'special-single')">
                                            <span class="opt-label">${opt.label}</span>
                                            <span class="opt-price">$${opt.price}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>`;
                        } else {
                            return `
                            <div class="svc-card single-action" onclick="addToCart('${s.name}', ${s.price}, 'special-single')">
                                <div class="svc-default-view">
                                    <i class="svc-icon ph ${s.icon}" style="color: ${s.color}"></i>
                                    <div class="svc-name">${s.name}</div>
                                    <div class="svc-price">$${s.price}</div>
                                </div>
                            </div>`;
                        }
                    }).join('')}
                    <div class="svc-card single-action" onclick="addManualItem()" style="border-style: dashed;">
                        <div class="svc-default-view">
                            <i class="svc-icon ph ph-plus" style="color: var(--text-gray)"></i>
                            <div class="svc-name">Varios</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('dynamic-area').innerHTML = html;
            updateInputs(true);
        }

        function renderDiseno() {
            const html = `
                <div class="grid-section-title">Servicios de Diseño</div>
                <div class="design-list">
                    ${servicesDesign.map(s => `
                        <div class="design-item" onclick='addToCart("${s.title}", ${s.price}, "design")'>
                            <div class="d-icon"><i class="ph ${s.icon}" style="color: ${s.color}"></i></div>
                            <div class="d-content">
                                <div class="d-title">${s.title}</div>
                                <div class="d-desc">${s.desc}</div>
                            </div>
                            <div class="d-price">$${s.price}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('dynamic-area').innerHTML = html;
            updateInputs(false);
        }

        function updateInputs(showCopies) {
            const cardCopies = document.getElementById('card-copies');
            const lblQty = document.getElementById('lbl-qty');
            const inpCopies = document.getElementById('inp-copies');
            
            if(showCopies) {
                cardCopies.style.opacity = '1';
                cardCopies.style.pointerEvents = 'auto';
                lblQty.textContent = "Páginas";
                inpCopies.disabled = false;
            } else {
                cardCopies.style.opacity = '0.3';
                cardCopies.style.pointerEvents = 'none';
                lblQty.textContent = "Cantidad";
                inpCopies.disabled = true;
            }
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'impresiones') renderImpresiones();
            if(tab === 'especiales') renderEspeciales();
            if(tab === 'diseno') renderDiseno();
            
            document.getElementById('inp-qty').focus(); // Focus when switching tabs
        }

        function shareWhatsApp() {
            if(cart.length === 0) return;
            const total = document.getElementById('ticket-total').textContent;
            let text = `*PRESUPUESTO*\n------------------\n`;
            cart.forEach(item => {
                text += `• ${item.name} (${item.label}): $${Math.round(item.finalPrice)}\n`;
            });
            text += `------------------\n*TOTAL: ${total}*`;
            
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // --- KEYBOARD SUPPORT ---
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const active = document.activeElement;
                if(active.id === 'inp-qty') document.getElementById('inp-copies').focus();
                else if(active.id === 'inp-copies') {
                    active.blur(); 
                }
            }
        });

    </script>
</body>
</html>
