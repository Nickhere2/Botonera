<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumb Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron&display=swap" rel="stylesheet">
    <style>
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .favorite-star.favorited { color: #facc15; }
        .channel-card { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out, opacity 0.2s; }
        .channel-card:hover { transform: scale(1.05); }
        .tv-bezel { background: #0f172a; padding: 1.5rem; border-radius: 1.5rem; box-shadow: inset 0 0 15px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.5); transition: all 0.3s ease-in-out; }
        #video-container .scanline-overlay { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.05) 50%), linear-gradient(90deg, rgba(0,0,0,0.05) 50%, rgba(255,255,255,0.03) 50%); background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 10; transition: opacity 0.3s ease-in-out; opacity: 1;}
        #floating-controls { opacity: 0; pointer-events: none; transition: opacity 0.3s ease-in-out; }
        #video-container:hover #floating-controls { opacity: 1; pointer-events: auto; }
        #loading-overlay span { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .channel-card.dragging { opacity: 0.5; }
        .channel-card.drag-over-active { border: 2px dashed var(--accent-color, #3b82f6); }

        /* --- Notificaciones --- */
        #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; font-size: 0.875rem; opacity: 0; transform: translateX(100%); animation: slideIn 0.3s forwards; }
        .toast.success { background-color: #16a34a; }
        .toast.error { background-color: #dc2626; }
        .toast.info { background-color: #2563eb; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

        /* --- Global Theme Styles --- */
        .theme-retro, .theme-light, .theme-neon, .theme-scifi { --main-bg: #fff; --secondary-bg: #f0f0f0; --accent-color: #3b82f6; --text-color: #000; }
        body { background-color: var(--main-bg, #020617); color: var(--text-color, #fff); transition: background-color 0.3s; }
        aside { background-color: var(--secondary-bg, #1e293b); }
        main { background: var(--main-bg, linear-gradient(to bottom right, #020617, #1e293b)); }
        #add-channel-button, .filter-btn.active-filter, #sync-button, #add-from-clipboard-btn { background-color: var(--accent-color, #2563eb); }
        #add-channel-button:hover, #sync-button:hover, #add-from-clipboard-btn:hover { filter: brightness(1.1); }
        .channel-card:hover { box-shadow: 0 0 15px var(--accent-color); }
        .modal-content, input, select { background-color: var(--secondary-bg, #1e293b); }
        input:focus { ring-color: var(--accent-color, #3b82f6) !important; }
        .custom-scroll::-webkit-scrollbar-track { background: var(--main-bg, #020617); }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--secondary-bg, #475569); }

        /* --- Tema Retro --- */
        .theme-retro { font-family: 'VT323', monospace; --main-bg: #4a3c36; --secondary-bg: #5d4a44; --accent-color: #f59e0b; --text-color: #e2d8ce; }
        .theme-retro .tv-bezel { background-image: linear-gradient(45deg, #6b4f3a 25%, #8c6d54 25%, #8c6d54 50%, #6b4f3a 50%, #6b4f3a 75%, #8c6d54 75%, #8c6d54 100%); background-size: 56.57px 56.57px; border: 10px solid #2b201c; padding: 1.5rem 1rem 1.5rem 10rem; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 5px 30px rgba(0,0,0,0.7); border-radius: 10px; position: relative; }
        .theme-retro .retro-details { position: absolute; left: 1rem; top: 1.5rem; bottom: 1.5rem; width: 8rem; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        .theme-retro .speaker-grille { width: 100%; height: 70%; background-image: repeating-linear-gradient(0deg, #2b201c, #2b201c 2px, transparent 2px, transparent 6px); }
        .theme-retro .knob-container { display: flex; justify-content: space-around; width: 100%; }
        .theme-retro .knob { width: 2.5rem; height: 2.5rem; background: #c7c7c7; border-radius: 50%; border: 3px solid #333; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .theme-retro .scanline-overlay { opacity: 0.15 !important; background: repeating-linear-gradient(to bottom, transparent, transparent 1px, rgba(0,0,0,0.5) 2px, rgba(0,0,0,0.5) 3px); }
        
        /* --- Tema Light --- */
        .theme-light { --main-bg: #e2e8f0; --secondary-bg: #ffffff; --accent-color: #0ea5e9; --text-color: #1e293b; }
        .theme-light .tv-bezel { background: #f8fafc; box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 0 20px rgba(0,0,0,0.1); }
        
        /* --- Tema Neon --- */
        .theme-neon { --main-bg: #1a0b2e; --secondary-bg: #2a114a; --accent-color: #f472b6; --text-color: #e9d5ff; background-image: linear-gradient(rgba(26,11,46,0.95), rgba(26,11,46,0.95)), repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(244,114,182,0.1) 35px, rgba(244,114,182,0.1) 70px); }
        .theme-neon h1, .theme-neon button, .theme-neon .active-filter { text-shadow: 0 0 5px var(--accent-color); }
        .theme-neon .tv-bezel { border: 2px solid var(--accent-color); box-shadow: inset 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); }
        
        /* --- Tema Sci-Fi --- */
        .theme-scifi { font-family: 'Orbitron', sans-serif; --main-bg: #031027; --secondary-bg: #071f48; --accent-color: #00d9ff; --text-color: #a7dfff; }
        .theme-scifi .tv-bezel { padding: 0.5rem; background: transparent; border: 2px solid var(--accent-color); border-radius: 0; clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px)); }
        
        /* --- Pantalla Completa --- */
        #app:fullscreen {
            background-color: black;
        }
        #app:fullscreen > aside,
        #app:fullscreen > main #controls-container,
        #app:fullscreen #floating-controls { /* Hide floating controls in fullscreen */
            display: none;
        }
        #app:fullscreen > main {
            padding: 0;
            margin: 0;
            height: 100vh;
        }
        #app:fullscreen .tv-bezel { padding: 0 !important; border-radius: 0; box-shadow: none; border: none; background: #000; clip-path: none !important; }
        #app:fullscreen .scanline-overlay, 
        #app:fullscreen .retro-details { display: none; }
        #app:fullscreen.hide-cursor { cursor: none; }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="toast-container"></div>
    <div id="app" class="flex flex-col md:flex-row h-screen">
        <aside class="w-full md:w-80 flex flex-col p-4 border-r border-slate-700 relative">
            <header class="mb-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <svg class="w-10 h-10" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 3H4C2.89543 3 2 3.89543 2 5V17C2 18.1046 2.89543 19 4 19H8V21H16V19H20C21.1046 19 22 18.1046 22 17V5C22 3.89543 21.1046 3 20 3ZM20 17H4V5H20V17Z"/>
                        <path d="M8 7L11 10L8 13V7Z"/>
                        <path d="M13 7L16 10L13 13V7Z"/>
                    </svg>
                    <span class="text-2xl font-bold tracking-wider" style="font-family: 'Orbitron', sans-serif;">Dumb Box</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="settings-button" title="Ajustes" class="relative p-2 rounded-full hover:bg-slate-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0 3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        <span id="sync-error-indicator" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-slate-800"></span>
                    </button>
                </div>
            </header>
            <form id="youtube-search-form" class="mb-2">
                <div class="relative">
                    <input type="search" id="youtube-search-input" placeholder="Buscar en YouTube..." class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 pl-4 pr-10 focus:outline-none focus:ring-2">
                    <button type="submit" class="absolute top-0 right-0 h-full px-3 text-slate-400 hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </div>
                <div class="mt-2 flex items-center justify-center">
                    <input type="checkbox" id="live-filter" class="w-4 h-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-600 ring-offset-gray-800 focus:ring-2">
                    <label for="live-filter" class="ml-2 text-sm font-medium">Sólo "En Vivo"</label>
                </div>
            </form>

            <div id="filter-container" class="my-4 flex justify-center bg-slate-700 rounded-lg p-1">
                <button data-filter="all" class="filter-btn flex-1 py-1 px-2 rounded-md text-sm transition-colors duration-200">Todos</button>
                <button data-filter="favorites" class="filter-btn flex-1 py-1 px-2 rounded-md text-sm transition-colors duration-200">Favoritos</button>
                <button data-filter="watchLater" class="filter-btn flex-1 py-1 px-2 rounded-md text-sm transition-colors duration-200">Ver Después</button>
            </div>

            <div id="watch-later-container" class="mb-4 hidden">
                <button id="add-from-clipboard-btn" class="w-full py-2 px-4 rounded-lg transition-colors text-sm font-semibold flex items-center justify-center space-x-2">
                    <svg class="w-6 h-6 shrink-0" viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M28.462 3.42773C28.1885 2.44336 27.3828 1.6377 26.4023 1.36328C23.957 1 16 1 16 1C16 1 8.04297 1 5.59766 1.36328C4.61719 1.6377 3.81152 2.44336 3.53809 3.42773C3.17188 5.875 3.17188 10.875 3.17188 10.875C3.17188 10.875 3.17188 15.875 3.53809 18.3223C3.81152 19.3066 4.61719 20.1123 5.59766 20.3867C8.04297 20.75 16 20.75 16 20.75C16 16 23.957 20.75 26.4023 20.3867C27.3828 20.1123 28.1885 19.3066 28.462 18.3223C28.8281 15.875 28.8281 10.875 28.8281 10.875C28.8281 10.875 28.8281 5.875 28.462 3.42773Z" fill="#FF0000"/>
                        <path d="M13.1992 14.999V6.75L20.2793 10.875L13.1992 14.999Z" fill="white"/>
                        <g>
                            <circle cx="24" cy="18" r="7" fill="var(--accent-color, #2563eb)" stroke="var(--secondary-bg, #1e293b)" stroke-width="2"/>
                            <path d="M24 15V21M21 18H27" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        </g>
                    </svg>
                    <span>Pegar Enlace de YouTube</span>
                </button>
            </div>
            <div class="relative mb-2"><input type="search" id="channel-search-input" placeholder="Buscar en la lista..." class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 pl-4 pr-10 focus:outline-none focus:ring-2 text-sm"></div>
            <nav id="channel-list" class="flex-grow overflow-y-auto custom-scroll grid grid-cols-2 gap-2 pr-2"></nav>
            <div id="add-channel-container" class="absolute bottom-4 right-4">
                <button id="add-channel-button" class="w-14 h-14 rounded-full transition-colors text-2xl font-semibold flex items-center justify-center shadow-lg">+</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col p-4 md:p-6 lg:p-8 justify-center">
             <div class="tv-bezel w-full flex-1 flex">
                <div class="retro-details">
                    <div class="speaker-grille"></div>
                    <div class="knob-container">
                        <div class="knob"></div>
                        <div class="knob"></div>
                    </div>
                </div>
                <div id="video-container" class="w-full flex-1 bg-black rounded-lg shadow-2xl flex items-center justify-center relative overflow-hidden">
                    <div class="scanline-overlay"></div>
                    <div id="placeholder" class="text-center text-slate-400 p-4 w-full h-full flex flex-col justify-center items-center"><p class="z-10 font-mono">SELECCIONE UN CANAL</p></div>
                    <iframe id="video-player" class="hidden absolute top-0 left-0 w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"></iframe>
                    <div id="floating-controls" class="absolute top-1/2 right-4 -translate-y-1/2 flex flex-col space-y-3 z-20"><button id="zap-prev" title="Canal anterior" class="p-3 rounded-full bg-slate-800/70 hover:bg-slate-700 transition-colors backdrop-blur-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button><button id="zap-next" title="Canal siguiente" class="p-3 rounded-full bg-slate-800/70 hover:bg-slate-700 transition-colors backdrop-blur-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button></div>
                </div>
            </div>
            <div id="controls-container" class="mt-4 flex flex-col items-center space-y-2">
                <div class="flex items-center gap-2">
                    <h2 id="channel-title" class="text-xl h-7 font-semibold text-center truncate"></h2>
                </div>
                <div class="flex items-center space-x-3 md:space-x-4"><button id="power-button" title="Apagar TV" class="p-2 rounded-full bg-slate-700 hover:bg-red-600/50 transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9"></path></svg></button><button id="fullscreen-button" title="Pantalla Completa" class="p-2 rounded-full bg-slate-700 hover:bg-slate-600 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5" /></svg></button></div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="channel-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="modal-content bg-slate-800 rounded-lg p-6 w-full max-w-md shadow-xl border border-slate-700">
            <h3 id="modal-title" class="text-xl font-bold mb-4"></h3>
            <form id="channel-form" data-mode="edit">
                <input type="hidden" id="edit-channel-index">
                <div id="form-group-name" class="mb-4">
                    <label for="channel-name" class="block mb-2 text-sm font-medium">Nombre del Canal</label>
                    <input type="text" id="channel-name" class="w-full border border-slate-600 rounded-lg p-2.5" required>
                </div>
                <div id="form-group-type" class="mb-4">
                    <label class="block mb-2 text-sm font-medium">Tipo de Canal</label>
                    <div class="flex gap-4">
                        <div><input type="radio" id="type-embed" name="channel-type" value="youtube-embed" checked class="w-4 h-4 text-blue-600"><label for="type-embed" class="ml-2 text-sm font-medium">YouTube</label></div>
                        <div><input type="radio" id="type-external" name="channel-type" value="external-link" class="w-4 h-4 text-blue-600"><label for="type-external" class="ml-2 text-sm font-medium">Enlace Externo</label></div>
                    </div>
                </div>
                <div id="form-group-url" class="mb-4">
                    <label for="channel-url" id="channel-url-label" class="block mb-2 text-sm font-medium">URL del Canal</label>
                    <input type="text" id="channel-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full border border-slate-600 rounded-lg p-2.5" required>
                </div>
                 <div class="mb-6">
                    <button type="button" id="paste-url-button" class="w-full py-2 px-4 bg-slate-600 hover:bg-slate-500 rounded-lg flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM4 11a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4z" /></svg>
                        <span>Pegar URL del Portapapeles</span>
                    </button>
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="submit-channel-button" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 rounded-lg">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <div id="gist-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50"><div class="modal-content bg-slate-800 rounded-lg p-6 w-full max-w-md shadow-xl border border-slate-700"><h3 class="text-xl font-bold mb-2">Ajustes y Sincronización</h3>
        <div class="mb-6 border-b border-slate-700 pb-4">
            <h4 class="text-lg font-semibold mb-2">Tema Visual</h4>
            <label for="theme-select" class="sr-only">Seleccionar tema</label>
            <select id="theme-select" class="w-full border border-slate-600 rounded-lg p-2.5">
                <option value="modern">Moderno</option>
                <option value="retro">Retro TV</option>
                <option value="light">Minimalista (Claro)</option>
                <option value="neon">Neón</option>
                <option value="scifi">Sci-Fi</option>
            </select>
        </div>
        <div>
            <h4 class="text-lg font-semibold mb-2">Sincronización (Opcional)</h4>
            <p class="text-sm text-slate-400 mb-4">Conecta tu Gist de GitHub para guardar tus canales y listas en la nube.</p>
            <form id="gist-form">
                <div class="mb-4">
                    <label for="gist-id" class="block mb-2 text-sm font-medium">Gist ID</label>
                    <input type="text" id="gist-id" class="w-full border border-slate-600 rounded-lg p-2.5">
                </div>
                <div class="mb-4">
                    <label for="gist-token" class="block mb-2 text-sm font-medium">GitHub Token</label>
                    <input type="password" id="gist-token" class="w-full border border-slate-600 rounded-lg p-2.5">
                </div>
                <p id="gist-error" class="text-red-400 text-sm mb-4 h-5"></p>
                <p id="sync-status" class="text-green-400 text-sm text-center mb-2 h-5"></p>
                <div class="flex justify-between items-center">
                    <button type="button" id="disconnect-button" class="py-2 px-4 text-slate-400 hover:text-white text-sm">Modo Local</button>
                    <div>
                        <button type="button" id="close-settings-button" class="py-2 px-4 bg-slate-600 hover:bg-slate-500 rounded-lg mr-2">Cerrar</button>
                        <button type="submit" class="py-2 px-4 bg-blue-600 hover:bg-blue-700 rounded-lg">Guardar Ajustes</button>
                    </div>
                </div>
            </form>
            <button id="sync-button" class="w-full py-2 px-4 rounded-lg transition-colors text-sm font-semibold mt-4">Sincronizar Ahora</button>
        </div>
    </div></div>
    <div id="loading-overlay" class="hidden fixed inset-0 bg-black/70 flex-col flex items-center justify-center z-[60] text-white"><span class="block w-12 h-12 border-4 border-slate-500 border-t-white rounded-full mb-4"></span><p id="loading-text">Cargando...</p></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const body = document.body;
            const appEl = document.getElementById('app');
            const channelListEl = document.getElementById('channel-list');
            const videoPlayer = document.getElementById('video-player');
            const placeholder = document.getElementById('placeholder');
            const channelTitle = document.getElementById('channel-title');
            const powerButton = document.getElementById('power-button');
            const fullscreenButton = document.getElementById('fullscreen-button');
            const channelModal = document.getElementById('channel-modal');
            const addChannelButton = document.getElementById('add-channel-button');
            const channelForm = document.getElementById('channel-form');
            const modalTitle = document.getElementById('modal-title');
            const settingsButton = document.getElementById('settings-button');
            const gistModal = document.getElementById('gist-modal');
            const gistForm = document.getElementById('gist-form');
            const gistError = document.getElementById('gist-error');
            const syncStatus = document.getElementById('sync-status');
            const disconnectButton = document.getElementById('disconnect-button');
            const closeSettingsButton = document.getElementById('close-settings-button');
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            const themeSelect = document.getElementById('theme-select');
            const youtubeSearchForm = document.getElementById('youtube-search-form');

            async function fetchDataFromGist() {
                if (!gistId || !gistToken) return null;
                showLoading('Sincronizando...');
                try {
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${gistToken}` }});
                    if (!response.ok) {
                        if (response.status === 404) return { error: true, message: 'Gist ID no encontrado.' };
                        if (response.status === 401 || response.status === 403) return { error: true, message: 'Token inválido o sin permisos.' };
                        throw new Error(`[${response.status}] ${response.statusText}`);
                    }
                    const data = await response.json();
                    return data.files && data.files[GIST_FILENAME] ? JSON.parse(data.files[GIST_FILENAME].content) : null;
                } catch (error) {
                    console.error('Error fetching Gist:', error);
                    return { error: true, message: 'Error de red. Inténtalo de nuevo.' };
                } finally { hideLoading(); }
            }

            async function saveDataToGist() {
                if (!gistId || !gistToken) return;
                showLoading('Guardando...');
                const fullDataObject = { tvArgentinaApp: { channels: allChannels, favorites: favorites, watchLater: watchLaterList } };
                try {
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `token ${gistToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(fullDataObject, null, 2) } } })
                    });
                    if (!response.ok) throw new Error(`Error: ${response.statusText}`);
                } catch (error) {
                    console.error('Error saving to Gist:', error);
                    showToast('Error al guardar en Gist.', 'error');
                } finally { hideLoading(); }
            }

                watchLaterList = (localData && localData.watchLater) || [];

            function saveDataToLocalStorage() {

            function handleDrop(e) { e.stopPropagation(); const dragEndIndex = parseInt(this.dataset.index); swapItems(dragStartIndex, dragEndIndex); this.classList.remove('drag-over-active'); }
            function handleDragEnd() { this.classList.remove('dragging'); document.querySelectorAll('.drag-over-active').forEach(el => el.classList.remove('drag-over-active')); }

            function renderChannelList() {
                channelListEl.innerHTML = '';
                let itemsToRender = [];
                let message = '';
                const searchTerm = channelSearchInput.value.toLowerCase();
                
                if (currentFilter === 'all') {
                    itemsToRender = allChannels; 
                } else if (currentFilter === 'favorites') {
                    itemsToRender = allChannels.filter(c => c.type === 'youtube-embed' && favorites.includes(c.id)); 
                    message = 'No has agregado canales a favoritos.'; 
                } else if (currentFilter === 'watchLater') {
                    itemsToRender = watchLaterList.map((item, index) => ({...item, name: `Video ${index + 1}`, isWatchLater: true})); 
                    message = 'No tienes videos para ver después.';

                if (searchTerm) {
                    itemsToRender = itemsToRender.filter(item => item.name.toLowerCase().includes(searchTerm)); 
                }

                }

                itemsToRender.forEach((item, renderIndex) => {
                    const channel = item.isWatchLater ? { id: item.id, name: item.title, type: 'youtube-embed' } : item;

                    const realIndex = item.isWatchLater ? -1 : allChannels.findIndex(c => (c.id || c.url) === (item.id || item.url));

            function handleChannelClick(channel) {
                switch(channel.type) {
                    case 'youtube-embed': switchChannel(channel); break;
                    case 'external-link': window.open(channel.url, '_blank'); break;
                    case 'youtube-search': window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(channel.query)}&sp=EgJAAQ%253D%253D`, '_blank'); break;
                }
            }
            function toggleFavorite(channelId, starEl) {
                const index = favorites.indexOf(channelId);
                if (index > -1) { favorites.splice(index, 1); starEl?.classList.remove('favorited'); } 
                else { favorites.push(channelId); starEl?.classList.add('favorited'); }
                debouncedSave();
                if(currentFilter === 'favorites') renderChannelList();
            }
            function switchChannel(channel) {
                if(!channel || channel.type !== 'youtube-embed') return;
                placeholder.classList.add('hidden');
                videoPlayer.classList.remove('hidden');
                const embedUrl = `https://www.youtube.com/embed/${channel.id}?autoplay=1&mute=0`;
                if (videoPlayer.src !== embedUrl) videoPlayer.src = embedUrl;
                channelTitle.textContent = channel.name;
                
                currentChannelIndex = allChannels.findIndex(c => (c.id === channel.id || c.name === channel.name));
                localStorage.setItem('tv_last_watched_id', channel.id);
                updateActiveButtonState();
            }
            function updateActiveButtonState() {
                document.querySelectorAll('.channel-card.ring-2').forEach(el => el.classList.remove('ring-2', 'ring-blue-500'));

                if (currentChannelId) {
                    const activeChannelButton = channelListEl.querySelector(`[data-id="${currentChannelId}"]`);

            }

                const embeddableChannels = allChannels.filter(c => c.type === 'youtube-embed');
                if (currentFilter === 'favorites' && favorites.length > 0) {
                    return embeddableChannels.filter(c => favorites.includes(c.id));
                }
                return embeddableChannels;
            }
            function turnOffTv() {
                videoPlayer.src = 'about:blank';
                videoPlayer.classList.add('hidden');
                placeholder.classList.remove('hidden');
                channelTitle.textContent = '';
                currentChannelIndex = -1;
                updateActiveButtonState();

                appEl.addEventListener('mousemove', cursorMoveHandler);

            function isValidHttpUrl(string) {
                let url;
                try {
                    url = new URL(string);
                } catch (_) {
                    return false;  
                }
                return url.protocol === "http:" || url.protocol === "https:";
            }

            async function addChannelWithGemini(query) {
                showLoading('Buscando con IA...');
                const apiKey = ""; // Provided by environment
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                const systemPrompt = "You are an expert at finding YouTube live streams. Given a user query, find the most relevant YouTube live stream URL. You must return ONLY the full YouTube URL and nothing else. If no relevant live stream is found, return the text 'NOT_FOUND'.";
                
                const payload = {
                    contents: [{ parts: [{ text: `Find YouTube live stream for: ${query}` }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('API response was not ok.');
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text && text.trim().toUpperCase() !== 'NOT_FOUND') {
                        addChannelFromUrl(text.trim(), query);
                    } else {
                        showToast('No se encontró un canal en vivo con ese nombre.', 'error');
                    }
                } catch (error) {
                    console.error('Error calling Gemini API:', error);
                    showToast('Error al buscar con la IA.', 'error');
                } finally {
                    hideLoading();
                }
            }

            function addChannelFromUrl(url, nameFromQuery = null) {
                const videoId = extractYouTubeID(url);
                let newChannel;

                if (videoId) {
                    newChannel = { name: nameFromQuery || videoId, id: videoId, type: 'youtube-embed', isDefault: false };
                } else if (isValidHttpUrl(url)) {
                    const domain = new URL(url).hostname.replace('www.', '');
                    newChannel = { name: nameFromQuery || domain, url: url, type: 'external-link', isDefault: false };
                } else {
                    showToast('La URL proporcionada no es válida.', 'error');
                    return;
                }

                allChannels.push(newChannel);
                debouncedSave();
                renderChannelList();
                closeAllModals();
                showToast(`Canal "${newChannel.name}" agregado!`, 'success');
            }

            channelForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const mode = channelForm.dataset.mode;
                const urlInput = document.getElementById('channel-url').value.trim();
                
                if (mode === 'add') {
                    if (!urlInput) return;
                    if (isValidHttpUrl(urlInput)) {
                        addChannelFromUrl(urlInput);
                    } else {
                        await addChannelWithGemini(urlInput);
                    }
                } else { // mode === 'edit'
                    const name = document.getElementById('channel-name').value.trim();
                    const type = document.querySelector('input[name="channel-type"]:checked').value;
                    const editIndex = document.getElementById('edit-channel-index').value;
                    
                    if (!name || !urlInput || editIndex === '') return;

                    let channelData = { name, type };
                    if (type === 'youtube-embed') {
                        const videoId = extractYouTubeID(urlInput);
                        if(videoId) { channelData.id = videoId; delete channelData.url; }
                        else { showToast('La URL de YouTube no es válida.', 'error'); return; }
                    } else { 
                        channelData.url = urlInput;
                        delete channelData.id;
                    }
                    
                    allChannels[parseInt(editIndex)] = {...allChannels[parseInt(editIndex)], ...channelData};
                    debouncedSave();
                    renderChannelList();
                    closeAllModals();
                }
            });


            gistForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('gist-id').value.trim();
                const token = document.getElementById('gist-token').value.trim();
                
                localStorage.setItem('gist_id', id);
                localStorage.setItem('gist_token', token);

                closeAllModals();
                location.reload();
            });

            document.querySelectorAll('.filter-btn').forEach(button => { button.addEventListener('click', (e) => { 
                currentFilter = e.target.dataset.filter;
                updateFilterButtons(); 
                renderChannelList(); 
            }); });

            function updateFilterButtons() { 
                document.querySelectorAll('.filter-btn').forEach(btn => { 
                    btn.classList.toggle('active-filter', btn.dataset.filter === currentFilter); 
                });
                const isWatchLater = currentFilter === 'watchLater';
                watchLaterContainer.classList.toggle('hidden', !isWatchLater);
            }
            
            addFromClipboardBtn.addEventListener('click', async () => {
                if (!navigator.clipboard?.readText) {
                    showToast('Función no soportada por el navegador.', 'error');
                    return;
                }
                try {
                    const text = await navigator.clipboard.readText();
                    const videoId = extractYouTubeID(text);

                    if (videoId) {
                        if (!watchLaterList.some(item => item.id === videoId)) {
                            watchLaterList.push({ id: videoId, title: `Video ${watchLaterList.length + 1}`, added: new Date().toISOString() });
                            debouncedSave();
                            showToast('¡Video guardado!', 'success');
                            if (currentFilter === 'watchLater') renderChannelList();
                        } else {
                            showToast('Ese video ya está en la lista.', 'info');
                        }
                    } else {
                        showToast('No se encontró una URL de YouTube válida.', 'error');
                    }
                } catch (err) {
                    console.error('Failed to read clipboard:', err);
                    let errorMsg = 'No se pudo leer el portapapeles.';
                    if (err.name === 'NotAllowedError') {
                             errorMsg = 'Permiso para leer portapapeles denegado.';
                    }
                    showToast(errorMsg, 'error');
                }
            });

            pasteUrlButton.addEventListener('click', async () => {
                if (!navigator.clipboard?.readText) {
                    showToast('Función no soportada por el navegador.', 'error');
                    return;
                }
                try {
                    const text = await navigator.clipboard.readText();
                    const urlInput = document.getElementById('channel-url');
                    if (text) {
                        urlInput.value = text;
                        showToast('Enlace pegado desde el portapapeles.', 'success');
                    } else {
                        showToast('El portapapeles está vacío.', 'info');
                    }
                } catch (err) {
                    console.error('Failed to read clipboard:', err);
                    let errorMsg = 'No se pudo leer el portapapeles.';
                    if (err.name === 'NotAllowedError') {
                        errorMsg = 'Permiso para leer portapapeles denegado.';
                    }
                    showToast(errorMsg, 'error');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!channelModal.classList.contains('hidden') || !gistModal.classList.contains('hidden')) {
                        closeAllModals();
                        return;
                    }
                }
                if (!channelModal.classList.contains('hidden') || !gistModal.classList.contains('hidden') || document.activeElement.tagName === 'INPUT') {
                    return;
                }
                const zap = (direction) => {
                    const channelsToZap = getZappableChannels();
                    if(channelsToZap.length === 0) return;
                    let currentId = currentChannelIndex > -1 ? allChannels[currentChannelIndex]?.id : null;
                    let currentIndexInZapList = channelsToZap.findIndex(c => c.id === currentId);
                    if (currentIndexInZapList === -1) currentIndexInZapList = 0;
                    let nextIndex = (currentIndexInZapList + direction + channelsToZap.length) % channelsToZap.length;
                    switchChannel(channelsToZap[nextIndex]);
                };
                switch(e.key) {
                    case 'ArrowUp': e.preventDefault(); zap(-1); break;
                    case 'ArrowDown': e.preventDefault(); zap(1); break;
                    case 'p': case 'P': powerButton.click(); break;
                    case 'f': case 'F':
                        if (currentChannelIndex > -1) {
                            const currentChannel = allChannels[currentChannelIndex];
                            if (currentChannel.type === 'youtube-embed') {
                                toggleFavorite(currentChannel.id, channelListEl.querySelector(`[data-id="${currentChannel.id}"] .favorite-star`));
                            }
                        }
                        break;
                }
            });

            async function forceSync() {
                if (gistId && gistToken) {
                    gistError.textContent = '';
                    syncStatus.textContent = '';
                    const gistData = await fetchDataFromGist();
                     if (gistData && !gistData.error) {
                        if (gistData.tvArgentinaApp) {
                            allChannels = gistData.tvArgentinaApp.channels || initialChannels;
                            favorites = gistData.tvArgentinaApp.favorites || [];
                            watchLaterList = gistData.tvArgentinaApp.watchLater || [];
                            saveDataToLocalStorage();
                            renderChannelList();
                            syncStatus.textContent = 'Sincronización completada.';
                            syncErrorIndicator.classList.add('hidden');
                            gistStartupError = null;
                        } else {
                               gistError.textContent = 'No se encontraron datos en Gist.';
                        }
                    } else if (!gistData) {
                        gistError.textContent = 'Gist o archivo no encontrado.';
                    } else if (gistData.error) {
                        gistError.textContent = gistData.message;
                    }
                } else {
                    gistError.textContent = 'Conecta tu Gist primero.';
                }
                    setTimeout(() => { 
                        gistError.textContent = '';
                        syncStatus.textContent = '';
                    }, 3000);
            }
            syncButton.addEventListener('click', forceSync);

            themeSelect.addEventListener('change', (e) => {
                const selectedTheme = e.target.value;
                applyTheme(selectedTheme);
                localStorage.setItem('tv_theme', selectedTheme);
            });
            powerButton.addEventListener('click', turnOffTv);
            fullscreenButton.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    appEl.requestFullscreen().catch(err => {
                        console.error("Native fullscreen failed:", err);
                    });
                } else { 
                    document.exitFullscreen();
                }
            });
            document.addEventListener('fullscreenchange', () => {
                const isFullscreen = !!document.fullscreenElement;
                if (isFullscreen) {
                    handleCursorInactivity();
                } else {
                    clearCursorInactivity();
                }
            });

            addChannelButton.addEventListener('click', openAddModal);
            
            channelModal.addEventListener('click', (e) => {
                if (e.target.id === 'channel-modal') {
                    closeAllModals();
                }
            });
             gistModal.addEventListener('click', (e) => {
                if (e.target.id === 'gist-modal') {
                    closeAllModals();
                }
            });

            settingsButton.addEventListener('click', () => {
                document.getElementById('gist-id').value = gistId || '';
                document.getElementById('gist-token').value = gistToken || '';
                gistError.textContent = gistStartupError || '';
                gistModal.classList.remove('hidden');
            });
            disconnectButton.addEventListener('click', () => {
                localStorage.removeItem('gist_id');
                localStorage.removeItem('gist_token');
                gistId = null;
                gistToken = null;
                closeAllModals();
                location.reload();
            });
            closeSettingsButton.addEventListener('click', () => closeAllModals());

            async function initializeApp() {
                initializeTheme();
                gistId = localStorage.getItem('gist_id');
                gistToken = localStorage.getItem('gist_token');
                
                let loadLocalData = true;

                if (gistId && gistToken) {
                    const gistData = await fetchDataFromGist();
                    if (gistData && !gistData.error) {
                        loadLocalData = false;
                        if (gistData.tvArgentinaApp) {
                            allChannels = gistData.tvArgentinaApp.channels || initialChannels;
                            favorites = gistData.tvArgentinaApp.favorites || [];
                            watchLaterList = gistData.tvArgentinaApp.watchLater || [];
                        } else {
                            loadDataFromLocalStorage();
                            await saveDataToGist(); 
                        }
                    } else if (gistData && gistData.error) {
                       gistStartupError = gistData.message;
                       syncErrorIndicator.classList.remove('hidden');
                    }
                }
                
                if (loadLocalData) {
                    loadDataFromLocalStorage();
                }
                
                updateFilterButtons();
                renderChannelList();

                const lastWatchedId = localStorage.getItem('tv_last_watched_id');
                if(lastWatchedId) {
                    const lastChannel = allChannels.find(c => c.id === lastWatchedId && c.type === 'youtube-embed');
                    if(lastChannel) {
                        setTimeout(() => switchChannel(lastChannel), 500);
                    }
                }
            }
            initializeApp();
        });
    </script>
</body>
</html>
