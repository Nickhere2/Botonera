<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Accesos v28 - Diseño Optimizado</title>
    <!-- Logo del Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        /* --- NUEVO DISEÑO MODERNO Y LIMPIO --- */
        :root {
            --background: #f4f4f5; /* Gris muy claro */
            --foreground: #18181b; /* Negro suave */
            --card-background: #ffffff;
            --card-foreground: #18181b;
            --sidebar-background: #ffffff;
            --primary: #6d28d9; /* Púrpura */
            --primary-foreground: #ffffff;
            --primary-hover: #5b21b6;
            --secondary: #e4e4e7;
            --secondary-foreground: #18181b;
            --muted: #f4f4f5;
            --muted-foreground: #71717a;
            --accent: #f5f3ff;
            --accent-foreground: #4c1d95;
            --border: #e4e4e7;
            --ring: #6d28d9;
            --radius: 0.75rem;
            --note-bg: #fefce8;
            --task-bg: #eff6ff;
            --prompt-bg: #f0fdf4; /* Verde claro para prompts */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        .dark {
            --background: #09090b;
            --foreground: #fafafa;
            --card-background: #18181b;
            --card-foreground: #fafafa;
            --sidebar-background: #18181b;
            --primary: #7c3aed;
            --primary-foreground: #fafafa;
            --primary-hover: #8b5cf6;
            --secondary: #27272a;
            --secondary-foreground: #fafafa;
            --muted: #27272a;
            --muted-foreground: #a1a1aa;
            --accent: #27272a;
            --accent-foreground: #a78bfa;
            --border: #27272a;
            --ring: #7c3aed;
            --note-bg: #3f3f17;
            --task-bg: #1e293b;
            --prompt-bg: #162a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- LAYOUT PRINCIPAL --- */
        .sidebar {
            background-color: var(--sidebar-background);
            border-right: 1px solid var(--border);
            width: 280px;
            transition: width 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .sidebar.is-collapsed { width: 80px; }
        .sidebar.is-collapsed .sidebar-header .font-bold, 
        .sidebar.is-collapsed .nav-link span, 
        .sidebar.is-collapsed .sidebar-footer .nav-link-text, 
        .sidebar.is-collapsed #global-search-container,
        .sidebar.is-collapsed #agenda-widget .agenda-header-title,
        .sidebar.is-collapsed #agenda-widget .agenda-content {
            display: none;
        }
        .sidebar.is-collapsed .sidebar-header,
        .sidebar.is-collapsed #agenda-widget .agenda-header { 
            justify-content: center; 
        }
         .sidebar.is-collapsed .nav-link, .sidebar.is-collapsed .sidebar-footer a {
            justify-content: center;
        }
        .sidebar.is-collapsed .sidebar-footer {
            align-items: center;
        }

        main { transition: margin-left 0.3s ease-in-out; }

        /* --- COMPONENTES --- */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .list-view { display: flex; flex-direction: column; gap: 0.75rem; }
        .table-view { display: flex; flex-wrap: wrap; gap: 1rem; }

        .card, .list-item, .table-item {
            background: var(--card-background);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            transition: all 0.2s ease-in-out;
            position: relative;
            cursor: pointer;
        }
        .card:hover, .list-item:hover, .table-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .card.is-favorite, .list-item.is-favorite, .table-item.is-favorite { box-shadow: 0 0 0 2px var(--primary); }

        .card {
            display: flex;
            flex-direction: column;
            height: 250px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            justify-content: flex-end;
            color: white;
        }
        
        .list-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            gap: 1rem;
        }

        .table-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            padding: 0.5rem;
        }


        .card-overlay {
            padding: 1rem;
            width: 100%;
            position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%);
        }
        .card-bg-preview {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease;
        }
        .card:hover .card-bg-preview { transform: scale(1.05); }

        .note-card, .task-card, .prompt-card {
            justify-content: flex-start;
            height: 250px;
            color: var(--card-foreground);
            padding: 1.25rem;
        }
        .note-card { background: var(--note-bg); }
        .task-card { background: var(--task-bg); }
        .prompt-card { background: var(--prompt-bg); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-weight: 600;
            transition: all 0.2s;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .btn-primary { background-color: var(--primary); color: var(--primary-foreground); border-color: var(--primary);}
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--secondary); color: var(--secondary-foreground); border-color: var(--border);}
        .btn-secondary:hover { background-color: var(--accent); }
        .btn-ghost { background-color: transparent; color: var(--muted-foreground); }
        .btn-ghost:hover { background-color: var(--secondary); color: var(--secondary-foreground); }

        .input-base {
            background: var(--card-background);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem 0.75rem;
            width: 100%;
            transition: all 0.2s;
        }
        .dark .input-base { background: #27272a; }
        .input-base:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-weight: 500;
            color: var(--muted-foreground);
            transition: background-color 0.2s, color 0.2s;
        }
        .nav-link:hover { background-color: var(--muted); color: var(--foreground); }
        .nav-link.active { background-color: var(--accent); color: var(--accent-foreground); font-weight: 600; }
        
        .card-actions, .list-item-actions, .table-item-actions { opacity: 0; transition: opacity 0.2s; }
        .card:hover .card-actions, .list-item:hover .list-item-actions, .table-item:hover .table-item-actions { opacity: 1; }

        .modal-overlay { background-color: rgba(9, 9, 11, 0.8); backdrop-filter: blur(4px); }
        .modal-container { background-color: var(--card-background); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
        
        #global-view-switcher button.active { background-color: var(--accent-foreground); color: var(--accent); }

        .agenda-content {
            max-height: 200px;
            overflow-y: auto;
            transition: max-height 0.3s ease-in-out, margin-top 0.3s ease-in-out;
        }
        .agenda-header .actions .btn { opacity: 0; transition: opacity 0.2s ease; }
        .agenda-header:hover .actions .btn { opacity: 1; }
        .event-item .actions { opacity: 0; transition: opacity 0.2s ease; }
        .event-item:hover .actions { opacity: 1; }
        
        kbd {
            background-color: var(--secondary);
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--secondary-foreground);
            display: inline-block;
            font-family: monospace;
            font-size: .85em;
            font-weight: 700;
            line-height: 1;
            padding: 2px 6px;
        }
        .dark kbd {
             background-color: #3f3f46;
             border-color: #52525b;
        }

    </style>
</head>
<body class="dark"> <!-- Inicia en modo oscuro por defecto -->

    <div class="main-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-40 p-4 flex-shrink-0 flex flex-col transform -translate-x-full lg:translate-x-0">
            <!-- Sidebar Header -->
            <div class="sidebar-header flex items-center justify-between pb-4 px-2">
                 <div class="flex items-center gap-3">
                    <img src="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png" alt="Logo" class="w-10 h-10">
                 </div>
                 <button id="sidebar-toggle" class="btn btn-ghost !p-2 hidden lg:inline-flex" title="Colapsar barra lateral">
                     <i class="fas fa-angle-double-left"></i>
                 </button>
            </div>
            
            <!-- Global Search -->
            <div id="global-search-container" class="px-2 pb-4">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="global-search-input" placeholder="Buscar..." class="input-base w-full !pl-9">
                </div>
            </div>

            <!-- Main Navigation -->
            <nav id="main-nav" class="flex-grow space-y-2 px-2">
                <a href="#" data-section="buscadores" class="nav-link active"><i class="fas fa-search w-5 text-center"></i><span>Buscadores</span></a>
                <a href="#" data-section="links" class="nav-link"><i class="fas fa-link w-5 text-center"></i><span>Links</span></a>
                <a href="#" data-section="prompts" class="nav-link"><i class="fas fa-brain w-5 text-center"></i><span>Prompts</span></a>
                <a href="#" data-section="notes-tasks" class="nav-link"><i class="fas fa-check-double w-5 text-center"></i><span>Notas y Tareas</span></a>
            </nav>
            
            <!-- Agenda Widget Container -->
            <div id="sidebar-agenda-container" class="px-2 mt-4 border-t border-border pt-4"></div>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer mt-auto flex flex-col gap-2 px-2">
                <a href="#" id="open-settings-help" class="nav-link"><i class="fas fa-cog w-5 text-center"></i><span class="nav-link-text">Ajustes y Ayuda</span></a>
                <a href="#" id="fab-theme" class="nav-link"><i class="fas fa-palette w-5 text-center"></i><span class="nav-link-text">Cambiar Tema</span></a>
                <div id="sync-status" class="text-xs flex items-center gap-2 opacity-70 p-2 justify-center">
                    <i id="sync-icon" class="fas fa-cloud"></i>
                    <span id="sync-text">Sincronizado</span>
                </div>
            </div>
        </aside>
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto lg:ml-[280px]">
            <header class="header flex flex-col md:flex-row justify-between items-center mb-6 pb-4 gap-4">
                 <div class="flex items-center gap-4 w-full md:w-auto">
                    <button id="menu-toggle" class="lg:hidden btn btn-ghost !p-2">
                          <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 id="main-title" class="text-2xl sm:text-3xl font-bold tracking-tight">BUSCADORES</h1>
                 </div>
                <div class="flex items-center gap-2 sm:gap-4 w-full md:w-auto">
                    <div id="global-view-switcher" class="view-switcher flex items-center bg-secondary p-1 rounded-lg ml-auto">
                        <button data-view="grid" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-th-large"></i></button>
                        <button data-view="list" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-bars"></i></button>
                        <button data-view="table" title="Vista de Iconos" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-th"></i></button>
                        <button data-view="kanban" title="Vista Kanban" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-columns"></i></button>
                    </div>
                    <button id="addNewButton" class="btn btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        <span class="hidden sm:inline">Nuevo</span>
                    </button>
                </div>
            </header>
            
            <div id="section-buscadores" class="section"></div>
            <div id="section-links" class="section hidden"></div>
            <div id="section-prompts" class="section hidden"></div>
            <div id="section-notes-tasks" class="section hidden"></div>
        </main>
    </div>
    
    <!-- MODALS & OVERLAYS -->
    <div id="editPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="eventPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="settingsHelpPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="toast" class="hidden fixed bottom-5 right-5 p-4 rounded-lg font-bold z-[2000] shadow-lg" style="background-color: var(--primary); color: var(--primary-foreground);"></div>
    <div id="confirmModal" class="hidden fixed inset-0 z-[1100] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="preview-modal" class="hidden fixed z-[1300] w-80 h-60 p-1 bg-card-background rounded-lg shadow-lg pointer-events-none transition-opacity duration-200 opacity-0">
        <div id="preview-modal-content" class="w-full h-full bg-cover bg-center rounded-md border border-border"></div>
    </div>

<script>
// --- STATE & CONFIG ---
const FILENAME_IN_GIST = 'Botones.json';
let data = { items: [], categories: {}, categoryOrders: {}, favoriteOrder: [], events: [] };
const views = ['grid', 'list', 'table', 'kanban'];
let globalView = localStorage.getItem('globalView') || 'grid';
const themes = ['dark', 'light'];
let currentTheme = localStorage.getItem('theme') || 'dark';
let previewTimeout = null;

// --- MOCK DATA (Fallback) ---
const mockData = {
    items: [
        { id: 1, type: 'Buscador', title: 'Google', action: 'https://www.google.com/search?q={search_term}', category: 'General', icon: 'fab fa-google', tags: ['motor', 'busqueda'], isFavorite: true },
        { id: 2, type: 'Buscador', title: 'YouTube', action: 'https://www.youtube.com/results?search_query={search_term}', category: 'Video', icon: 'fab fa-youtube', tags: ['videos', 'tutoriales'], isFavorite: false },
        { id: 3, type: 'Link', title: 'GitHub', action: 'https://github.com', category: 'Desarrollo', icon: 'fab fa-github', tags: ['codigo', 'proyectos'], isFavorite: true },
        { id: 4, type: 'Promp', title: 'Generar Idea', action: 'Crea una lista de 5 ideas para un video de YouTube sobre IA.', category: 'Creatividad', icon: 'fas fa-lightbulb', tags: ['ideas'], isFavorite: false },
        { id: 5, type: 'Nota', title: 'Reunión Lunes', action: '<div>Discutir presupuesto Q3.</div><div>Revisar métricas.</div><div>Asignar tareas.</div>', category: 'Trabajo', icon: 'fas fa-sticky-note', tags: ['reunion'], isFavorite: false },
        { id: 6, type: 'Tarea', title: 'Proyecto Web', action: [{text: 'Diseñar mockup', status: true}, {text: 'Desarrollar landing', status: false}], category: 'Proyectos', icon: 'fas fa-tasks', tags: ['web'], isFavorite: true }
    ],
    categories: { 'Video': {}, 'Desarrollo': {} },
    categoryOrders: { buscadores: ["General", "Video"], links: ["Desarrollo"], prompts: ["Creatividad"], "notes-tasks": [] },
    favoriteOrder: [1, 3],
    events: [
        { id: 1, title: 'Cumpleaños de Ana', date: '2000-09-15', type: 'birthday', note: 'Comprar regalo.', reminderDays: 7 },
        { id: 2, title: 'Entrega Proyecto Final', date: '2025-09-20', type: 'reminder', note: '', reminderDays: 3 },
        { id: 3, title: 'Cumpleaños de Juan', date: '1995-09-18', type: 'birthday', note: '', reminderDays: 1 }
    ]
};


// --- DATA HANDLING ---
function ensureAllIcons() {
    if (!data.items) return;
    data.items.forEach(item => {
        if ((item.type === 'Link' || item.type === 'Buscador') && !item.icon) {
            try {
                const url = new URL(item.action);
                item.icon = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
            } catch (e) {
                console.error(`URL inválida para auto-generar favicon para "${item.title}":`, item.action);
            }
        }
    });
}

async function loadData() {
    let gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        data = JSON.parse(JSON.stringify(mockData));
        ensureAllIcons();
        initializeUI();
        return;
    }
    updateSyncStatus('loading');
    const token = localStorage.getItem('github_pat');
    const headers = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) { headers['Authorization'] = `token ${token}`; }

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const gistData = await response.json();
        const fileContent = gistData.files[FILENAME_IN_GIST]?.content;
        if (!fileContent) {
            showToast("Archivo no encontrado en Gist. Usando datos de ejemplo.");
            data = JSON.parse(JSON.stringify(mockData));
        } else {
            let loadedJson = JSON.parse(fileContent);
            const defaults = { items: [], categories: {}, categoryOrders: {}, favoriteOrder: [], events: [] };
            data = { ...defaults, ...loadedJson };
            data.items = (data.items || []).map(i => ({...i, isFavorite: i.isFavorite || false}));
            if (!data.favoriteOrder) {
                data.favoriteOrder = data.items.filter(i => i.isFavorite).map(i => i.id);
            }
            showToast("Datos cargados desde Gist.");
        }
        updateSyncStatus('synced');
    } catch (error) {
        console.error("Fallo al cargar datos:", error);
        showToast(`Error al cargar: ${error.message}.`);
        updateSyncStatus('error', 'Error de carga');
        data = JSON.parse(JSON.stringify(mockData));
    }
    ensureAllIcons();
    initializeUI();
}

async function saveData() {
    const gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        updateSyncStatus('local');
        return;
    }
    
    let token = localStorage.getItem('github_pat');
    if (!token) {
        showToast("Falta token de GitHub. Guardado localmente.");
        updateSyncStatus('error', 'Falta token');
        return;
    }
    
    updateSyncStatus('saving');

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify(data, null, 2)
        });
        if (!response.ok) {
             if(response.status === 401 || response.status === 404) {
                   showToast("Token inválido. Revisa la configuración.");
                   updateSyncStatus('error', 'Token inválido');
             }
             throw new Error(`Error al guardar: ${response.status}`)
        };
        showToast("Cambios guardados en Gist.");
        updateSyncStatus('synced');
    } catch (error) {
        console.error("Fallo al guardar en Gist:", error);
        showToast("Error al guardar en Gist.");
        updateSyncStatus('error', 'Error al guardar');
    }
}

// --- UI INITIALIZATION & EVENT LISTENERS ---
document.addEventListener("DOMContentLoaded", () => {
    loadData();
    setupEventListeners();
});

function debounce(func, delay) {
    let timeout;
    return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
    };
}

function setupEventListeners() {
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.querySelector('main');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
        sidebar.classList.toggle('is-collapsed');
        if (window.innerWidth >= 1024) {
           mainContent.style.marginLeft = sidebar.classList.contains('is-collapsed') ? '80px' : '280px';
        }
    });

    const overlay = document.getElementById('sidebar-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const toggleMobileSidebar = () => {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    };
    menuToggle.addEventListener('click', toggleMobileSidebar);
    overlay.addEventListener('click', toggleMobileSidebar);

    document.getElementById('main-nav').addEventListener('click', (e) => {
        const navLink = e.target.closest('.nav-link');
        if (navLink) {
            e.preventDefault();
            switchTab(navLink.dataset.section);
            if (window.innerWidth < 1024) toggleMobileSidebar();
        }
    });

    document.getElementById('global-search-input').addEventListener('input', debounce(applyGlobalFilter, 300));
    
    document.getElementById('addNewButton').addEventListener('click', () => openEditPanel());
    document.getElementById('fab-theme').addEventListener('click', changeTheme);
    document.getElementById('open-settings-help').addEventListener('click', openSettingsHelpModal);
    
    document.getElementById('global-view-switcher').addEventListener('click', (e) => {
        const button = e.target.closest('button');
        if(button && button.dataset.view) {
            globalView = button.dataset.view;
            localStorage.setItem('globalView', globalView);
            document.querySelectorAll('#global-view-switcher button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            refreshUI();
        }
    });
}

function initializeUI() {
    applyTheme(currentTheme);
    if (window.innerWidth >= 1024) {
        document.querySelector('main').style.marginLeft = '280px';
    }
    switchTab('buscadores');
    renderAgendaWidget();
    document.querySelector(`#global-view-switcher button[data-view="${globalView}"]`).classList.add('active');
}

function refreshUI() {
    const activeSection = document.querySelector('#main-nav .active')?.dataset.section || 'buscadores';
    applyGlobalFilter();
    renderAgendaWidget();
}

function switchTab(tabName) {
    document.querySelectorAll("#main-nav .nav-link").forEach(b => b.classList.remove("active"));
    const activeLink = document.querySelector(`#main-nav .nav-link[data-section="${tabName}"]`);
    activeLink.classList.add("active");
    
    document.getElementById('main-title').textContent = activeLink.querySelector('span').textContent;

    document.querySelectorAll(".section").forEach(s => s.classList.add("hidden"));
    document.getElementById(`section-${tabName}`).classList.remove("hidden");
    
    const kanbanButton = document.querySelector('#global-view-switcher button[data-view="kanban"]');
    kanbanButton.style.display = (tabName === 'notes-tasks') ? 'inline-flex' : 'none';
    if(globalView === 'kanban' && tabName !== 'notes-tasks') {
        globalView = 'grid';
        localStorage.setItem('globalView', globalView);
        document.querySelectorAll('#global-view-switcher button').forEach(b => b.classList.remove('active'));
        document.querySelector('#global-view-switcher button[data-view="grid"]').classList.add('active');
    }

    applyGlobalFilter();
}

// --- RENDER FUNCTIONS ---
function renderSection(sectionName, itemsToRender, searchTerm = '') {
    const container = document.getElementById(`section-${sectionName}`);
    container.innerHTML = '';

    if (sectionName === 'notes-tasks') {
        renderNotesAndTasksSection(container, itemsToRender, searchTerm);
        return;
    }

    if (itemsToRender.length === 0) {
        renderEmptyState(container, sectionName);
        return;
    }
    
    renderFavoritesBar(container, itemsToRender);

    const categorized = itemsToRender.reduce((acc, item) => {
        const category = item.category || 'Sin Categoría';
        if (!acc[category]) acc[category] = [];
        acc[category].push(item);
        return acc;
    }, {});

    const sectionOrders = data.categoryOrders?.[sectionName] || [];
    const sortedCategories = [...sectionOrders, ...Object.keys(categorized).filter(c => !sectionOrders.includes(c))];

    sortedCategories.forEach(categoryName => {
        if (categorized[categoryName] && categorized[categoryName].length > 0) {
            const catWrapper = document.createElement('div');
            catWrapper.className = 'mb-12';
            
            let editButtonHTML = '';
            if (categoryName !== 'Sin Categoría') {
                editButtonHTML = `<button onclick="openCategoryEditModal(event, '${categoryName}')" class="btn btn-ghost !p-2 text-muted-foreground hover:text-foreground" title="Editar categoría"><i class="fas fa-pencil-alt text-sm"></i></button>`;
            }
            catWrapper.innerHTML = `<div class="flex items-center gap-2 mb-4"><h2 class="text-xl font-bold text-muted-foreground">${categoryName}</h2>${editButtonHTML}</div>`;

            const contentContainer = document.createElement('div');
            
            const viewClasses = { grid: 'card-grid', list: 'list-view', table: 'table-view' };
            contentContainer.className = viewClasses[globalView] || 'card-grid';
            
            categorized[categoryName].forEach(item => {
                let element;
                if (globalView === 'grid') {
                     if (item.type === 'Nota') element = createNoteCard(item, searchTerm);
                     else if (item.type === 'Tarea') element = createTaskCard(item, searchTerm);
                     else if (item.type === 'Promp') element = createPromptCard(item, searchTerm);
                     else element = createCard(item, searchTerm);
                } else if (globalView === 'list') {
                    element = createListItem(item, searchTerm);
                } else if (globalView === 'table') {
                    element = createTableItem(item, searchTerm);
                }
                
                if (element) contentContainer.appendChild(element);
            });

            catWrapper.appendChild(contentContainer);
            container.appendChild(catWrapper);
        }
    });
}

// --- ACTIONS & EVENT HANDLERS ---
function handleCardClick(id, event) {
    if (event.target.closest('button, input')) return; 
    const item = data.items.find(i => String(i.id) === String(id));
    if (!item) return;

    if (item.type === "Link") {
        window.open(item.action, "_blank");
    } else if (item.type === "Buscador") {
        const term = prompt(`Buscar en ${item.title}:`);
        if (term) window.open(item.action.replace('{search_term}', encodeURIComponent(term)), '_blank');
    } else if (item.type === "Promp") {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.action;
        navigator.clipboard.writeText(tempDiv.textContent || tempDiv.innerText).then(() => showToast("Prompt copiado."));
    } else {
        openEditPanel(id);
    }
}

function toggleFavorite(event, itemId) {
    event.stopPropagation();
    const item = data.items.find(i => String(i.id) === String(itemId));
    if (item) {
        item.isFavorite = !item.isFavorite;
        
        const numericId = parseInt(itemId, 10);
        if (item.isFavorite) {
            if (!data.favoriteOrder.includes(numericId)) data.favoriteOrder.push(numericId);
        } else {
            data.favoriteOrder = data.favoriteOrder.filter(id => id !== numericId);
        }
        
        saveData().then(refreshUI);
    }
}


function applyGlobalFilter() {
    const searchTerm = document.getElementById('global-search-input').value.toLowerCase();
    const activeNavBtn = document.querySelector('.nav-link.active');
    if (!activeNavBtn) return;
    
    let activeSectionName = activeNavBtn.dataset.section;
    
    const typeMap = { 'buscadores': 'Buscador', 'links': 'Link', 'prompts': 'Promp', 'notes-tasks': ['Nota', 'Tarea'] };
    const activeType = typeMap[activeSectionName];
    
    const itemsToFilter = data.items.filter(item => 
        Array.isArray(activeType) ? activeType.includes(item.type) : item.type === activeType
    );

    const results = itemsToFilter.filter(card => {
        if (!searchTerm) return true;
        const titleMatch = card.title.toLowerCase().includes(searchTerm);
        const categoryNameMatch = (card.category || '').toLowerCase().includes(searchTerm);
        const tagListMatch = (card.tags || []).join(' ').toLowerCase().includes(searchTerm);
        
        let contentMatch = false;
        if (typeof card.action === 'string') {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = card.action;
            contentMatch = (tempDiv.textContent || tempDiv.innerText).toLowerCase().includes(searchTerm);
        } else if (Array.isArray(card.action)) {
            contentMatch = card.action.some(task => task.text.toLowerCase().includes(searchTerm));
        }
        
        return titleMatch || categoryNameMatch || tagListMatch || contentMatch;
    });
    
    renderSection(activeSectionName, results, searchTerm);
}

function getUpcomingEvents(days) {
    if (!data.events || data.events.length === 0) return [];
    
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const upcoming = data.events.map(event => {
        const eventDate = new Date(event.date);
        let nextOccurrence = new Date(event.date);

        if (event.type === 'birthday' || event.type === 'anniversary') {
            nextOccurrence = new Date(today.getFullYear(), eventDate.getMonth(), eventDate.getDate());
            if (nextOccurrence < today) {
                nextOccurrence.setFullYear(today.getFullYear() + 1);
            }
        }

        const diffTime = nextOccurrence - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        const reminderDays = parseInt(event.reminderDays) || 0;
        const isReminderActive = reminderDays > 0 && diffDays <= reminderDays;

        if (diffDays >= 0 && diffDays <= days) {
            return { ...event, date: nextOccurrence, daysLeft: diffDays, isReminderActive };
        }
        return null;
    }).filter(Boolean);

    return upcoming.sort((a, b) => a.date - b.date);
}

        </div>
    `;
    modal.classList.remove('hidden');
    document.getElementById('eventForm').onsubmit = handleSaveEvent;
}

function handleSaveEvent(event) {
    event.preventDefault();
    const id = document.getElementById('eventId').value;
    const newEvent = {
        id: id ? parseInt(id) : Date.now(),
        title: document.getElementById('eventTitle').value,
        date: document.getElementById('eventDate').value,
        type: document.getElementById('eventType').value,
        note: document.getElementById('eventNote').value,
        reminderDays: parseInt(document.getElementById('eventReminder').value) || 0
    };

    if (id) {
        const index = data.events.findIndex(e => e.id === newEvent.id);
        if (index !== -1) data.events[index] = newEvent;
    } else {
        if (!data.events) data.events = [];
        data.events.push(newEvent);
    }
    document.getElementById('eventPanel').classList.add('hidden');
    saveData().then(refreshUI);
    showToast('Evento guardado.');
}

function deleteEvent(event, eventId) {
    event.stopPropagation();
    showConfirmModal('¿Seguro que quieres eliminar este evento?', (confirmed) => {
        if (confirmed) {
            data.events = data.events.filter(e => e.id !== eventId);
            saveData().then(refreshUI);
            showToast('Evento eliminado.');
        }
    });
}


// --- THEME & MODALS ---
function changeTheme() {
    currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
    applyTheme(currentTheme);
}

function applyTheme(theme) {
    document.body.classList.remove('light', 'dark');
    document.body.classList.add(theme);
    localStorage.setItem('theme', theme);
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
}

function getIconHtml(icon, sizeClass = 'text-2xl', isForCard = false) {
    const colorClass = isForCard ? 'text-white/90' : 'text-foreground';
    const errorColorClass = isForCard ? 'text-white/50' : 'text-muted-foreground';

    if (!icon) return `<i class="fas fa-question-circle ${sizeClass} ${errorColorClass}"></i>`;
    if (icon.startsWith('http')) {
        const imgClass = { 'text-lg': 'w-5 h-5', 'text-xl': 'w-6 h-6', 'text-2xl': 'w-8 h-8', 'text-4xl': 'w-12 h-12' }[sizeClass] || 'w-6 h-6';
        return `<img src="${icon}" class="${imgClass} object-contain" alt="Icono" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fas fa-question-circle ${sizeClass} ${errorColorClass}\\'></i>';">`;
    }
    return `<i class="${icon} ${sizeClass} ${colorClass}"></i>`;
}

// --- MODAL IMPLEMENTATIONS ---
function openEditPanel(itemId = null) {
    const modal = document.getElementById('editPanel');
    const item = itemId ? data.items.find(i => String(i.id) === String(itemId)) : null;
    const activeSection = document.querySelector('#main-nav .active')?.dataset.section || 'links';
    const defaultTypeMap = { 'buscadores': 'Buscador', 'links': 'Link', 'prompts': 'Promp', 'notes-tasks': 'Nota' };
    const type = item ? item.type : defaultTypeMap[activeSection];
    
    modal.innerHTML = `
        <div class="modal-container w-full max-w-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 id="editPanelTitle" class="text-2xl font-bold">${item ? 'Editar' : 'Nuevo'} Elemento</h2>
                <button onclick="document.getElementById('editPanel').classList.add('hidden')" class="btn btn-ghost !p-2">&times;</button>
            </div>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editItemId" value="${item?.id || ''}">
                <div>
                    <label class="font-semibold block mb-2">Tipo</label>
                    <div class="flex flex-wrap gap-2 type-selector">
                        ${['Buscador', 'Link', 'Promp', 'Nota', 'Tarea'].map(t => `
                            <button type="button" data-type="${t}" class="btn ${type === t ? 'btn-primary' : 'btn-secondary'} type-btn">${t}</button>
                        `).join('')}
                    </div>
                    <input type="hidden" id="newType" value="${type}">
                </div>
                <div>
                    <label class="font-semibold block mb-2">Título</label>
                    <input type="text" id="newTitle" class="input-base" placeholder="Nombre del elemento" value="${item?.title || ''}">
                </div>
                 <div id="actionFieldContainer">
                    <label id="actionLabel" class="font-semibold block mb-2">Contenido / URL</label>
                    <textarea id="newActionText" class="input-base hidden" rows="3">${(item && typeof item.action === 'string') ? item.action : ''}</textarea>
                    <div id="newActionRich" class="input-base hidden min-h-[100px]" contenteditable="true"></div>
                </div>
                 <div id="iconFieldContainer">
                    <label class="font-semibold block mb-2">Icono (URL o FontAwesome)</label>
                    <input type="text" id="newIcon" class="input-base" placeholder="https://.../logo.png o fas fa-search" value="${item?.icon || ''}">
                </div>
                <div>
                    <label class="font-semibold block mb-2">Categoría</label>
                    <input type="text" id="newCategory" class="input-base" list="category-suggestions" placeholder="Categoría nueva o existente" value="${item?.category || ''}">
                    <datalist id="category-suggestions"></datalist>
                </div>
                <div>
                    <label class="font-semibold block mb-2">Etiquetas (separadas por coma)</label>
                    <input type="text" id="newTags" class="input-base" placeholder="trabajo, personal" value="${item?.tags?.join(', ') || ''}">
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    ${item ? `<button type="button" id="deleteItemButton" class="btn btn-secondary !bg-red-500/10 !text-red-500 mr-auto">Eliminar</button>` : ''}
                    <button type="button" onclick="document.getElementById('editPanel').classList.add('hidden')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    `;
    modal.classList.remove('hidden');

    const form = modal.querySelector('#editForm');
    form.onsubmit = handleSaveItem;

    if (item) {
        document.getElementById('deleteItemButton').onclick = (e) => deleteItem(e, item.id);
    }
    
    modal.querySelector('.type-selector').addEventListener('click', e => {
        const button = e.target.closest('.type-btn');
        if (button) {
            const newType = button.dataset.type;
            modal.querySelectorAll('.type-btn').forEach(b => b.classList.replace('btn-primary', 'btn-secondary'));
            button.classList.replace('btn-secondary', 'btn-primary');
            document.getElementById('newType').value = newType;
            updateEditFormFields(newType);
        }
    });

    updateEditFormFields(type, item);
    populateCategorySuggestions(type);
}

function updateEditFormFields(type, item = null) {
    const richEditor = document.getElementById('newActionRich');
    const textEditor = document.getElementById('newActionText');
    const iconField = document.getElementById('iconFieldContainer');
    const actionLabel = document.getElementById('actionLabel');

    richEditor.classList.add('hidden');
    textEditor.classList.add('hidden');
    iconField.style.display = 'block';

    if (type === 'Nota' || type === 'Promp') {
        actionLabel.textContent = 'Contenido';
        richEditor.classList.remove('hidden');
        iconField.style.display = 'none';
        if (item && typeof item.action === 'string') richEditor.innerHTML = item.action;
    } else if (type === 'Tarea') {
        actionLabel.textContent = 'Tareas (una por línea)';
        richEditor.classList.remove('hidden');
        iconField.style.display = 'none';
        if (item && Array.isArray(item.action)) {
            richEditor.innerHTML = item.action.map(t => `<div>${t.text}</div>`).join('');
        }
    } else {
        actionLabel.textContent = 'URL / Acción';
        textEditor.classList.remove('hidden');
        if (item) textEditor.value = item.action;
    }
}

function populateCategorySuggestions(itemType) {
    const dataList = document.getElementById("category-suggestions");
    if (!dataList) return;
    dataList.innerHTML = '';
    const categories = [...new Set(data.items.filter(item => item.type === itemType).map(item => item.category).filter(Boolean))].sort();
    categories.forEach(cat => dataList.innerHTML += `<option value="${cat}"></option>`);
}

function handleSaveItem(event) {
    event.preventDefault();
    const id = document.getElementById("editItemId").value;
    const type = document.getElementById("newType").value;
    let action;
    if (type === 'Nota' || type === 'Promp') {
        action = document.getElementById('newActionRich').innerHTML;
    } else if (type === 'Tarea') {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = document.getElementById('newActionRich').innerHTML;
        const existingTasks = id ? (data.items.find(i => String(i.id) === id)?.action || []) : [];
        action = Array.from(tempDiv.children).map((child, index) => ({ text: child.textContent || child.innerText, status: existingTasks[index]?.status || false })).filter(t => t.text.trim());
    } else {
        action = document.getElementById('newActionText').value;
    }
    
    let icon = document.getElementById("newIcon").value.trim();
    if (!icon && (type === 'Link' || type === 'Buscador')) {
        try {
            const url = new URL(action);
            icon = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
        } catch (e) { console.error("URL inválida:", action); }
    }

    const newItemData = {
        title: document.getElementById("newTitle").value.trim() || 'Sin Título',
        action, type,
        category: document.getElementById("newCategory").value.trim() || 'Sin Categoría',
        icon,
        tags: document.getElementById("newTags").value.split(",").map(tag => tag.trim()).filter(Boolean)
    };

    if (id) {
        const index = data.items.findIndex(i => String(i.id) === id);
        if (index !== -1) data.items[index] = { ...data.items[index], ...newItemData };
    } else {
        newItemData.id = Date.now();
        newItemData.isFavorite = false;
        data.items.push(newItemData);
    }
    
    saveData().then(() => {
        refreshUI();
        document.getElementById("editPanel").classList.add("hidden");
        showToast(`Elemento "${newItemData.title}" guardado.`);
    });
}

function deleteItem(event, id) {
    event.stopPropagation();
    showConfirmModal("¿Seguro que quieres eliminar este elemento?", (confirmed) => {
        if (confirmed) {
            const numericId = parseInt(id, 10);
            data.items = data.items.filter(i => i.id !== numericId);
            if (data.favoriteOrder) {
                data.favoriteOrder = data.favoriteOrder.filter(favId => favId !== numericId);
            }
            saveData().then(() => {
                refreshUI();
                document.getElementById("editPanel").classList.add("hidden");
                showToast("Elemento eliminado.");
            });
        }
    });
}

            </div>

                <button data-tab="settings" class="settings-help-tab active flex-1 p-3 font-semibold">Configuración</button>

                    <ul class="list-disc list-inside space-y-2">

                     <h3 class="font-bold text-lg mt-4">Atajos de Teclado</h3>
                     <ul class="list-disc list-inside space-y-1">

                        <li><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>B</kbd> : Activar barra de búsqueda</li>
                        <li><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>T</kbd> : Cambiar tema (claro/oscuro)</li>
                        <li><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>V</kbd> : Cambiar modo de vista</li>

                </div>
            </div>

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {

            document.getElementById(`${tab.dataset.tab}-tab-content`).classList.remove('hidden');
        });

    tabs.forEach(t => {

      else t.style.borderBottom = 'none';
    });
     tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => {
                t.classList.remove('active');
                t.style.borderBottom = 'none';

            tab.classList.add('active');
            tab.style.borderBottom = '2px solid var(--primary)';

function saveSettings() {
    const gistId = document.getElementById('gistIdInput').value.trim();
    const pat = document.getElementById('githubPatInput').value.trim();
    if (gistId) localStorage.setItem('gist_id', gistId);
    if (pat) localStorage.setItem('github_pat', pat);
    document.getElementById('settingsHelpPanel').classList.add('hidden');
    showToast("Configuración guardada. Recargando...");
    loadData();
}

function showConfirmModal(message, callback) {
    const modal = document.getElementById('confirmModal');
    modal.innerHTML = `
        <div class="modal-container w-full max-w-md p-6 text-center">
            <p class="text-lg mb-6">${message}</p>
            <div class="flex justify-center gap-4">
                <button id="confirmCancel" class="btn btn-secondary">Cancelar</button>
                <button id="confirmOk" class="btn btn-primary">Aceptar</button>
            </div>
        </div>
    `;
    modal.classList.remove('hidden');
    modal.querySelector('#confirmOk').onclick = () => { modal.classList.add('hidden'); callback(true); };
    modal.querySelector('#confirmCancel').onclick = () => { modal.classList.add('hidden'); callback(false); };
}

function openCategoryEditModal(event, originalName) {
    event.stopPropagation();
    const modal = document.getElementById('editPanel');
    modal.innerHTML = `
        <div class="modal-container w-full max-w-md p-6">
            <h2 class="text-2xl font-bold mb-4">Editar Categoría</h2>
            <form id="categoryEditForm">
                <input type="hidden" id="originalCategoryName" value="${originalName}">
                <div>
                    <label for="categoryNameInput" class="font-semibold block mb-2">Nuevo nombre</label>
                    <input type="text" id="categoryNameInput" class="input-base" value="${originalName}" required>
                </div>
                <div class="flex justify-end gap-2 pt-4 mt-2">
                    <button type="button" onclick="document.getElementById('editPanel').classList.add('hidden')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    `;
    modal.classList.remove('hidden');
    document.getElementById('categoryNameInput').focus();
    document.getElementById('categoryEditForm').onsubmit = saveCategoryChanges;
}

function saveCategoryChanges(event) {
    event.preventDefault();
    const originalName = document.getElementById('originalCategoryName').value;
    const newName = document.getElementById('categoryNameInput').value.trim();

    if (!newName || newName === originalName) {
        document.getElementById('editPanel').classList.add('hidden');
        return;
    }
    data.items.forEach(item => {
        if (item.category === originalName) item.category = newName;
    });
    Object.keys(data.categoryOrders).forEach(section => {
        data.categoryOrders[section] = data.categoryOrders[section].map(cat => cat === originalName ? newName : cat);
    });
    document.getElementById('editPanel').classList.add('hidden');
    saveData().then(refreshUI);
    showToast(`Categoría renombrada a "${newName}".`);
}

function showPreviewModal(item, event) {
    const modal = document.getElementById('preview-modal');
    if (item.type !== 'Link' && item.type !== 'Buscador') return;
    const modalContent = document.getElementById('preview-modal-content');
    const previewUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(item.action.split('?')[0])}?w=400`;
    modalContent.style.backgroundImage = `url('${previewUrl}')`;
    
    const modalWidth = 320; 
    const modalHeight = 240;
    const cursorX = event.clientX; 
    const cursorY = event.clientY;
    const viewportWidth = window.innerWidth; 
    const viewportHeight = window.innerHeight;
    const offset = 20;

    let top = cursorY + offset; 
    let left = cursorX + offset;

    if (top + modalHeight > viewportHeight - offset) top = cursorY - modalHeight - offset;
    if (left + modalWidth > viewportWidth - offset) left = cursorX - modalWidth - offset;
    
    modal.style.top = `${top}px`;
    modal.style.left = `${left}px`;
    modal.classList.remove('hidden');
    setTimeout(() => { modal.style.opacity = '1'; }, 10);
}

function hidePreviewModal() {
    const modal = document.getElementById('preview-modal');
    modal.style.opacity = '0';
    setTimeout(() => { modal.classList.add('hidden'); }, 200);
}

function updateSyncStatus(status, message = '') {
    const iconEl = document.getElementById('sync-icon');
    const textEl = document.getElementById('sync-text');
    iconEl.className = 'fas'; 
    switch (status) {
        case 'loading':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Cargando...';
            break;
        case 'saving':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Guardando...';
            break;
        case 'synced':
            iconEl.classList.add('fa-check-circle');
            textEl.textContent = 'Sincronizado';
            break;
        case 'local':
            iconEl.classList.add('fa-save');
            textEl.textContent = 'Guardado Local';
            break;
        case 'error':
            iconEl.classList.add('fa-exclamation-triangle');
            textEl.textContent = message || 'Error';
            break;
    }
}
