<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Accesos v54 - Fábrica de Asistentes de IA</title>
    <!-- Logo del Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        /* --- NUEVO DISEÑO MODERNO Y LIMPIO --- */
        :root {
            --background: #f4f4f5; --foreground: #18181b; --card-background: #ffffff;
            --primary: #6d28d9; --primary-foreground: #ffffff; --primary-hover: #5b21b6;
            --secondary: #e4e4e7; --secondary-foreground: #18181b; --muted: #f4f4f5;
            --muted-foreground: #71717a; --accent: #f5f3ff; --accent-foreground: #4c1d95;
            --border: #e4e4e7; --ring: #6d28d9; --radius: 0.75rem;
            --note-bg: #fefce8; --task-bg: #eff6ff; --prompt-bg: #f0fdf4;
            --note-border: #facc15; --task-border: #60a5fa; --prompt-border: #4ade80;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        .dark {
            --background: #111827; --foreground: #e5e7eb; --card-background: #1f2937;
            --primary: #8b5cf6; --primary-hover: #7c3aed; --secondary: #374151;
            --secondary-foreground: #e5e7eb; --muted: #374151; --muted-foreground: #9ca3af;
            --accent: #312e81; --accent-foreground: #a78bfa; --border: #374151;
            --ring: #8b5cf6; --note-bg: #1f2937; --task-bg: #1f2937; --prompt-bg: #1f2937;
            --note-border: #f59e0b; --task-border: #38bdf8; --prompt-border: #34d399;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--foreground); }

        /* --- LAYOUT Y ANIMACIÓN SIDEBAR MEJORADA --- */
        .sidebar { background-color: #1f2937; border-right: 1px solid var(--border); width: 280px; transition: width 0.3s ease-in-out, transform 0.3s ease-in-out; }
        .sidebar.is-collapsed { width: 80px; }
        .sidebar .sidebar-header .font-bold, .sidebar .nav-link span, .sidebar .sidebar-footer .nav-link-text { transition: opacity 0.2s ease, visibility 0.2s ease; opacity: 1; visibility: visible; }
        .sidebar.is-collapsed .sidebar-header .font-bold, .sidebar.is-collapsed .nav-link span, .sidebar.is-collapsed .sidebar-footer .nav-link-text { opacity: 0; visibility: hidden; pointer-events: none; }
        .sidebar.is-collapsed .sidebar-header, .sidebar.is-collapsed #agenda-widget .agenda-header { justify-content: center; }
        .sidebar.is-collapsed .nav-link, .sidebar.is-collapsed .sidebar-footer a { justify-content: center; }
        .sidebar.is-collapsed .sidebar-footer { align-items: center; }
        main { transition: margin-left 0.3s ease-in-out; }

        /* --- COMPONENTES --- */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .list-view { display: flex; flex-direction: column; gap: 0.75rem; }
        .table-view { display: flex; flex-wrap: wrap; gap: 1rem; }
        .card, .list-item, .table-item { background: var(--card-background); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); transition: all 0.2s ease-in-out; position: relative; }
        .card:hover, .list-item:hover, .table-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .card.is-favorite, .list-item.is-favorite, .table-item.is-favorite { box-shadow: 0 0 0 2px var(--primary); }
        .card.is-selected, .list-item.is-selected, .table-item.is-selected { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--ring), var(--shadow-lg); border-color: var(--ring); }
        .card { display: flex; flex-direction: column; height: 250px; overflow: hidden; background-size: cover; background-position: center; justify-content: flex-end; color: white; cursor: pointer; }
        .list-item, .fav-item { display: flex; align-items: center; padding: 0.75rem; gap: 1rem; cursor: pointer; }
        .table-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 120px; height: 120px; padding: 0.5rem; cursor: pointer; }
        .card-overlay { padding: 1rem; width: 100%; position: relative; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%); }
        .card-bg-preview { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.3s ease; }
        .card:hover .card-bg-preview { transform: scale(1.05); }
        
        .video-play-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 3rem;
            color: rgba(255, 255, 255, 0.8); text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.2s ease-in-out; pointer-events: none;
        }
        .card:hover .video-play-icon { opacity: 1; }

        .note-card, .task-card, .prompt-card { justify-content: flex-start; height: 250px; color: var(--foreground); padding: 1.25rem; border-left-width: 4px; }
        .note-card { background-color: var(--note-bg); border-color: var(--note-border); }
        .task-card { background-color: var(--task-bg); border-color: var(--task-border); }
        .prompt-card { background-color: var(--prompt-bg); border-color: var(--prompt-border); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius); font-weight: 600; transition: all 0.2s; padding: 0.5rem 1rem; border: 1px solid transparent; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); color: var(--primary-foreground); border-color: var(--primary); } .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); } .btn-secondary:hover { background-color: var(--accent); }
        .btn-ghost { background-color: transparent; color: var(--muted-foreground); } .btn-ghost:hover { background-color: var(--secondary); color: var(--secondary-foreground); }
        .input-base { background: var(--card-background); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 0.75rem; width: 100%; transition: all 0.2s; color: var(--foreground); }
        .dark .input-base { background: #374151; } .input-base:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
        .nav-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--radius); font-weight: 500; color: var(--muted-foreground); transition: background-color 0.2s, color 0.2s; }
        .nav-link:hover { background-color: var(--muted); color: var(--foreground); } .nav-link.active { background-color: var(--accent); color: var(--accent-foreground); font-weight: 600; }
        .card-actions, .list-item-actions, .table-item-actions { opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .card:hover .card-actions, .list-item:hover .list-item-actions, .table-item:hover .table-item-actions { opacity: 1; }
        .drag-handle { cursor: move; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .card:hover .drag-handle, .list-item:hover .drag-handle, .table-item:hover .drag-handle { opacity: 1; }
        .category-drag-handle, .fav-item { cursor: move; }
        .modal-overlay { background-color: rgba(9, 9, 11, 0.8); backdrop-filter: blur(4px); }
        .modal-container { background-color: var(--card-background); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
        #global-view-switcher button.active { background-color: var(--accent-foreground); color: var(--accent); }
        kbd { background-color: var(--secondary); border-radius: 4px; border: 1px solid var(--border); color: var(--secondary-foreground); display: inline-block; font-family: monospace; font-size: .85em; font-weight: 700; line-height: 1; padding: 2px 6px; }
        .dark kbd { background-color: #4b5563; border-color: #6b7280; }
        #main-title { color: var(--foreground); }
        
        .widget { background-color: var(--card-background); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
        .event-item .actions { opacity: 0; transition: opacity 0.2s ease; }
        .event-item:hover .actions { opacity: 1; }
        #scratchpad-textarea { background-color: var(--secondary); color: var(--foreground); box-sizing: border-box; }
        .dark #scratchpad-textarea { background-color: #374151; color: var(--foreground); border-color: #4b5563; }
        .dark #scratchpad-textarea::placeholder { color: var(--muted-foreground); }
        .prose { color: var(--foreground); } .prose p { margin-bottom: 1em; } .prose strong { font-weight: 600; }
        .prose ul { list-style: disc; margin-left: 1.5em; margin-bottom: 1em; } .prose ol { list-style: decimal; margin-left: 1.5em; margin-bottom: 1em; }
        .prose li { margin-bottom: 0.5em; } .prose pre { background-color: var(--secondary); padding: 1em; border-radius: var(--radius); }
        .dark .prose-invert { color: var(--foreground); }

        /* Estilos para el Chat de IA */
        #ai-chat-area { max-height: 50vh; }
        .ai-chat-bubble { background-color: var(--secondary); padding: 0.75rem 1rem; border-radius: var(--radius); max-width: 90%; }
        .ai-chat-bubble.user { background-color: var(--primary); color: var(--primary-foreground); align-self: flex-end; }
        .ai-chat-bubble.gemini { background-color: var(--secondary); }
        .ai-prompt-btn { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
        
        /* Estilos específicos para la Fábrica de Asistentes de IA */
        .ai-bot-card {
            display: flex;
            flex-direction: column;
            background: var(--card-background);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            padding: 1.25rem;
            position: relative;
        }
        .ai-bot-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .ai-bot-card .dropdown-menu {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--card-background);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 10;
            min-width: 120px;
        }
        .ai-bot-card .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 0.5rem 1rem;
            text-align: left;
            font-weight: 500;
            color: var(--foreground);
            transition: background-color 0.1s ease;
        }
        .ai-bot-card .dropdown-menu button:hover {
            background-color: var(--muted);
        }
        .ai-bot-card .result-area {
            background-color: var(--secondary);
            border-radius: var(--radius);
            padding: 0.75rem;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.9rem;
            position: relative; /* For copy button positioning */
        }
        .ai-bot-card .copy-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(0,0,0,0.3);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .ai-bot-card .result-area:hover .copy-button {
            opacity: 1;
        }
        .ai-bot-card .result-area.has-content .copy-button {
            opacity: 1; /* Always visible if content */
        }
    </style>
</head>

<script>
// --- STATE & CONFIG ---
const FILENAME_IN_GIST = 'Botones.json';
let data = { items: [], categories: {}, categoryOrders: {}, favoriteOrders: {}, events: [], iaBots: [] }; // Renamed aiPrompts to iaBots
let viewModes = {};
const themes = ['dark', 'light'];
let currentTheme = localStorage.getItem('theme') || 'dark';
let previewTimeout = null;
let selectedSearchEngineId = 'global'; // Set global search as default
const typeMap = { 'inicio': 'Inicio', 'buscadores': 'Buscador', 'links': 'Link', 'prompts': 'Promp', 'notes-tasks': ['Nota', 'Tarea'], 'videos': 'Video', 'ia': 'IA' };
let videoTranscriptCache = null; // Cache for the current video transcript
let aiChatHistory = []; // Cache for the current AI chat history

// --- MOCK DATA & DEFAULTS ---
const defaultAiPrompts = [ // Kept for video AI analysis
    { id: 1, isDefault: true, title: "ANTI-CLICKBAIT 2.0", prompt: "Analiza el título, la miniatura y el contenido del video. Identifica la afirmación o pregunta sensacionalista del título/thumb. Luego, encuentra en el video DÓNDE y CÓMO se responde eso. Si la respuesta es simple (una frase) pero el video dura mucho (ej. 1 hora), señálalo con ironía y eficiencia. Responde en este formato:\n➤ “Te están vendiendo [resumir hype del título/thumb]. Pero en el minuto [X] dice: ‘[frase real]’. No necesitabas [duración] para eso. Respuesta real en 5-10 palabras: [respuesta ultra breve].”" },
    { id: 2, isDefault: true, title: "📌 RESUMEN MUY BREVE", prompt: "Resume el video en UNA sola frase o máximo 3 líneas. Debe incluir: qué es lo más importante que dice, por qué importa, y qué debes recordar. Sé conciso, claro y directo. Evita tecnicismos." },
    { id: 3, isDefault: true, title: "📖 RESUMEN COMPLETO", prompt: "Genera un resumen estructurado del video con estas secciones:\n- Introducción: ¿Cuál es el propósito o problema que plantea?\n- Desarrollo: ¿Qué argumentos, ejemplos o estudios presenta? Menciona momentos clave (minutos si es posible).\n- Conclusión: ¿Qué propone, recomienda o concluye?\nMáximo 150 palabras. Usa lenguaje claro y organizado con bullets o párrafos cortos." },
    { id: 4, isDefault: true, title: "⏱️ MARCADORES DE TIEMPO", prompt: "Extrae los momentos clave del video y organízalos en una lista con timestamps (minutos:segundos). Para cada momento, escribe una descripción breve de qué ocurre (ej: “explica X”, “muestra ejemplo de Y”, “revela dato Z”). Incluye al menos 4-6 puntos. Si hay introducción clickbait o llamado a suscribirse, menciónalo con emoji 😏." },
    { id: 5, isDefault: true, title: "💡 IDEAS CLAVE", prompt: "Extrae 3 a 5 ideas, conceptos o frases clave del video que el usuario DEBE recordar. Para cada una, escribe:\n- Nombre del concepto (negrita)\n- Explicación breve (1 línea)\n- Por qué es útil o relevante (1 línea)\nUsa lenguaje sencillo y emojis para hacerlo visual." },
    { id: 6, isDefault: true, title: "✅ CHEQUEA EN FUENTES CREÍBLES", prompt: "Identifica 1-3 afirmaciones clave o polémicas del video. Para cada una:\n1. Clasifícala: ✅ REAL / ⚠️ PARCIALMENTE CIERTO / ❌ MITO / 🎭 EXAGERADO\n2. Cita una fuente creíble que lo respalde o refute (OMS, PubMed, universidad, estudio, experto reconocido). Si no hay fuente, di “No hay evidencia disponible”.\n3. Breve explicación (1-2 líneas).\nFormato claro, con bullets y emojis." },

function deleteItem(event, id) {
    event.stopPropagation();
    showConfirmModal("¿Seguro que quieres eliminar este elemento?", (confirmed) => {
        if (confirmed) {
            data.items = data.items.filter(i => String(i.id) !== String(id));
            if (data.favoriteOrders) {
                for (const section in data.favoriteOrders) {
                    data.favoriteOrders[section] = data.favoriteOrders[section].filter(favId => String(favId) !== String(id));
                }
            }
            saveData().then(() => {
                refreshUI();
                document.getElementById("editPanel").classList.add("hidden");
                showToast("Elemento eliminado.");
            });
        }
    });
}

function saveSettings() {
    const gistId = document.getElementById('gistIdInput').value.trim();
    const pat = document.getElementById('githubPatInput').value.trim();
    const geminiKey = document.getElementById('geminiApiKeyInput').value.trim();
    if (gistId) localStorage.setItem('gist_id', gistId); else localStorage.removeItem('gist_id');
    if (pat) localStorage.setItem('github_pat', pat); else localStorage.removeItem('github_pat');
    if (geminiKey) localStorage.setItem('gemini_api_key', geminiKey); else localStorage.removeItem('gemini_api_key');

    document.getElementById('settingsHelpPanel').classList.add('hidden');
    showToast("Configuración guardada. Recargando...");
    loadData();
}

function saveCategoryChanges(event) {
    event.preventDefault();
    const originalName = document.getElementById('originalCategoryName').value;
    const newName = document.getElementById('categoryNameInput').value.trim();

    if (!newName || newName === originalName) {
        document.getElementById('editPanel').classList.add('hidden');
        return;
    }
    data.items.forEach(item => {
        if (item.category === originalName) item.category = newName;
    });
    Object.keys(data.categoryOrders).forEach(section => {
        data.categoryOrders[section] = data.categoryOrders[section].map(cat => cat === originalName ? newName : cat);
    });
    document.getElementById('editPanel').classList.add('hidden');
    saveData().then(refreshUI);
    showToast(`Categoría renombrada a "${newName}".`);
}

function showPreviewModal(item, event) {
    const modal = document.getElementById('preview-modal');
    if (item.type !== 'Link' && item.type !== 'Buscador' && item.type !== 'Video') return;
    
    const modalContent = document.getElementById('preview-modal-content');

    let previewUrl = '';
    if (item.type === 'Video') {
        const videoId = getYouTubeID(item.action);
        if (videoId) previewUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
    } else {
        previewUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(item.action.split('?')[0])}?w=400`;
    }

    modalContent.style.backgroundImage = `url('${previewUrl}')`;
    
    const tagsContainer = document.getElementById('preview-modal-tags');
    if (item.tags && item.tags.length > 0) {
        tagsContainer.innerHTML = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
        tagsContainer.style.display = 'flex';
    } else {
        tagsContainer.style.display = 'none';
    }

    const modalWidth = 320;    
    const modalHeight = 240;
    const cursorX = event.clientX;    
    const cursorY = event.clientY;
    const viewportWidth = window.innerWidth;    
    const viewportHeight = window.innerHeight;
    const offset = 20;

    let top = cursorY + offset;    
    let left = cursorX + offset;

    if (top + modalHeight > viewportHeight - offset) top = cursorY - modalHeight - offset;
    if (left + modalWidth > viewportWidth - offset) left = cursorX - modalWidth - offset;
    
    modal.style.top = `${top}px`;
    modal.style.left = `${left}px`;
    modal.classList.remove('hidden');
    setTimeout(() => { modal.style.opacity = '1'; }, 10);
}

function hidePreviewModal() {
    const modal = document.getElementById('preview-modal');
    modal.style.opacity = '0';
    setTimeout(() => { modal.classList.add('hidden'); }, 200);
}

function updateSyncStatus(status, message = '') {
    const iconEl = document.getElementById('sync-icon');
    const textEl = document.getElementById('sync-text');
    iconEl.className = 'fas';    
    switch (status) {
        case 'loading':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Cargando...';
            break;
        case 'saving':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Guardando...';
            break;
        case 'synced':
            iconEl.classList.add('fa-check-circle');
            textEl.textContent = 'Sincronizado';
            break;
        case 'local':
            iconEl.classList.add('fa-save');
            textEl.textContent = 'Guardado Local';
            break;
        case 'error':
            iconEl.classList.add('fa-exclamation-triangle');
            textEl.textContent = message || 'Error';
            break;
    }
}

// --- IA Section & Helpers ---
function simpleMarkdownToHtml(text) {
    let html = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');

    let lines = html.split('\n');
    let inList = false;
    let listType = '';

    let processedHtml = lines.map(line => {
        const trimmedLine = line.trim();
        const isUnordered = trimmedLine.startsWith('* ') || trimmedLine.startsWith('- ');
        const isOrdered = /^\d+\. /.test(trimmedLine);

        if (isUnordered || isOrdered) {
            let itemHtml = '<li>' + trimmedLine.substring(trimmedLine.indexOf(' ') + 1) + '</li>';
            if (!inList) {
                listType = isUnordered ? 'ul' : 'ol';
                itemHtml = `<${listType}>` + itemHtml;
                inList = true;
            } else if ((isUnordered && listType !== 'ul') || (isOrdered && listType !== 'ol')) {
                   itemHtml = `</${listType}><${isUnordered ? 'ul' : 'ol'}>` + itemHtml;
                   listType = isUnordered ? 'ul' : 'ol';
            }
            return itemHtml;
        } else {
            if (inList) {
                inList = false;
                return `</${listType}>` + (trimmedLine ? `<p>${line}</p>` : '');
            }
            return trimmedLine ? `<p>${line}</p>` : '';
        }
    }).join('');

    if (inList) {
        processedHtml += `</${listType}>`;
    }
    
    return processedHtml.replace(/<p><\/p>/g, '');
}

async function callGeminiAPI(prompt, triggerButton, allButtonsToDisable = [], generationConfig = null) {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
        showToast("Configura tu API Key de Gemini en los ajustes.", 'error');
        return null;
    }

    const originalButtonText = triggerButton.innerHTML;
    const buttons = allButtonsToDisable.length > 0 ? allButtonsToDisable : [triggerButton];

    buttons.forEach(b => b.disabled = true);
    triggerButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Generando...';

    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

    const payload = {
        contents: [{ parts: [{ text: prompt }] }]
    };

    if (generationConfig) {
        payload.generationConfig = generationConfig;
    }

    if (!generationConfig || !generationConfig.responseMimeType) {
           payload.tools = [{ "google_search": {} }];
    }


    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error.message || `Error HTTP: ${response.status}`);
        }

        const responseData = await response.json();
        return responseData.candidates[0].content.parts[0].text;
    } catch (error) {
        console.error("Error llamando a la API de Gemini:", error);
        showToast(`Error de IA: ${error.message}`, 'error');
        return null;
    } finally {
        buttons.forEach(b => b.disabled = false);
        triggerButton.innerHTML = originalButtonText;
    }
}

function toggleBotMenu(event, botId) {
    event.stopPropagation();
    const menu = document.getElementById(`bot-menu-${botId}`);
    menu.classList.toggle('hidden');

    // Close other open menus
    document.querySelectorAll('.dropdown-menu').forEach(otherMenu => {
        if (otherMenu.id !== `bot-menu-${botId}`) {
            otherMenu.classList.add('hidden');
        }
    });

    // Close menu when clicking outside
    document.addEventListener('click', function closeMenuOnClickOutside(e) {
        if (!menu.contains(e.target) && !event.currentTarget.contains(e.target)) {
            menu.classList.add('hidden');
            document.removeEventListener('click', closeMenuOnClickOutside);
        }
    });
}

async function generateBotResponse(botId, triggerButton) {

    const resultDiv = document.getElementById(`bot-result-${bot.id}`);

    if (!userInput) {
        showToast('Por favor, escribe tu petición al bot.', 'error');
        return;
    }

    resultDiv.innerHTML = `<p class="text-muted-foreground"><i class="fas fa-spinner fa-spin mr-2"></i>Generando respuesta...</p>`;
    resultDiv.classList.remove('has-content'); // Reset class

    const finalPrompt = `${bot.systemPrompt}\n\nMi petición: ${userInput}`;
    const aiResult = await callGeminiAPI(finalPrompt, triggerButton);

    if (aiResult) {
        resultDiv.innerHTML = `<div class="prose dark:prose-invert max-w-none text-sm">${simpleMarkdownToHtml(aiResult)}</div><button class="copy-button" onclick="copyBotResponse('${bot.id}', event)"><i class="fas fa-copy mr-1"></i>Copiar</button>`;

function copyBotResponse(botId, event) {
    event.stopPropagation(); // Prevent card click if it's on a card
    const resultDiv = document.getElementById(`bot-result-${botId}`);
    const textToCopy = resultDiv.querySelector('.prose')?.textContent || resultDiv.textContent;

    if (!textToCopy.trim()) {
        showToast('No hay contenido para copiar.', 'info');
        return;
    }

    // Use document.execCommand('copy') for broader compatibility in iframes
    const tempTextarea = document.createElement('textarea');
    tempTextarea.value = textToCopy;
    document.body.appendChild(tempTextarea);
    tempTextarea.select();
    try {
        document.execCommand('copy');
        showToast('Respuesta copiada al portapapeles.');
    } catch (err) {
        console.error('Failed to copy text: ', err);
        showToast('Error al copiar el texto.', 'error');
    } finally {
        document.body.removeChild(tempTextarea);
    }
}

function cleanGeminiJsonResponse(rawResponse) {
    if (!rawResponse || typeof rawResponse !== 'string') return null;
    const match = rawResponse.match(/```json\n([\s\S]*?)\n```/);
    if (match && match[1]) {
        return match[1];
    }
    return rawResponse;
}

                id: Date.now() + index,
                type: item.type === 'task' ? 'Tarea' : 'Nota',
                title: item.title,
                action: action,
                category: 'Desde Bloc de Notas',
                isFavorite: false,
                tags: ['scratchpad']
            };
            data.items.push(newItemData);
        });

        saveData().then(() => {
            const scratchpad = document.getElementById('scratchpad-textarea');
            scratchpad.value = '';
            localStorage.setItem('scratchpadContent', '');
            refreshUI();
            showToast(`${items.length} elementos creados.`, 'success');
        });
        modal.classList.add('hidden');
    };
    modal.querySelector('#confirmCancel').onclick = () => modal.classList.add('hidden');
}

async function handleSuggestCategory() {
    const title = document.getElementById('newTitle').value;
    const type = document.getElementById('newType').value;
    const richEditor = document.getElementById('newActionRich');
    const textEditor = document.getElementById('newActionText');
    const content = (type === 'Nota' || type === 'Tarea' || type === 'Promp') ? richEditor.innerText : textEditor.value;
    
    if (!title && !content) {
        showToast('Añade un título o contenido para obtener sugerencias.', 'error');
        return;
    }

    const existingCategories = [...new Set(data.items.map(item => item.category).filter(Boolean))];
    const prompt = `Dada la siguiente información de un elemento, sugiere una única y concisa categoría en español. Título: '${title}'. Contenido: '${content}'. Las categorías existentes son: [${existingCategories.join(', ')}]. Si una de las categorías existentes encaja bien, úsala. Si no, sugiere una nueva categoría relevante. Responde solo con el nombre de la categoría.`;

    const triggerButton = document.querySelector('button[onclick="handleSuggestCategory()"]');
    const suggestion = await callGeminiAPI(prompt, triggerButton);

    if (suggestion) {
        document.getElementById('newCategory').value = suggestion.trim().replace(/["'\*]/g, '');
    }
}

async function handleSuggestTags() {
    const title = document.getElementById('newTitle').value;
    const type = document.getElementById('newType').value;
    const richEditor = document.getElementById('newActionRich');
    const textEditor = document.getElementById('newActionText');
    const content = (type === 'Nota' || type === 'Tarea' || type === 'Promp') ? richEditor.innerText : textEditor.value;

    if (!title && !content) {
        showToast('Añade un título o contenido para obtener sugerencias.', 'error');
        return;
    }

    const prompt = `Para un elemento con el título '${title}' y contenido '${content}', sugiere entre 3 y 5 etiquetas relevantes de una sola palabra en español. Sepáralas por comas. Ejemplo: 'cocina, receta, pasta'. Responde solo con las etiquetas.`;
    
    const triggerButton = document.querySelector('button[onclick="handleSuggestTags()"]');
    const suggestions = await callGeminiAPI(prompt, triggerButton);

    if (suggestions) {
        document.getElementById('newTags').value = suggestions.trim();
    }
}

async function handleSmartAdd() {
    const smartAddButton = document.getElementById('smartAddButton');
    const originalButtonHTML = smartAddButton.innerHTML;
    let clipboardText = '';

    // If in "IA" section, "smartAddButton" is used to create a new AI Bot
    if (document.querySelector('#main-nav .active')?.dataset.section === 'ia') {
        openBotManagerModal();
        return;
    }

    try {
        clipboardText = await navigator.clipboard.readText();
    } catch (err) {
        console.warn('No se pudo leer el portapapeles, abriendo panel manual.');
        openEditPanel();
        return;
    }

    if (!clipboardText.trim()) {
        openEditPanel();
        return;
    }

    smartAddButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analizando...';
    smartAddButton.disabled = true;
    
    const prompt = `Eres un asistente experto en clasificación de contenido. Analiza el siguiente texto del portapapeles de un usuario. Tu tarea es determinar qué es y extraer su información en un formato JSON estricto.
    
Texto de entrada: "${clipboardText}"

Debes devolver un único objeto JSON con las siguientes claves:
- "type": (String) Clasifica el contenido como uno de los siguientes: "Video", "Link", "Buscador", "Nota", "Tarea", "Promp". Si es una URL de YouTube, debe ser "Video". Si es cualquier otra URL, debe ser "Link". Si es texto plano que no parece una pregunta, es "Nota".
- "title": (String) Un título conciso y descriptivo. Para URLs, usa el título de la página.
- "action": (String) El contenido original o la URL.
- "category": (String) Una categoría de una sola palabra, relevante y en español.
- "tags": (Array of Strings) Un array de 3 a 5 etiquetas relevantes en minúsculas y en español.
- "icon": (String) Una clase de Font Awesome v6 apropiada (ej: "fab fa-youtube", "fas fa-link", "fas fa-sticky-note").

Usa tu conocimiento y la herramienta de búsqueda de Google para obtener la información más precisa. Responde únicamente con el objeto JSON.`;

    const generationConfig = {
      responseMimeType: "application/json",
    };

    try {
        const rawResult = await callGeminiAPI(prompt, smartAddButton, [], generationConfig);
        if (rawResult) {
            const aiData = JSON.parse(rawResult);
            openEditPanel(null, aiData);
        } else {
            // If AI fails, open the manual panel as a fallback
            openEditPanel();
        }
    } catch (e) {
        console.error("Error al procesar la respuesta de la IA para Smart Add:", e);
        showToast('Hubo un error con la IA. Abriendo panel manual.', 'error');
        openEditPanel();
    } finally {
        smartAddButton.innerHTML = originalButtonHTML;
        smartAddButton.disabled = false;
    }
}

async function performAISearch(term) {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
        showToast("La búsqueda con IA requiere una API Key. Usando búsqueda normal.", 'warning');
        renderGlobalSearchResults(term);
        return;
    }
    
    const container = getActiveSectionContainer()?.querySelector('#ai-search-results-container');
    if(container) {
        container.innerHTML = `<div class="text-center p-8"><i class="fas fa-spinner fa-spin text-2xl text-muted-foreground"></i><p class="mt-2 text-muted-foreground">Buscando con IA...</p></div>`;
    }

    const itemsToSearch = data.items.map(i => ({
        id: i.id,
        title: i.title,
        type: i.type,
        category: i.category,
        tags: i.tags
    }));

    const prompt = `Eres un asistente de búsqueda semántica. Te daré una consulta y una lista de elementos JSON. Devuelve un array JSON con los IDs de los elementos que mejor respondan a la consulta. No devuelvas nada más que el array de IDs.

Consulta: "${term}"

Elementos:
${JSON.stringify(itemsToSearch, null, 2)}

Responde solo con el array de IDs en formato JSON.`;

    const searchButton = getActiveSectionContainer()?.querySelector('.main-search-button');
    let aiResult;
    
    const generationConfig = {
      responseMimeType: "application/json",
    };

    try {
        aiResult = await callGeminiAPI(prompt, searchButton, [], generationConfig);
        const resultIds = JSON.parse(aiResult);
        
        if (Array.isArray(resultIds)) {
            const foundItems = data.items.filter(item => resultIds.map(String).includes(String(item.id)));
            renderGlobalSearchResults(term, foundItems);
        } else {
               throw new Error("La IA no devolvió un array.");
        }
    } catch (e) {
        console.error("Error en la búsqueda con IA, usando fallback:", e, aiResult);
        showToast("La búsqueda con IA falló, usando búsqueda normal.", "error");
        renderGlobalSearchResults(term);
    }
}


</script>
