<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Accesos v28 - Diseño Optimizado</title>
    <!-- Logo del Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        /* --- NUEVO DISEÑO MODERNO Y LIMPIO --- */
        :root {
            --background: #f4f4f5; /* Gris muy claro */
            --foreground: #18181b; /* Negro suave */
            --card-background: #ffffff;
            --card-foreground: #18181b;
            --sidebar-background: #ffffff;
            --primary: #6d28d9; /* Púrpura */
            --primary-foreground: #ffffff;
            --primary-hover: #5b21b6;
            --secondary: #e4e4e7;
            --secondary-foreground: #18181b;
            --muted: #f4f4f5;
            --muted-foreground: #71717a;
            --accent: #f5f3ff;
            --accent-foreground: #4c1d95;
            --border: #e4e4e7;
            --ring: #6d28d9;
            --radius: 0.75rem;
            --note-bg: #fefce8;
            --task-bg: #eff6ff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        .dark {
            --background: #09090b;
            --foreground: #fafafa;
            --card-background: #18181b;
            --card-foreground: #fafafa;
            --sidebar-background: #18181b;
            --primary: #7c3aed;
            --primary-foreground: #fafafa;
            --primary-hover: #8b5cf6;
            --secondary: #27272a;
            --secondary-foreground: #fafafa;
            --muted: #27272a;
            --muted-foreground: #a1a1aa;
            --accent: #27272a;
            --accent-foreground: #a78bfa;
            --border: #27272a;
            --ring: #7c3aed;
            --note-bg: #3f3f17;
            --task-bg: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- LAYOUT PRINCIPAL --- */
        .main-layout { transition: padding-left 0.3s ease-in-out; }
        .sidebar {
            background-color: var(--sidebar-background);
            border-right: 1px solid var(--border);
            width: 280px;
            transition: width 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .sidebar.is-collapsed { width: 80px; }
        .sidebar.is-collapsed .sidebar-header .font-bold, .sidebar.is-collapsed .nav-link span, .sidebar.is-collapsed .sidebar-footer .nav-link-text, .sidebar.is-collapsed #global-search-container {
            display: none;
        }
        .sidebar.is-collapsed .sidebar-header { justify-content: center; }
         .sidebar.is-collapsed .nav-link, .sidebar.is-collapsed .sidebar-footer a {
            justify-content: center;
        }
        .sidebar.is-collapsed .sidebar-footer {
            align-items: center;
        }

        main { transition: margin-left 0.3s ease-in-out; }

        /* --- COMPONENTES --- */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .list-view { display: flex; flex-direction: column; gap: 0.75rem; }
        .table-view { display: flex; flex-wrap: wrap; gap: 1rem; }

        .card, .list-item, .table-item {
            background: var(--card-background);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            transition: all 0.2s ease-in-out;
            position: relative;
            cursor: pointer;
        }
        .card:hover, .list-item:hover, .table-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .card.is-favorite, .list-item.is-favorite, .table-item.is-favorite { box-shadow: 0 0 0 2px var(--primary); }

        .card {
            display: flex;
            flex-direction: column;
            height: 250px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            justify-content: flex-end;
            color: white;
        }
        
        .list-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            gap: 1rem;
        }

        .table-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            padding: 0.5rem;
        }


        .card-overlay {
            padding: 1rem;
            width: 100%;
            position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%);
        }
        .card-bg-preview {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease;
        }
        .card:hover .card-bg-preview { transform: scale(1.05); }

        .note-card, .task-card {
            justify-content: flex-start;
            height: 250px;
            color: var(--card-foreground);
            padding: 1.25rem;
        }
        .note-card { background: var(--note-bg); }
        .task-card { background: var(--task-bg); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-weight: 600;
            transition: all 0.2s;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .btn-primary { background-color: var(--primary); color: var(--primary-foreground); border-color: var(--primary);}
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--secondary); color: var(--secondary-foreground); border-color: var(--border);}
        .btn-secondary:hover { background-color: var(--accent); }
        .btn-ghost { background-color: transparent; color: var(--muted-foreground); }
        .btn-ghost:hover { background-color: var(--secondary); color: var(--secondary-foreground); }

        .input-base {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem 0.75rem;
            width: 100%;
            transition: all 0.2s;
        }
        dark .input-base { background: var(--card-background); }
        .input-base:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-weight: 500;
            color: var(--muted-foreground);
            transition: background-color 0.2s, color 0.2s;
        }
        .nav-link:hover { background-color: var(--muted); color: var(--foreground); }
        .nav-link.active { background-color: var(--accent); color: var(--accent-foreground); font-weight: 600; }
        
        .card-actions, .list-item-actions, .table-item-actions { opacity: 0; transition: opacity 0.2s; }
        .card:hover .card-actions, .list-item:hover .list-item-actions, .table-item:hover .table-item-actions { opacity: 1; }

        .modal-overlay { background-color: rgba(9, 9, 11, 0.8); backdrop-filter: blur(4px); }
        .modal-container { background-color: var(--card-background); border-radius: var(--radius); box-shadow: var(--shadow-lg); }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
        
        #global-view-switcher button.active { background-color: var(--accent-foreground); color: var(--accent); }

    </style>
</head>
<body class="dark"> <!-- Inicia en modo oscuro por defecto -->

    <div class="main-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-40 p-4 flex-shrink-0 flex flex-col transform -translate-x-full lg:translate-x-0">
            <!-- Header de la Sidebar -->
            <div class="sidebar-header flex items-center justify-between pb-4 px-2">
                 <div class="flex items-center gap-3">
                    <img src="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png" alt="Logo" class="w-10 h-10">
                    <span class="font-bold text-lg">Centro de Accesos</span>
                 </div>
                 <button id="sidebar-toggle" class="btn btn-ghost !p-2 hidden lg:inline-flex" title="Colapsar barra lateral">
                     <i class="fas fa-angle-double-left"></i>
                 </button>
            </div>
            
            <!-- Buscador Global -->
            <div id="global-search-container" class="px-2 pb-4">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="global-search-input" placeholder="Buscar..." class="input-base w-full !pl-9">
                </div>
            </div>

            <!-- Navegación Principal -->
            <nav id="main-nav" class="flex-grow space-y-2 px-2">
                <a href="#" data-section="buscadores" class="nav-link active"><i class="fas fa-search w-5 text-center"></i><span>Buscadores</span></a>
                <a href="#" data-section="links" class="nav-link"><i class="fas fa-link w-5 text-center"></i><span>Links</span></a>
                <a href="#" data-section="prompts" class="nav-link"><i class="fas fa-brain w-5 text-center"></i><span>Prompts</span></a>
                <a href="#" data-section="notes-tasks" class="nav-link"><i class="fas fa-check-double w-5 text-center"></i><span>Notas y Tareas</span></a>
            </nav>
            
            <!-- Footer de la Sidebar -->
            <div class="sidebar-footer mt-auto flex flex-col gap-2 px-2">
                <a href="#" id="fab-settings" class="nav-link"><i class="fas fa-cog w-5 text-center"></i><span class="nav-link-text">Configuración</span></a>
                <a href="#" id="fab-help" class="nav-link"><i class="fas fa-question-circle w-5 text-center"></i><span class="nav-link-text">Ayuda</span></a>
                <a href="#" id="fab-theme" class="nav-link"><i class="fas fa-palette w-5 text-center"></i><span class="nav-link-text">Cambiar Tema</span></a>
                <div id="sync-status" class="text-xs flex items-center gap-2 opacity-70 p-2 justify-center">
                    <i id="sync-icon" class="fas fa-cloud"></i>
                    <span id="sync-text">Sincronizado</span>
                </div>
            </div>
        </aside>
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto lg:ml-[280px]">
            <header class="header flex flex-col md:flex-row justify-between items-center mb-6 pb-4 gap-4">
                 <div class="flex items-center gap-4 w-full md:w-auto">
                    <button id="menu-toggle" class="lg:hidden btn btn-ghost !p-2">
                          <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 id="main-title" class="text-2xl sm:text-3xl font-bold tracking-tight">BUSCADORES</h1>
                 </div>
                <div class="flex items-center gap-2 sm:gap-4 w-full md:w-auto">
                    <div id="global-view-switcher" class="view-switcher flex items-center bg-secondary p-1 rounded-lg ml-auto">
                        <button data-view="grid" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-th-large"></i></button>
                        <button data-view="list" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-bars"></i></button>
                        <button data-view="table" title="Vista de Iconos" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-th"></i></button>
                        <button data-view="kanban" title="Vista Kanban" class="btn btn-sm btn-ghost !rounded-md px-3 py-1"><i class="fas fa-columns"></i></button>
                    </div>
                    <button id="addNewButton" class="btn btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        <span class="hidden sm:inline">Nuevo</span>
                    </button>
                </div>
            </header>
            
            <div id="section-buscadores" class="section"></div>
            <div id="section-links" class="section hidden"></div>
            <div id="section-prompts" class="section hidden"></div>
            <div id="section-notes-tasks" class="section hidden"></div>
        </main>
    </div>
    
    <!-- MODALS & OVERLAYS -->
    <div id="editPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="toast" class="hidden fixed bottom-5 right-5 p-4 rounded-lg font-bold z-[2000] shadow-lg" style="background-color: var(--primary); color: var(--primary-foreground);"></div>
    <div id="confirmModal" class="hidden fixed inset-0 z-[1100] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="helpModal" class="hidden fixed inset-0 z-[1100] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="settingsModal" class="hidden fixed inset-0 z-[1100] p-4 flex items-center justify-center modal-overlay"></div>

<script>
// --- STATE & CONFIG ---
const FILENAME_IN_GIST = 'Botones.json';
let data = { items: [], categories: {}, categoryOrders: {}, favoriteOrder: [] };
const views = ['grid', 'list', 'table', 'kanban'];
let globalView = localStorage.getItem('globalView') || 'grid';
const themes = ['dark', 'light'];
let currentTheme = localStorage.getItem('theme') || 'dark';

// --- MOCK DATA (Fallback) ---
const mockData = {
    items: [
        { id: 1, type: 'Buscador', title: 'Google', action: 'https://www.google.com/search?q={search_term}', category: 'General', icon: 'fab fa-google', tags: ['motor', 'busqueda'], isFavorite: true },
        { id: 2, type: 'Buscador', title: 'YouTube', action: 'https://www.youtube.com/results?search_query={search_term}', category: 'Video', icon: 'fab fa-youtube', tags: ['videos', 'tutoriales'], isFavorite: false },
        { id: 3, type: 'Link', title: 'GitHub', action: 'https://github.com', category: 'Desarrollo', icon: 'fab fa-github', tags: ['codigo', 'proyectos'], isFavorite: true },
        { id: 4, type: 'Promp', title: 'Generar Idea', action: 'Crea una lista de 5 ideas para un video de YouTube sobre IA.', category: 'Creatividad', icon: 'fas fa-lightbulb', tags: ['ideas'], isFavorite: false },
        { id: 5, type: 'Nota', title: 'Reunión Lunes', action: '<div>Discutir presupuesto Q3.</div><div>Revisar métricas.</div><div>Asignar tareas.</div>', category: 'Trabajo', icon: 'fas fa-sticky-note', tags: ['reunion'], isFavorite: false },
        { id: 6, type: 'Tarea', title: 'Proyecto Web', action: [{text: 'Diseñar mockup', status: true}, {text: 'Desarrollar landing', status: false}], category: 'Proyectos', icon: 'fas fa-tasks', tags: ['web'], isFavorite: true }
    ],
    categories: { 'Video': {}, 'Desarrollo': {} },
    categoryOrders: { buscadores: ["General", "Video"], links: ["Desarrollo"], prompts: ["Creatividad"], "notes-tasks": [] },
    favoriteOrder: [1, 3]
};


// --- DATA HANDLING ---
function ensureAllIcons() {
    if (!data.items) return;
    data.items.forEach(item => {
        if ((item.type === 'Link' || item.type === 'Buscador') && !item.icon) {
            try {
                const url = new URL(item.action);
                item.icon = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
            } catch (e) {
                console.error(`URL inválida para auto-generar favicon para "${item.title}":`, item.action);
            }
        }
    });
}

async function loadData() {
    let gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        data = JSON.parse(JSON.stringify(mockData));
        ensureAllIcons();
        initializeUI();
        return;
    }
    updateSyncStatus('loading');
    const token = localStorage.getItem('github_pat');
    const headers = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) { headers['Authorization'] = `token ${token}`; }

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const gistData = await response.json();
        const fileContent = gistData.files[FILENAME_IN_GIST]?.content;
        if (!fileContent) {
            showToast("Archivo no encontrado en Gist. Usando datos de ejemplo.");
            data = JSON.parse(JSON.stringify(mockData));
        } else {
            let loadedJson = JSON.parse(fileContent);
            const defaults = { items: [], categories: {}, categoryOrders: {}, favoriteOrder: [] };
            data = { ...defaults, ...loadedJson };
            data.items = (data.items || []).map(i => ({...i, isFavorite: i.isFavorite || false}));
            if (!data.favoriteOrder) {
                data.favoriteOrder = data.items.filter(i => i.isFavorite).map(i => i.id);
            }
            showToast("Datos cargados desde Gist.");
        }
        updateSyncStatus('synced');
    } catch (error) {
        console.error("Fallo al cargar datos:", error);
        showToast(`Error al cargar: ${error.message}.`);
        updateSyncStatus('error', 'Error de carga');
        data = JSON.parse(JSON.stringify(mockData));
    }
    ensureAllIcons();
    initializeUI();
}

async function saveData() {
    const gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        updateSyncStatus('local');
        return;
    }
    
    let token = localStorage.getItem('github_pat');
    if (!token) {
        showToast("Falta token de GitHub. Guardado localmente.");
        updateSyncStatus('error', 'Falta token');
        return;
    }
    
    updateSyncStatus('saving');

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify({
                files: {
                    [FILENAME_IN_GIST]: {
                        content: JSON.stringify(data, null, 2)
                    }
                }
            })
        });
        if (!response.ok) {
             if(response.status === 401 || response.status === 404) {
                   showToast("Token inválido. Revisa la configuración.");
                   updateSyncStatus('error', 'Token inválido');
             }
             throw new Error(`Error al guardar: ${response.status}`)
        };
        showToast("Cambios guardados en Gist.");
        updateSyncStatus('synced');
    } catch (error) {
        console.error("Fallo al guardar en Gist:", error);
        showToast("Error al guardar en Gist.");
        updateSyncStatus('error', 'Error al guardar');
    }
}

// --- UI INITIALIZATION & EVENT LISTENERS ---
document.addEventListener("DOMContentLoaded", () => {
    loadData();
    setupEventListeners();
});

function debounce(func, delay) {
    let timeout;
    return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
    };
}

function setupEventListeners() {
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.querySelector('main');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
        sidebar.classList.toggle('is-collapsed');
        mainContent.style.marginLeft = sidebar.classList.contains('is-collapsed') ? '80px' : '280px';
    });

    const overlay = document.getElementById('sidebar-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const toggleMobileSidebar = () => {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    };
    menuToggle.addEventListener('click', toggleMobileSidebar);
    overlay.addEventListener('click', toggleMobileSidebar);

    document.getElementById('main-nav').addEventListener('click', (e) => {
        const navLink = e.target.closest('.nav-link');
        if (navLink) {
            e.preventDefault();
            switchTab(navLink.dataset.section);
            if (window.innerWidth < 1024) toggleMobileSidebar();
        }
    });

    document.getElementById('global-search-input').addEventListener('input', debounce(applyGlobalFilter, 300));
    
    document.getElementById('addNewButton').addEventListener('click', () => openEditPanel());
    document.getElementById('fab-theme').addEventListener('click', changeTheme);
    document.getElementById('fab-settings').addEventListener('click', openSettingsModal);
    document.getElementById('fab-help').addEventListener('click', openHelpModal);
    
    document.getElementById('global-view-switcher').addEventListener('click', (e) => {
        const button = e.target.closest('button');
        if(button && button.dataset.view) {
            globalView = button.dataset.view;
            localStorage.setItem('globalView', globalView);
            document.querySelectorAll('#global-view-switcher button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            refreshUI();
        }
    });
}

function initializeUI() {
    applyTheme(currentTheme);
    if (window.innerWidth >= 1024) {
        document.querySelector('main').style.marginLeft = '280px';
    }
    switchTab('buscadores');
    document.querySelector(`#global-view-switcher button[data-view="${globalView}"]`).classList.add('active');
}

function refreshUI() {
    const activeSection = document.querySelector('#main-nav .active')?.dataset.section || 'buscadores';
    applyGlobalFilter();
}

function switchTab(tabName) {
    document.querySelectorAll("#main-nav .nav-link").forEach(b => b.classList.remove("active"));
    const activeLink = document.querySelector(`#main-nav .nav-link[data-section="${tabName}"]`);
    activeLink.classList.add("active");
    
    document.getElementById('main-title').textContent = activeLink.querySelector('span').textContent;

    document.querySelectorAll(".section").forEach(s => s.classList.add("hidden"));
    document.getElementById(`section-${tabName}`).classList.remove("hidden");
    
    const kanbanButton = document.querySelector('#global-view-switcher button[data-view="kanban"]');
    kanbanButton.style.display = (tabName === 'notes-tasks') ? 'inline-flex' : 'none';
    if(globalView === 'kanban' && tabName !== 'notes-tasks') {
        globalView = 'grid';
        localStorage.setItem('globalView', globalView);
        document.querySelectorAll('#global-view-switcher button').forEach(b => b.classList.remove('active'));
        document.querySelector('#global-view-switcher button[data-view="grid"]').classList.add('active');
    }

    applyGlobalFilter();
}

// --- RENDER FUNCTIONS ---
function renderSection(sectionName, itemsToRender, searchTerm = '') {
    const container = document.getElementById(`section-${sectionName}`);
    container.innerHTML = '';
    
    if (sectionName === 'notes-tasks') {
        renderNotesAndTasksSection(container, itemsToRender, searchTerm);
        return;
    }

    if (itemsToRender.length === 0) {
        renderEmptyState(container, sectionName);
        return;
    }
    
    renderFavoritesBar(container, itemsToRender);

    const categorized = itemsToRender.reduce((acc, item) => {
        const category = item.category || 'Sin Categoría';
        if (!acc[category]) acc[category] = [];
        acc[category].push(item);
        return acc;
    }, {});

    const sectionOrders = data.categoryOrders?.[sectionName] || [];
    const sortedCategories = [...sectionOrders, ...Object.keys(categorized).filter(c => !sectionOrders.includes(c))];

    sortedCategories.forEach(categoryName => {
        if (categorized[categoryName]) {
            const catWrapper = document.createElement('div');
            catWrapper.className = 'mb-12';
            catWrapper.innerHTML = `<h2 class="text-xl font-bold mb-4 text-muted-foreground">${categoryName}</h2>`;
            const contentContainer = document.createElement('div');
            
            const viewClasses = { grid: 'card-grid', list: 'list-view', table: 'table-view' };
            contentContainer.className = viewClasses[globalView] || 'card-grid';
            
            categorized[categoryName].forEach(item => {
                let element;
                if (globalView === 'grid') element = createCard(item, searchTerm);
                else if (globalView === 'list') element = createListItem(item, searchTerm);
                else if (globalView === 'table') element = createTableItem(item, searchTerm);
                
                if (element) contentContainer.appendChild(element);
            });

            catWrapper.appendChild(contentContainer);
            container.appendChild(catWrapper);
        }
    });
}

function renderNotesAndTasksSection(container, itemsToRender, searchTerm = '') {
    // Similar logic but separates notes and tasks, and handles Kanban view
    // This is a simplified placeholder. A full implementation is needed.
    container.innerHTML = '<p>Notas y Tareas sección en construcción</p>';
}

function renderFavoritesBar(container, items) {
    const favorites = items.filter(i => i.isFavorite);
    if (favorites.length === 0) return;

    const bar = document.createElement('div');
    bar.className = 'mb-8';
    bar.innerHTML = `<h2 class="text-xl font-bold mb-4 text-muted-foreground">Favoritos</h2>`;
    const favContainer = document.createElement('div');
    favContainer.className = 'flex flex-wrap gap-4';
    
    favorites.forEach(item => {
        const favIcon = document.createElement('div');
        favIcon.className = 'flex items-center gap-2 p-2 pr-4 rounded-full bg-secondary cursor-pointer hover:bg-accent transition';
        favIcon.innerHTML = `
            <div class="w-8 h-8 bg-card-background rounded-full flex items-center justify-center">${getIconHtml(item.icon, 'text-lg')}</div>
            <span class="font-semibold text-sm">${item.title}</span>
        `;
        favIcon.onclick = (e) => handleCardClick(item.id, e);
        favContainer.appendChild(favIcon);
    });

    bar.appendChild(favContainer);
    container.appendChild(bar);
}


function createCard(item, searchTerm = '') {
    const card = document.createElement("div");
    card.className = 'card fade-in';
    card.dataset.id = item.id;
    if (item.isFavorite) card.classList.add('is-favorite');

    const previewUrl = (item.type === 'Link' || item.type === 'Buscador') 
        ? `https://s.wordpress.com/mshots/v1/${encodeURIComponent(item.action.split('?')[0])}?w=400`
        : '';

    card.innerHTML = `
        <div class="card-bg-preview" style="background-image: url('${previewUrl}')"></div>
        <div class="card-overlay">
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center flex-shrink-0">
                        ${getIconHtml(item.icon, 'text-2xl', true)}
                    </div>
                    <div class="overflow-hidden">
                        <h4 class="font-bold text-base uppercase truncate text-white" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">${item.title}</h4>
                        <p class="text-xs text-white/80 truncate">${item.category || ''}</p>
                    </div>
                </div>
                <div class="card-actions flex gap-1">
                     <button onclick="toggleFavorite(event, '${item.id}')" class="btn btn-ghost !p-2 !text-white/80 hover:!bg-white/20"><i class="${item.isFavorite ? 'fas' : 'far'} fa-star text-yellow-400"></i></button>
                </div>
            </div>
        </div>
    `;
    card.addEventListener('click', (e) => handleCardClick(item.id, e));
    return card;
}

function createListItem(item, searchTerm = '') {
    const listItem = document.createElement("div");
    listItem.className = 'list-item';
    listItem.dataset.id = item.id;
    if (item.isFavorite) listItem.classList.add('is-favorite');

    listItem.innerHTML = `
        <div class="w-10 h-10 bg-secondary rounded-lg flex items-center justify-center flex-shrink-0">${getIconHtml(item.icon, 'text-xl')}</div>
        <div class="flex-grow overflow-hidden">
            <h4 class="font-bold truncate">${item.title}</h4>
            <p class="text-sm text-muted-foreground truncate">${item.category || ''}</p>
        </div>
        <div class="list-item-actions flex items-center gap-2">
            <button onclick="toggleFavorite(event, '${item.id}')" class="btn btn-ghost !p-2"><i class="${item.isFavorite ? 'fas' : 'far'} fa-star text-yellow-400"></i></button>
            <button onclick="openEditPanel('${item.id}')" class="btn btn-ghost !p-2"><i class="fas fa-pencil-alt"></i></button>
        </div>
    `;
    listItem.addEventListener('click', (e) => handleCardClick(item.id, e));
    return listItem;
}

function createTableItem(item, searchTerm = '') {
    const tableItem = document.createElement("div");
    tableItem.className = 'table-item';
    tableItem.dataset.id = item.id;
    if (item.isFavorite) tableItem.classList.add('is-favorite');

    tableItem.innerHTML = `
        <div class="table-item-actions absolute top-1 right-1">
            <button onclick="toggleFavorite(event, '${item.id}')" class="btn btn-ghost !p-1 !text-xs"><i class="${item.isFavorite ? 'fas' : 'far'} fa-star text-yellow-400"></i></button>
        </div>
        <div class="w-16 h-16 mb-2 flex items-center justify-center">${getIconHtml(item.icon, 'text-4xl')}</div>
        <h4 class="font-semibold text-sm text-center truncate w-full">${item.title}</h4>
    `;
    tableItem.addEventListener('click', (e) => handleCardClick(item.id, e));
    return tableItem;
}


// --- ACTIONS & EVENT HANDLERS ---
function handleCardClick(id, event) {
    if (event.target.closest('button')) return; 
    const item = data.items.find(i => String(i.id) === String(id));
    if (!item) return;

    if (item.type === "Link") {
        window.open(item.action, "_blank");
    } else if (item.type === "Buscador") {
        const term = prompt(`Buscar en ${item.title}:`);
        if (term) window.open(item.action.replace('{search_term}', encodeURIComponent(term)), '_blank');
    } else if (item.type === "Promp") {
        navigator.clipboard.writeText(item.action).then(() => showToast("Prompt copiado."));
    } else {
        openEditPanel(id);
    }
}

function toggleFavorite(event, itemId) {
    event.stopPropagation();
    const item = data.items.find(i => String(i.id) === String(itemId));
    if (item) {
        item.isFavorite = !item.isFavorite;
        
        const numericId = parseInt(itemId, 10);
        if (item.isFavorite) {
            if (!data.favoriteOrder.includes(numericId)) data.favoriteOrder.push(numericId);
        } else {
            data.favoriteOrder = data.favoriteOrder.filter(id => id !== numericId);
        }
        
        saveData().then(refreshUI);
    }
}


function applyGlobalFilter() {
    const searchTerm = document.getElementById('global-search-input').value.toLowerCase();
    const activeNavBtn = document.querySelector('.nav-link.active');
    if (!activeNavBtn) return;
    
    let activeSectionName = activeNavBtn.dataset.section;
    
    const typeMap = { 'buscadores': 'Buscador', 'links': 'Link', 'prompts': 'Promp', 'notes-tasks': ['Nota', 'Tarea'] };
    const activeType = typeMap[activeSectionName];
    
    const itemsToFilter = data.items.filter(item => 
        Array.isArray(activeType) ? activeType.includes(item.type) : item.type === activeType
    );

    const results = itemsToFilter.filter(card => {
        if (!searchTerm) return true;
        const titleMatch = card.title.toLowerCase().includes(searchTerm);
        const categoryNameMatch = (card.category || '').toLowerCase().includes(searchTerm);
        const tagListMatch = (card.tags || []).join(' ').toLowerCase().includes(searchTerm);
        
        let contentMatch = false;
        if (typeof card.action === 'string') {
            contentMatch = card.action.toLowerCase().includes(searchTerm);
        } else if (Array.isArray(card.action)) {
            contentMatch = card.action.some(task => task.text.toLowerCase().includes(searchTerm));
        }
        
        return titleMatch || categoryNameMatch || tagListMatch || contentMatch;
    });
    
    renderSection(activeSectionName, results, searchTerm);
}

function renderEmptyState(container, sectionName) {
    const titles = {
        buscadores: "Sin Buscadores",
        links: "Sin Links",
        prompts: "Sin Prompts",
        'notes-tasks': "Sin Notas ni Tareas"
    };
    container.innerHTML = `
        <div class="text-center py-16 px-6 rounded-lg border-2 border-dashed border-border">
            <h3 class="text-xl font-semibold">${titles[sectionName]}</h3>
            <p class="text-muted-foreground mt-2 mb-4">Añade tu primer elemento para empezar.</p>
            <button onclick="openEditPanel()" class="btn btn-primary">Añadir Nuevo</button>
        </div>
    `;
}

// --- THEME & MODALS ---
function changeTheme() {
    currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
    applyTheme(currentTheme);
}

function applyTheme(theme) {
    document.body.classList.remove('light', 'dark');
    document.body.classList.add(theme);
    localStorage.setItem('theme', theme);
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
}

function getIconHtml(icon, sizeClass = 'text-2xl', isForCard = false) {
    const colorClass = isForCard ? 'text-white/90' : 'text-foreground';
    const errorColorClass = isForCard ? 'text-white/50' : 'text-muted-foreground';

    if (!icon) return `<i class="fas fa-question-circle ${sizeClass} ${errorColorClass}"></i>`;
    if (icon.startsWith('http')) {
        const imgClass = { 'text-lg': 'w-5 h-5', 'text-xl': 'w-6 h-6', 'text-2xl': 'w-8 h-8', 'text-4xl': 'w-12 h-12' }[sizeClass] || 'w-6 h-6';
        return `<img src="${icon}" class="${imgClass} object-contain" alt="Icono" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fas fa-question-circle ${sizeClass} ${errorColorClass}\\'></i>';">`;
    }
    return `<i class="${icon} ${sizeClass} ${colorClass}"></i>`;
}

// Full modal implementations needed
function openEditPanel(itemId = null) { showToast(`Abrir editor para item: ${itemId || 'nuevo'}`); }
function openSettingsModal() { showToast("Abrir configuración"); }
function openHelpModal() { showToast("Abrir ayuda"); }
function updateSyncStatus(status, message = '') {
    const iconEl = document.getElementById('sync-icon');
    const textEl = document.getElementById('sync-text');
    iconEl.className = 'fas'; 
    switch (status) {
        case 'loading':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Cargando...';
            break;
        case 'saving':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Guardando...';
            break;
        case 'synced':
            iconEl.classList.add('fa-check-circle');
            textEl.textContent = 'Sincronizado';
            break;
        case 'local':
            iconEl.classList.add('fa-save');
            textEl.textContent = 'Guardado Local';
            break;
        case 'error':
            iconEl.classList.add('fa-exclamation-triangle');
            textEl.textContent = message || 'Error';
            break;
    }
}
