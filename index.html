<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botonera Definitiva - IA de Video</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #111827; --foreground: #e5e7eb; --card-background: #1f2937;
            --primary: #8b5cf6; --primary-hover: #7c3aed; --secondary: #374151;
            --muted-foreground: #9ca3af; --border: #374151; --radius: 0.75rem;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--foreground); }
        .sidebar { background-color: #1f2937; }
        .nav-link.active { background-color: #312e81; color: #a78bfa; }
        
        .card, .widget {
            background: var(--card-background);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.2s ease-in-out;
            position: relative;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            z-index: 5; 
        }

        .kebab-menu-container {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 10;
            cursor: default;
        }
        .kebab-button {
            background-color: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            color: #e5e7eb;
            border-radius: 9999px;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .card:hover .kebab-button, .widget:hover .kebab-button { opacity: 1; }
        .kebab-button:hover { background-color: rgba(0,0,0,0.5); }
        .kebab-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 2.5rem;
            background-color: #374151;
            border-radius: var(--radius);
            border: 1px solid #4b5563;
            box-shadow: var(--shadow-lg);
            width: 200px;
            z-index: 20;
            padding: 0.5rem;
        }
        .kebab-menu-container.is-open .kebab-menu { display: block; }
        .kebab-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .kebab-menu-item:hover { background-color: var(--primary); color: white; }
        .kebab-menu-item.delete:hover { background-color: #ef4444; }

        .search-selector-container:hover .search-selector-menu { display: block; }
        .search-selector-menu .kebab-menu-item img { border-radius: 4px; }
        kbd {
             background-color: #4b5563; border-radius: 4px; border: 1px solid #6b7280;
             color: var(--foreground); display: inline-block; font-family: monospace;
             font-size: .8em; font-weight: 600; line-height: 1; padding: 2px 6px;
        }
        .card-bg-fx {
            background-size: cover;
            background-position: center;
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .card:hover .card-bg-fx {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        .section.hidden { display: none; }
    </style>
</head>
<body class="dark">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="sidebar w-72 p-4 flex-shrink-0 flex flex-col">
            <div class="flex items-center gap-4 pb-4 px-2">
                <img src="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png" alt="Logo" class="w-16 h-16">
            </div>
            <nav id="main-nav" class="flex-grow space-y-2 px-2">
                <a href="#" data-section="inicio" class="nav-link flex items-center gap-3 p-3 rounded-lg active"><i class="fas fa-home w-5 text-center"></i><span>Inicio</span></a>
                <a href="#" data-section="buscadores" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-search w-5 text-center"></i><span>Buscadores</span></a>
                <a href="#" data-section="links" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-link w-5 text-center"></i><span>Links</span></a>
                <a href="#" data-section="prompts" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-brain w-5 text-center"></i><span>Prompts</span></a>
                <a href="#" data-section="notes-tasks" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-check-double w-5 text-center"></i><span>Notas y Tareas</span></a>
                <a href="#" data-section="videos" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-tv w-5 text-center"></i><span>Videos</span></a>
                <a href="#" data-section="ia" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-robot w-5 text-center"></i><span>IA</span></a>
            </nav>
            <div class="mt-auto pt-4 border-t border-border px-2">
                <a href="#" id="settings-button" class="nav-link flex items-center gap-3 p-3 rounded-lg"><i class="fas fa-cog w-5 text-center"></i><span>Ajustes</span></a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main id="main-content" class="flex-1 p-8 overflow-y-auto">
            <div id="section-inicio" class="section"></div>
            <div id="section-buscadores" class="section hidden"></div>
            <div id="section-links" class="section hidden"></div>
            <div id="section-prompts" class="section hidden"></div>
            <div id="section-notes-tasks" class="section hidden"></div>
            <div id="section-videos" class="section hidden"></div>
            <div id="section-ia" class="section hidden"></div>
        </main>
    </div>

    <!-- Botón Flotante "+" -->
    <button class="fixed bottom-8 right-8 bg-primary hover:bg-primary-hover text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg transform hover:scale-110 transition-transform z-20" title="Añadir Elemento">
        <i class="fas fa-plus text-2xl"></i>
    </button>
    
    <!-- Modals -->
    <div id="modal-container" class="hidden fixed inset-0 z-[1100] p-4 flex items-center justify-center bg-black/70 backdrop-blur-sm"></div>
    <!-- Video Player Modal -->
    <div id="videoPlayerModal" class="hidden fixed inset-0 z-[1200] p-4 flex items-center justify-center bg-black/70 backdrop-blur-sm"></div>
    <div id="toast" class="hidden fixed bottom-5 right-5 p-4 rounded-lg font-bold z-[2000] shadow-lg"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- STATE & CONFIG ---
    let data = { items: [], searchEngines: [], iaBots: [], videoPrompts: [] };
    let currentSearchEngine = null;
    const FILENAME_IN_GIST = 'Botonera.json';
    const OLD_FILENAME_IN_GIST = 'Botones.json';
    
    const mainNav = document.getElementById('main-nav');
    const sections = document.querySelectorAll('.section');
    const mainTitle = document.createElement('h1');
    mainTitle.className = 'text-3xl font-bold tracking-tight';
    
    function getSampleData() {
        return {
            items: [
                { id: 1, type: 'Link', title: 'GitHub', category: 'Desarrollo', icon: 'fab fa-github', action: 'https://github.com' },
                { id: 5, type: 'Link', title: 'Figma', category: 'Diseño', icon: 'fab fa-figma', action: 'https://figma.com' },
                { id: 6, type: 'Nota', title: 'Reunión Lunes', category: 'Trabajo', icon: 'fas fa-sticky-note', action: '- Discutir presupuesto Q3.<br>- Revisar métricas.' },
                { id: 8, type: 'Tarea', title: 'Proyecto Web', category: 'Proyectos', icon: 'fas fa-tasks', action: [{ text: 'Diseñar mockup', done: true }, { text: 'Desarrollar landing', done: false }] },
                { id: 10, type: 'Video', title: 'Aprende Javascript en 10 minutos', category: 'Educación', icon: 'fab fa-youtube', action: 'https://www.youtube.com/watch?v=PkZNo7MFNFg' }
            ],
            searchEngines: [
                { id: 'app', title: 'Búsqueda en la App', icon: 'https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png', isApp: true },
                { id: 'google', type: 'Buscador', title: 'Google', icon: 'fab fa-google', shortcut: 'g', action: 'https://www.google.com/search?q={searchTerm}' },
                { id: 'youtube', type: 'Buscador', title: 'YouTube', icon: 'fab fa-youtube', iconColor: 'text-red-500', shortcut: 'y', action: 'https://www.youtube.com/results?search_query={searchTerm}' }
            ],
            iaBots: [
                { id: 15, title: 'Asistente WhatsApp', description: 'Escribe mensajes profesionales a clientes', icon: 'fab fa-whatsapp', iconColor: 'text-green-500' },
                { id: 16, title: 'Generador de Emails', description: 'Crea correos de seguimiento de ventas', icon: 'fas fa-at', iconColor: 'text-blue-400' }
            ],
            videoPrompts: [
                { id: 'summary', title: "📌 Resumen Breve", prompt: "Resume el video en una sola frase o máximo 3 líneas. Debe incluir lo más importante, por qué importa y qué debo recordar." },
                { id: 'timestamps', title: "⏱️ Marcas de Tiempo", prompt: "Extrae los momentos clave del video y organízalos en una lista con timestamps (minutos:segundos) y una descripción breve." },
                { id: 'key-ideas', title: "💡 Ideas Clave", prompt: "Extrae de 3 a 5 ideas o conceptos clave del video que deba recordar, explicando brevemente cada una." },
            ]
        };
    }

    // --- DATA HANDLING (GIST) ---
    async function loadData() {
        const gistId = localStorage.getItem('gist_id');
        const token = localStorage.getItem('github_pat');
        const defaults = getSampleData();

        if (!gistId || !token) {
            console.log("No Gist credentials, using sample data.");
            data = defaults;
            initializeUI();
            return;
        }

        try {
            const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!response.ok) throw new Error(`Error de red: ${response.status}`);
            const gistData = await response.json();
            const content = gistData.files[FILENAME_IN_GIST]?.content || gistData.files[OLD_FILENAME_IN_GIST]?.content;
            
            if (content) {
                const gistContent = JSON.parse(content);
                const allItems = gistContent.items || [];
                const searchEnginesFromGist = allItems.filter(i => i.type === 'Buscador');
                const regularItems = allItems.filter(i => i.type !== 'Buscador');

                data = {
                    ...defaults,
                    ...gistContent,
                    items: regularItems.length > 0 ? regularItems : (gistContent.items ? [] : defaults.items),
                    searchEngines: searchEnginesFromGist.length > 0 ? [defaults.searchEngines[0], ...searchEnginesFromGist] : defaults.searchEngines,
                    iaBots: gistContent.iaBots || defaults.iaBots,
                    videoPrompts: (gistContent.videoPrompts && gistContent.videoPrompts.length > 0) ? gistContent.videoPrompts : defaults.videoPrompts
                };
                showToast("Datos cargados desde Gist.", "success");
            } else {
                throw new Error('Archivo no encontrado en Gist. Revisa el nombre del archivo en tu Gist.');
            }
        } catch (error) {
            console.error("Error loading from Gist, using sample data as fallback:", error);
            showToast(`${error.message}`, "error");
            data = defaults;
        }
        initializeUI();
    }
    
    function initializeUI() {
        const searchEngines = data.searchEngines || [];
        if (searchEngines.length > 0) {
            currentSearchEngine = searchEngines[0];
        }
        setupEventListeners();
        switchTab('inicio');
    }
    
    // --- RENDER FUNCTIONS ---
    function createHeader(title) {
        const header = document.createElement('header');
        header.className = 'flex justify-between items-center mb-8';
        mainTitle.textContent = title.toUpperCase();
        header.appendChild(mainTitle);

        const searchBarContainer = document.createElement('div');
        searchBarContainer.innerHTML = `
            <div class="flex items-center w-full max-w-lg bg-card-background border border-border rounded-lg focus-within:ring-2 focus-within:ring-primary transition-shadow h-12">
                <div class="relative search-selector-container h-full">
                    <button id="search-selector-button" class="flex items-center gap-2 pl-4 pr-3 h-full rounded-l-lg hover:bg-white/5 transition-colors"></button>
                    <div class="kebab-menu search-selector-menu" style="top: 100%; left:0; width: 240px; margin-top: 0.5rem; z-index: 30;">
                        ${(data.searchEngines || []).map((engine, index) => `
                            ${index === 1 && data.searchEngines.length > 1 ? '<div class="w-full h-px bg-border my-1"></div>' : ''}
                            <a data-engine-id="${engine.id}" class="kebab-menu-item search-engine-option ${currentSearchEngine && engine.id === currentSearchEngine.id ? 'bg-primary text-white' : ''}">
                                ${engine.isApp ? `<img src="${engine.icon}" class="w-5 h-5">` : `<i class="${engine.icon} w-5 text-center ${engine.iconColor || ''}"></i>`}
                                <span class="flex-grow">${engine.title}</span>
                                ${engine.shortcut ? `<kbd>${engine.shortcut}</kbd>` : ''}
                            </a>
                        `).join('')}
                    </div>
                </div>
                <input id="search-input" type="text" class="w-full h-full bg-transparent border-0 focus:ring-0 pr-4 text-lg">
            </div>`;
        header.appendChild(searchBarContainer);
        updateSearchSelectorButton(header);
        return header;
    }
    
    function createKebabMenu(item) {
        let aiAction = '';
        if (item.action && typeof item.action === 'string' && item.action.includes('youtube.com')) {
            aiAction = `<a onclick='window.app.openVideoAIPanel(${JSON.stringify(item)})' class="kebab-menu-item"><i class="fas fa-magic w-4"></i> Analizar con IA</a>`;
        }
        return `
        <div class="kebab-menu-container">
            <button class="kebab-button"><i class="fas fa-ellipsis-v"></i></button>
            <div class="kebab-menu">
                <a class="kebab-menu-item"><i class="fas fa-pencil-alt w-4"></i> Editar</a>
                <a class="kebab-menu-item"><i class="far fa-star w-4"></i> Favorito</a>
                ${aiAction}
                <a class="kebab-menu-item delete"><i class="fas fa-trash-alt w-4"></i> Eliminar</a>
            </div>
        </div>`;
    }
    
    function getYouTubeID(url) {
        if (!url || typeof url !== 'string') return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function renderLinkCard(item) {
        const previewUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(item.action)}?w=400`;
        return `<div class="card h-48 text-white flex flex-col justify-end p-5" data-id="${item.id}"><div class="card-bg-fx" style="background-image: linear-gradient(to top, rgba(0,0,0,0.85), transparent), url('${previewUrl}');"></div><div class="relative z-10" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.7);"><i class="${item.icon} text-2xl mb-2 opacity-80"></i><h4 class="font-bold truncate">${item.title}</h4><p class="text-sm text-white/80">${item.category}</p></div>${createKebabMenu(item)}</div>`;
    }
    
    function renderBuscadorCard(item) {
         const previewUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(`https://www.${item.title.toLowerCase()}.com`)}?w=400`;
         return `<div class="card h-48 text-white flex flex-col justify-center items-center p-5 text-center" data-id="${item.id}"><div class="card-bg-fx" style="background-image: linear-gradient(to top, rgba(0,0,0,0.85), transparent), url('${previewUrl}'); filter: blur(4px);"></div><div class="relative z-10" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.7);"><i class="${item.icon} text-5xl mb-3 ${item.iconColor || ''}"></i><h4 class="font-bold text-xl truncate">${item.title}</h4></div>${createKebabMenu(item)}</div>`;
    }

    function renderNoteTaskCard(item) {
        const isTask = item.type === 'Tarea';
        let contentHtml = isTask ? `<ul class="text-sm text-muted-foreground mt-4 space-y-2 flex-grow overflow-y-auto pr-2">${(item.action || []).map(t => `<li class="${t.done ? 'line-through' : ''}"><i class="fas ${t.done ? 'fa-check-circle text-green-500' : 'fa-circle'} mr-2"></i>${t.text}</li>`).join('')}</ul>` : `<div class="text-sm text-muted-foreground mt-4 flex-grow overflow-y-auto pr-2">${item.action}</div>`;
        return `<div class="card p-5 flex flex-col h-48 ${isTask ? 'border-l-4 border-blue-500' : 'border-l-4 border-yellow-500'}" data-id="${item.id}"><div class="w-full flex justify-between items-start"><div class="flex-grow"><h4 class="font-bold">${item.title}</h4><p class="text-sm text-muted-foreground">${item.category}</p></div>${createKebabMenu(item)}</div>${contentHtml}</div>`;
    }

    function renderVideoCard(item) {
        const videoId = getYouTubeID(item.action);
        const previewUrl = videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : '';
        return `
        <div class="card h-48 text-white flex flex-col justify-end p-5 group" data-id="${item.id}">
            <div class="card-bg-fx" style="background-image: linear-gradient(to top, rgba(0,0,0,0.85), transparent), url('${previewUrl}');"></div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <i class="fas fa-play text-5xl text-white/70 backdrop-blur-sm bg-black/20 rounded-full p-4 transition-all duration-300 group-hover:text-white group-hover:scale-110"></i>
            </div>
            <div class="relative z-10" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">
                <h4 class="font-bold truncate">${item.title}</h4>
                <p class="text-sm text-white/80">${item.category}</p>
            </div>
            ${createKebabMenu(item)}
        </div>`;
    }

    function renderPromptCard(item) {
         return `<div class="card p-5 flex items-center gap-4 h-24 border-l-4 border-green-500" data-id="${item.id}"><div class="w-12 h-12 bg-secondary rounded-lg flex items-center justify-center flex-shrink-0"><i class="${item.icon} text-3xl"></i></div><div class="flex-grow overflow-hidden"><h4 class="font-bold truncate">${item.title}</h4><p class="text-sm text-muted-foreground truncate">${item.category}</p></div>${createKebabMenu(item)}</div>`;
    }
    
    function renderInicio() {
        const section = document.getElementById('section-inicio');
        section.innerHTML = '';
        section.appendChild(createHeader('Inicio'));
        const content = document.createElement('div');
        content.className = 'space-y-12';
        content.innerHTML = `
            <section class="grid grid-cols-1 md:grid-cols-3 gap-8"><div class="widget md:col-span-1 p-6"><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">Agenda</h3><button class="text-muted-foreground hover:text-white"><i class="fas fa-plus"></i></button></div><div class="space-y-3"><div class="text-sm"><p class="font-medium">Cumpleaños de Ana</p><p class="text-xs text-muted-foreground">15 de septiembre</p></div><div class="text-sm"><p class="font-medium">Entrega Proyecto Final</p><p class="text-xs text-muted-foreground">22 de septiembre</p></div></div></div><div class="widget md:col-span-2 p-6"><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">Bloc de Notas Rápido</h3><button class="text-muted-foreground hover:text-white">✨ Organizar</button></div><textarea class="w-full h-24 bg-secondary p-2 rounded-md focus:ring-2 focus:ring-primary focus:outline-none resize-none text-sm" placeholder="Apunta algo..."></textarea></div></section>
            <section><h2 class="text-xl font-bold mb-4 text-muted-foreground">Favoritos</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${(data.items.filter(i => i.type === 'Link') || []).slice(0, 3).map(renderLinkCard).join('')}</div></section>`;
        section.appendChild(content);
    }
    
    function renderIA() {
        const section = document.getElementById('section-ia');
        section.innerHTML = '';
        section.appendChild(createHeader('IA'));
        const content = document.createElement('div');
        content.className = "grid grid-cols-1 lg:grid-cols-2 gap-8";
        content.innerHTML = (data.iaBots || []).map(bot => `
            <div class="widget p-6 flex flex-col gap-4"><div class="flex justify-between items-start relative"><div class="flex items-center gap-4"><i class="${bot.icon} text-3xl ${bot.iconColor}"></i><div><h3 class="font-bold text-lg">${bot.title}</h3><p class="text-sm text-muted-foreground">${bot.description}</p></div></div><div class="kebab-menu-container"><button class="kebab-button"><i class="fas fa-ellipsis-v"></i></button><div class="kebab-menu"><a class="kebab-menu-item"><i class="fas fa-edit w-4"></i> Editar Bot</a><a class="kebab-menu-item delete"><i class="fas fa-trash-alt w-4"></i> Eliminar</a></div></div></div>
                ${ bot.title.includes('WhatsApp') ? `<div><label class="text-sm font-medium text-muted-foreground">1. Escribe tu idea aquí:</label><textarea placeholder="Ej: decirle al cliente que su pedido está retrasado..." class="w-full h-24 mt-1 bg-secondary p-2 rounded-md focus:ring-2 focus:ring-primary focus:outline-none resize-none text-sm"></textarea></div><button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-4 rounded-lg">Generar Mensaje ✨</button><div class="flex-grow"><label class="text-sm font-medium text-muted-foreground">2. Mensaje generado:</label><div class="w-full h-36 mt-1 bg-background p-3 rounded-md text-sm overflow-y-auto"><p>¡Hola [Nombre Cliente]! 😊...</p></div></div><button class="w-full flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg mt-auto"><i class="fab fa-whatsapp"></i>Copiar y Abrir en WhatsApp</button>` : `<div class="h-full flex items-center justify-center text-center text-muted-foreground border-2 border-dashed border-border rounded-lg"><p>Configura este bot...</p></div>` }
            </div>`).join('');
        section.appendChild(content);
    }
    
    function renderSectionContent(sectionId, title, items, cardRenderer) {
        const section = document.getElementById(`section-${sectionId}`);
        if (!section) { console.error(`Section with ID 'section-${sectionId}' not found.`); return; }
        section.innerHTML = '';
        section.appendChild(createHeader(title));
        const content = document.createElement('div');
        content.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
        content.innerHTML = (items || []).map(cardRenderer).join('');
        section.appendChild(content);
    }

    function updateSearchSelectorButton(container) {
        const btn = container.querySelector('#search-selector-button');
        const input = container.querySelector('#search-input');
        if(!btn || !input || !currentSearchEngine) return;

        btn.innerHTML = `
            ${currentSearchEngine.isApp ? `<img src="${currentSearchEngine.icon}" class="w-5 h-5">` : `<i class="${currentSearchEngine.icon} text-xl ${currentSearchEngine.iconColor || ''}"></i>`}
            <i class="fas fa-chevron-down text-xs text-muted-foreground"></i>`;
        input.placeholder = `Buscar en ${currentSearchEngine.title}...`;
    }

    function switchTab(sectionId) {
        mainNav.querySelectorAll('.nav-link').forEach(link => link.classList.toggle('active', link.dataset.section === sectionId));
        sections.forEach(section => section.classList.toggle('hidden', section.id !== `section-${sectionId}`));
        
        const sectionElement = document.getElementById(`section-${sectionId}`);
        if (!sectionElement) return;
        sectionElement.innerHTML = ''; 
        
        const typeMap = {
            links: 'Link', prompts: 'Prompt', 
            'notes-tasks': ['Nota', 'Tarea'], videos: 'Video'
        };
        const rendererMap = {
            buscadores: renderBuscadorCard, links: renderLinkCard, prompts: renderPromptCard,
            'notes-tasks': renderNoteTaskCard, videos: renderVideoCard
        };

        if (sectionId === 'inicio') renderInicio();
        else if (sectionId === 'ia') renderIA();
        else if (sectionId === 'buscadores') {
            const buscadores = (data.searchEngines || []).filter(s => !s.isApp);
            renderSectionContent(sectionId, 'Buscadores', buscadores, renderBuscadorCard);
        }
        else {
            const type = typeMap[sectionId];
            const items = (data.items || []).filter(item => Array.isArray(type) ? type.includes(item.type) : item.type === type);
            renderSectionContent(sectionId, sectionId.replace('-', ' y '), items, rendererMap[sectionId]);
        }

        const currentHeader = sectionElement.querySelector('header');
        if (currentHeader) {
            currentHeader.addEventListener('click', (e) => {
                const option = e.target.closest('.search-engine-option');
                if (option) {
                    currentSearchEngine = (data.searchEngines || []).find(eng => eng.id === option.dataset.engineId);
                    updateSearchSelectorButton(currentHeader);
                    currentHeader.querySelectorAll('.search-engine-option').forEach(opt => opt.classList.remove('bg-primary', 'text-white'));
                    option.classList.add('bg-primary', 'text-white');
                }
            });
        }
    }
    
    // --- EVENT LISTENERS ---
    function setupEventListeners() {
        document.addEventListener('click', (e) => {
            const kebabButton = e.target.closest('.kebab-button');
            const openMenuContainer = document.querySelector('.kebab-menu-container.is-open');

            if (openMenuContainer && !openMenuContainer.contains(e.target)) {
                openMenuContainer.classList.remove('is-open');
            }

            if (kebabButton) {
                e.stopPropagation();
                const container = kebabButton.closest('.kebab-menu-container');
                const wasOpen = container.classList.contains('is-open');
                
                document.querySelectorAll('.kebab-menu-container.is-open').forEach(menu => {
                    menu.classList.remove('is-open');
                });

                if (!wasOpen) {
                    container.classList.add('is-open');
                }
            }
        });

        document.getElementById('main-content').addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card && !e.target.closest('.kebab-menu-container, a, button')) {
                const id = parseInt(card.dataset.id, 10);
                const item = (data.items || []).find(i => i.id === id);
                if (!item) return;

                if (item.type === 'Video') {
                    window.app.openVideoPlayerModal(item);
                } else if (item.type === 'Link') {
                    window.open(item.action, '_blank');
                }
            }
        });

        mainNav.addEventListener('click', (e) => {
            const navLink = e.target.closest('.nav-link');
            if (navLink && navLink.dataset.section) {
                e.preventDefault();
                switchTab(navLink.dataset.section);
            }
        });

        document.getElementById('settings-button').addEventListener('click', openSettingsPanel);
    }

    // --- MODAL & UI FUNCTIONS ---
    function openSettingsPanel() {
        const modalContainer = document.getElementById('modal-container');
        const gistId = localStorage.getItem('gist_id') || '';
        const pat = localStorage.getItem('github_pat') || '';
        const geminiKey = localStorage.getItem('gemini_api_key') || '';

        modalContainer.innerHTML = `
            <div class="widget p-6 w-full max-w-lg relative">
                <button onclick="document.getElementById('modal-container').classList.add('hidden')" class="absolute top-4 right-4 text-muted-foreground hover:text-white">&times;</button>
                <h3 class="font-bold text-lg mb-4">Ajustes</h3>
                <div class="space-y-4">
                    <div><label for="gistIdInput" class="font-semibold block mb-2 text-sm">Gist ID</label><input type="text" id="gistIdInput" class="w-full bg-secondary p-2 rounded-md" value="${gistId}" placeholder="El ID de tu Gist de GitHub"></div>
                    <div><label for="githubPatInput" class="font-semibold block mb-2 text-sm">GitHub Personal Access Token</label><input type="password" id="githubPatInput" class="w-full bg-secondary p-2 rounded-md" value="${pat}" placeholder="Token con permiso 'gist'"></div>
                    <div><label for="geminiApiKeyInput" class="font-semibold block mb-2 text-sm">Gemini API Key</label><input type="password" id="geminiApiKeyInput" class="w-full bg-secondary p-2 rounded-md" value="${geminiKey}" placeholder="Pega tu clave de API de Google AI Studio"></div>
                    <div class="flex justify-end"><button id="save-settings-btn" class="bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-4 rounded-lg">Guardar y Recargar</button></div>
                </div>
            </div>`;
        modalContainer.classList.remove('hidden');
        document.getElementById('save-settings-btn').addEventListener('click', saveSettings);
    }

    function saveSettings() {
        localStorage.setItem('gist_id', document.getElementById('gistIdInput').value.trim());
        localStorage.setItem('github_pat', document.getElementById('githubPatInput').value.trim());
        localStorage.setItem('gemini_api_key', document.getElementById('geminiApiKeyInput').value.trim());
        showToast("Configuración guardada. Recargando...");
        setTimeout(() => location.reload(), 1500);
    }
    
    function openVideoPlayerModal(item) {
        const videoId = getYouTubeID(item.action);
        if (!videoId) return;
        const modal = document.getElementById('videoPlayerModal');
        modal.innerHTML = `
            <div class="w-full max-w-4xl p-4 flex flex-col gap-4 relative">
                 <button onclick="window.app.closeVideoPlayerModal()" class="absolute -top-2 -right-2 bg-gray-800 text-white rounded-full w-8 h-8 z-10">&times;</button>
                 <div class="w-full aspect-video">
                    <iframe class="w-full h-full rounded-lg" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                 </div>
            </div>`;
        modal.classList.remove('hidden');
    }

    function closeVideoPlayerModal() {
        const modal = document.getElementById('videoPlayerModal');
        const iframe = modal.querySelector('iframe');
        if (iframe) iframe.src = '';
        modal.classList.add('hidden');
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.style.backgroundColor = type === 'error' ? '#ef4444' : 'var(--primary)';
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 3000);
    }


    // --- LÓGICA DE LA IA ---
    window.app = {
        openVideoAIPanel: (item) => {
            const modalContainer = document.getElementById('modal-container');
            const videoPromptsHtml = (data.videoPrompts || []).map(p => 
                `<button data-prompt-id="${p.id}" class="text-xs bg-secondary hover:bg-primary hover:text-white rounded-full py-1 px-3 transition-colors">${p.title}</button>`
            ).join('');
            
            modalContainer.innerHTML = `
            <div class="widget p-6 flex flex-col gap-4 w-full max-w-lg relative">
                <button onclick="document.getElementById('modal-container').classList.add('hidden')" class="absolute top-4 right-4 text-muted-foreground hover:text-white">&times;</button>
                <h3 class="font-bold text-lg">Analizar Video con IA</h3>
                <p class="text-sm text-muted-foreground">"${item.title}"</p>
                <div class="flex flex-wrap gap-2">${videoPromptsHtml}</div>
                <textarea id="ai-video-prompt" class="w-full h-24 mt-1 bg-secondary p-2 rounded-md focus:ring-2 focus:ring-primary focus:outline-none resize-none text-sm" placeholder="O escribe tu propia pregunta..."></textarea>
                <button id="ai-video-submit" class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-4 rounded-lg">Analizar ✨</button>
                <div id="ai-video-result-container" class="mt-2 hidden">
                    <label class="text-sm font-medium text-muted-foreground">Respuesta de la IA:</label>
                    <div id="ai-video-result" class="w-full h-36 mt-1 bg-background p-3 rounded-md text-sm overflow-y-auto"></div>
                </div>
            </div>`;
            modalContainer.classList.remove('hidden');

            modalContainer.querySelectorAll('[data-prompt-id]').forEach(button => {
                button.addEventListener('click', () => {
                    const promptId = button.dataset.promptId;
                    const selectedPrompt = (data.videoPrompts || []).find(p => p.id === promptId);
                    if (selectedPrompt) {
                        document.getElementById('ai-video-prompt').value = selectedPrompt.prompt;
                    }
                });
            });

            document.getElementById('ai-video-submit').onclick = () => {
                const userPrompt = document.getElementById('ai-video-prompt').value;
                if (userPrompt) {
                    generateAIResponseForVideo(item, userPrompt, document.getElementById('ai-video-submit'));
                } else {
                    showToast("Por favor, selecciona o escribe un prompt.", "error");
                }
            };
        },
        openVideoPlayerModal,
        closeVideoPlayerModal
    };

    async function generateAIResponseForVideo(item, userPrompt, triggerButton) {
        const resultContainer = document.getElementById('ai-video-result-container');
        const resultDiv = document.getElementById('ai-video-result');
        
        const HELPER_URL = 'https://botonera-helperapp.vercel.app/api/transcript';

        triggerButton.disabled = true;
        triggerButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Obteniendo transcripción...';
        resultContainer.classList.remove('hidden');
        resultDiv.innerHTML = '<p class="text-muted-foreground">Contactando al ayudante para leer el video...</p>';

        let transcriptText = '';

        try {
            const videoId = getYouTubeID(item.action);
            if (!videoId) throw new Error("No se pudo obtener el ID del video de la URL.");
            const response = await fetch(HELPER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ videoUrl: item.action })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Error desconocido del ayudante.');
            transcriptText = data.transcript.map(t => t.text).join(' ');
        } catch (error) {
            resultDiv.innerHTML = `<p class="text-red-500"><strong>Error del Ayudante:</strong> ${error.message}</p>`;
            triggerButton.disabled = false;
            triggerButton.innerHTML = 'Reintentar Análisis ✨';
            return;
        }

        triggerButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Analizando con IA...';
        resultDiv.innerHTML = '<p class="text-muted-foreground">Transcripción obtenida. Enviando a Gemini...</p>';
        
        const finalPrompt = `Eres un asistente experto. Te proporciono la transcripción completa de un video de YouTube. Basado en este contenido, responde a la siguiente petición del usuario de forma útil y completa.\n\n--- TRANSCRIPCIÓN ---\n${transcriptText}\n------------------\n\nPetición: "${userPrompt}"`;
        
        const aiResult = await callGeminiAPI(finalPrompt);

        if (aiResult) {
            resultDiv.innerHTML = simpleMarkdownToHtml(aiResult);
        } else {
            resultDiv.innerHTML = `<p class="text-red-500"><strong>Error:</strong> Hubo un problema al generar la respuesta de Gemini.</p>`;
        }
        triggerButton.disabled = false;
        triggerButton.innerHTML = 'Analizar ✨';
    }

    async function callGeminiAPI(prompt) {
        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) {
            showToast("Configura tu API Key de Gemini en los ajustes.", 'error');
            return null;
        }
        
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: prompt }] }] };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || `Error HTTP: ${response.status}`);
            }
            const responseData = await response.json();
            return responseData.candidates[0].content.parts[0].text;
        } catch (error) {
            console.error("Error llamando a la API de Gemini:", error);
            showToast(`Error de IA: ${error.message}`, 'error');
            return null;
        }
    }

    function simpleMarkdownToHtml(text) {
        return text.replace(/\n/g, '<br>');
    }

    // --- INICIALIZACIÓN ---
    loadData();
});
</script>
