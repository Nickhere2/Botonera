<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Centro de Accesos</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss @2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ @fortawesome/fontawesome-free@6.4.0/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com "/>
  <link rel="preconnect" href="https://fonts.gstatic.com " crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* --- TEMAS DE COLORES --- */
    :root { --theme-color: #0d9488; --theme-color-hover: #0f766e; }
    body.theme-blue { --theme-color: #2563eb; --theme-color-hover: #1d4ed8; }
    body.theme-indigo { --theme-color: #4f46e5; --theme-color-hover: #4338ca; }
    body.theme-rose { --theme-color: #e11d48; --theme-color-hover: #be123c; }

    /* --- ESTILOS GENERALES Y MODO OSCURO --- */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      transition: background-color .3s, color .3s;
    }
    body.dark {
      background-color: #121212;
      color: #ddd;
    }
    body.dark .card,
    body.dark .bg-white {
      background-color: #1e1e1e;
      color: #ddd;
      border-color: rgba(255, 255, 255, 0.1);
    }
    body.dark input,
    body.dark select,
    body.dark textarea {
      background-color: #2a2a2a;
      color: #ddd;
      border-color: #444;
    }
    body.dark .filter-btn {
      background-color: #3a3a3a;
      color: #ddd;
    }
    body.dark .filter-btn.active {
      background-color: var(--theme-color);
      color: #fff;
    }
    body.dark #editPanel,
    body.dark .modal-content {
      background-color: rgba(30, 30, 30, .97);
      backdrop-filter: blur(4px);
    }
    body.dark #searchModal,
    body.dark #tagSearchModal,
    body.dark #noteModal,
    body.dark #taskModal {
      background-color: rgba(0, 0, 0, .7);
    }
    body.dark .sticky-header {
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    body.dark .category-title {
      color: #e5e7eb;
    }
    body.dark .nav-btn {
      color: #9ca3af;
    }
    body.dark .nav-btn.active {
      color: var(--theme-color);
    }
    body.dark .nav-btn:not(.active):hover {
      background-color: #2a2a2a;
    }

    /* --- CABECERA FIJA Y NAVEGACIÓN --- */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 999;
      background-color: rgba(240, 242, 245, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #ddd;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    main {
      padding-top: 1rem;
    }
    .nav-btn {
      transition: all .2s ease;
      position: relative;
      color: #4b5563;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
    }
    .nav-btn.active {
      color: var(--theme-color);
    }
    .nav-btn:not(.active):hover {
      transform: translateY(-2px);
      background-color: #fff;
    }
    .nav-btn:after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--theme-color);
      transform: scaleX(0);
      transition: transform .2s ease;
    }
    .nav-btn.active:after {
      transform: scaleX(1);
    }

    /* --- FILTROS Y TARJETAS --- */
    .filter-btn {
      transition: all .2s ease;
      border-radius: 9999px;
      padding: 0.25rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .filter-btn.active {
      background-color: var(--theme-color);
      color: white;
      border-color: var(--theme-color);
    }
    .filter-btn:not(.active):hover {
      background-color: #d1d5db;
    }
    .search-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      transition: all .3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, .05);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid #e5e7eb;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px rgba(0, 0, 0, .07);
    }
    .category-title-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.5rem;
    }
    body.dark .category-title-container {
      border-color: rgba(255, 255, 255, 0.1);
    }
    .category-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1f2937;
    }

    /* --- PANEL DE EDICIÓN AMIGABLE --- */
    #editPanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      overflow-y: auto;
      background-color: rgba(0, 0, 0, 0.5);
    }
    #editPanel .container {
      background-color: white;
      margin: 2rem auto;
      border-radius: 12px;
      padding: 2rem;
      max-width: 800px;
    }
    #editForm label {
      font-weight: bold;
      margin-bottom: 0.25rem;
    }
    #editForm input[type="text"],
    #editForm textarea,
    #editForm select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    #editForm textarea {
      resize: vertical;
      min-height: 100px;
    }
    #saveItemButton {
      background-color: var(--theme-color);
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #saveItemButton:hover {
      background-color: var(--theme-color-hover);
    }
  </style>
</head>
<body class="min-h-screen dark">
  <!-- PANEL DE EDICIÓN GENERAL -->
  <div id="editPanel" class="hidden">
    <div class="container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-6">
        <h2 id="editPanelTitle" class="text-2xl font-bold">Agregar Nuevo Elemento</h2>
        <button id="closeEditButton" class="bg-gray-200 hover:bg-gray-300 p-2 rounded-full">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <form id="editForm">
          <input type="hidden" id="editItemId" />
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium mb-1">Título</label>
              <input type="text" id="newTitle" class="w-full px-3 py-2 border border-gray-300 rounded-md" required />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Acción (URL o Contenido)</label>
              <textarea id="newAction" class="w-full px-3 py-2 border border-gray-300 rounded-md" rows="3" required></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Tipo</label>
              <select id="newType" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                <option value="">-- Seleccionar tipo --</option>
                <option value="Buscador">Buscador</option>
                <option value="Link">Link</option>
                <option value="Promp">Prompt</option>
                <option value="Nota">Nota</option>
                <option value="Tarea">Tarea</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Categoría</label>
              <select id="categorySelect" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                <option value="">-- Cargando categorías... --</option>
              </select>
              <input type="text" id="newCategoryInput" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md mt-2" placeholder="Nombre de la nueva categoría" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-1">Etiquetas (separadas por comas)</label>
              <input type="text" id="newTags" list="tag-suggestions" placeholder="Ej: trabajo, personal, urgente" class="w-full px-3 py-2 border border-gray-300 rounded-md" />
              <datalist id="tag-suggestions"></datalist>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-1">Icono (Opcional, clase Font Awesome)</label>
              <input type="text" id="newIcon" placeholder="Ej: fas fa-rocket. Dejar en blanco para automático" class="w-full px-3 py-2 border border-gray-300 rounded-md" />
            </div>
          </div>
          <button id="saveItemButton" type="submit" class="main-action-btn text-white px-4 py-2 rounded-md">
            <i class="fas fa-save mr-2"></i>Guardar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Simular carga de datos y configuración inicial
    const data = [
      { id: 1, title: "Google", action: " https://www.google.com/search?q={search_term}", type: "Buscador", category: "General", icon: "fas fa-search" },
      { id: 2, title: "GitHub", action: " https://github.com/ ", type: "Link", category: "Desarrollo", icon: "fab fa-github" },
      { id: 3, title: "Prompt Ejemplo", action: "Este es un prompt de ejemplo.", type: "Promp", category: "IA", icon: "fas fa-brain" },
      { id: 4, title: "Mi Nota", action: "<div>Contenido de una nota.</div>", type: "Nota", category: "Personal", icon: "fas fa-sticky-note" },
      { id: 5, title: "Tareas Diarias", action: [{ text: "Comprar comida", status: "todo" }, { text: "Enviar correo", status: "done" }], type: "Tarea", category: "Trabajo", icon: "fas fa-tasks" }
    ];

    document.getElementById("editForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Datos guardados exitosamente.");
      document.getElementById("editPanel").classList.add("hidden");
    });

    document.getElementById("closeEditButton").addEventListener("click", () => {
      document.getElementById("editPanel").classList.add("hidden");
    });

    function openEditPanel() {
      document.getElementById("editPanel").classList.remove("hidden");
    }

    function populateCategorySuggestions() {
      const categorySelect = document.getElementById("categorySelect");
      const categories = [...new Set(data.map(item => item.category))];
      categorySelect.innerHTML = "";
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
      const addNewOption = document.createElement("option");
      addNewOption.value = "__add_new__";
      addNewOption.textContent = "-- Añadir nueva categoría --";
      categorySelect.appendChild(addNewOption);
    }

    document.getElementById("categorySelect").addEventListener("change", function(event) {
      if (event.target.value === "__add_new__") {
        document.getElementById("newCategoryInput").classList.remove("hidden");
      } else {
        document.getElementById("newCategoryInput").classList.add("hidden");
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      populateCategorySuggestions();
    });
  </script>
</body>
</html>
