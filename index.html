<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Accesos v44 - Inicio Refinado</title>
    <!-- Logo del Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        /* --- NUEVO DISEÑO MODERNO Y LIMPIO --- */
        :root {
            --background: #f4f4f5; --foreground: #18181b; --card-background: #ffffff;
            --primary: #6d28d9; --primary-foreground: #ffffff; --primary-hover: #5b21b6;
            --secondary: #e4e4e7; --secondary-foreground: #18181b; --muted: #f4f4f5;
            --muted-foreground: #71717a; --accent: #f5f3ff; --accent-foreground: #4c1d95;
            --border: #e4e4e7; --ring: #6d28d9; --radius: 0.75rem;
            --note-bg: #fefce8; --task-bg: #eff6ff; --prompt-bg: #f0fdf4;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        .dark {
            --background: #09090b; --foreground: #fafafa; --card-background: #18181b;
            --primary: #7c3aed; --primary-hover: #8b5cf6; --secondary: #27272a;
            --secondary-foreground: #fafafa; --muted: #27272a; --muted-foreground: #a1a1aa;
            --accent: #27272a; --accent-foreground: #a78bfa; --border: #27272a;
            --ring: #7c3aed; --note-bg: #3f3f17; --task-bg: #1e293b; --prompt-bg: #162a1a;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--foreground); }

        /* --- LAYOUT Y ANIMACIÓN SIDEBAR MEJORADA --- */
        .sidebar { background-color: var(--sidebar-background); border-right: 1px solid var(--border); width: 280px; transition: width 0.3s ease-in-out, transform 0.3s ease-in-out; }
        .sidebar.is-collapsed { width: 80px; }
        .sidebar .sidebar-header .font-bold, .sidebar .nav-link span, .sidebar .sidebar-footer .nav-link-text { transition: opacity 0.2s ease, visibility 0.2s ease; opacity: 1; visibility: visible; }
        .sidebar.is-collapsed .sidebar-header .font-bold, .sidebar.is-collapsed .nav-link span, .sidebar.is-collapsed .sidebar-footer .nav-link-text { opacity: 0; visibility: hidden; pointer-events: none; }
        .sidebar.is-collapsed .sidebar-header, .sidebar.is-collapsed #agenda-widget .agenda-header { justify-content: center; }
        .sidebar.is-collapsed .nav-link, .sidebar.is-collapsed .sidebar-footer a { justify-content: center; }
        .sidebar.is-collapsed .sidebar-footer { align-items: center; }
        main { transition: margin-left 0.3s ease-in-out; }

        /* --- COMPONENTES --- */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .list-view { display: flex; flex-direction: column; gap: 0.75rem; }
        .table-view { display: flex; flex-wrap: wrap; gap: 1rem; }
        .card, .list-item, .table-item { background: var(--card-background); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); transition: all 0.2s ease-in-out; position: relative; }
        .card:hover, .list-item:hover, .table-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .card.is-favorite, .list-item.is-favorite, .table-item.is-favorite { box-shadow: 0 0 0 2px var(--primary); }
        .card.is-selected, .list-item.is-selected, .table-item.is-selected { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--ring), var(--shadow-lg); border-color: var(--ring); }
        .card { display: flex; flex-direction: column; height: 250px; overflow: hidden; background-size: cover; background-position: center; justify-content: flex-end; color: white; cursor: pointer; }
        .list-item, .fav-item { display: flex; align-items: center; padding: 0.75rem; gap: 1rem; cursor: pointer; }
        .table-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 120px; height: 120px; padding: 0.5rem; cursor: pointer; }
        .card-overlay { padding: 1rem; width: 100%; position: relative; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%); }
        .card-bg-preview { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.3s ease; }
        .card:hover .card-bg-preview { transform: scale(1.05); }
        .note-card, .task-card, .prompt-card { justify-content: flex-start; height: 250px; color: var(--card-foreground); padding: 1.25rem; }
        .note-card { background: var(--note-bg); } .task-card { background: var(--task-bg); } .prompt-card { background: var(--prompt-bg); }
        .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius); font-weight: 600; transition: all 0.2s; padding: 0.5rem 1rem; border: 1px solid transparent; cursor: pointer; }
        .btn-primary { background-color: var(--primary); color: var(--primary-foreground); border-color: var(--primary); } .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); } .btn-secondary:hover { background-color: var(--accent); }
        .btn-ghost { background-color: transparent; color: var(--muted-foreground); } .btn-ghost:hover { background-color: var(--secondary); color: var(--secondary-foreground); }
        .input-base { background: var(--card-background); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 0.75rem; width: 100%; transition: all 0.2s; color: var(--foreground); }
        .dark .input-base { background: #27272a; } .input-base:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
        .nav-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--radius); font-weight: 500; color: var(--muted-foreground); transition: background-color 0.2s, color 0.2s; }
        .nav-link:hover { background-color: var(--muted); color: var(--foreground); } .nav-link.active { background-color: var(--accent); color: var(--accent-foreground); font-weight: 600; }
        .card-actions, .list-item-actions, .table-item-actions { opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .card:hover .card-actions, .list-item:hover .list-item-actions, .table-item:hover .table-item-actions { opacity: 1; }
        .drag-handle { cursor: move; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .card:hover .drag-handle, .list-item:hover .drag-handle, .table-item:hover .drag-handle { opacity: 1; }
        .category-drag-handle, .fav-item { cursor: move; }
        .modal-overlay { background-color: rgba(9, 9, 11, 0.8); backdrop-filter: blur(4px); }
        .modal-container { background-color: var(--card-background); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
        #global-view-switcher button.active { background-color: var(--accent-foreground); color: var(--accent); }
        kbd { background-color: var(--secondary); border-radius: 4px; border: 1px solid var(--border); color: var(--secondary-foreground); display: inline-block; font-family: monospace; font-size: .85em; font-weight: 700; line-height: 1; padding: 2px 6px; }
        .dark kbd { background-color: #3f3f46; border-color: #52525b; }
        
        /* ESTILOS WIDGETS Y DISEÑOS INICIO */
        .widget { background-color: var(--card-background); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
        .event-item .actions { opacity: 0; transition: opacity 0.2s ease; }
        .event-item:hover .actions { opacity: 1; }
        #scratchpad-textarea { background-color: var(--secondary); color: var(--foreground); }
        .dark #scratchpad-textarea { background-color: #27272a; color: var(--foreground); border-color: #3f3f46; }
        .dark #scratchpad-textarea::placeholder { color: var(--muted-foreground); }
    </style>
</head>
<body class="dark"> <!-- Inicia en modo oscuro por defecto -->

    <div class="main-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-40 p-4 flex-shrink-0 flex flex-col transform -translate-x-full lg:translate-x-0">
            <!-- Sidebar Header -->
            <div class="sidebar-header flex items-center justify-between pb-4 px-2">
                <img src="https://raw.githubusercontent.com/Nickhere2/Botonera/main/logo.png" alt="Logo" class="w-14 h-14">
                <span class="font-bold text-lg">Centro de Accesos</span>
                <button id="sidebar-toggle" class="btn btn-ghost !p-2 hidden lg:inline-flex" title="Colapsar barra lateral">
                     <i class="fas fa-angle-double-left"></i>
                </button>
            </div>
            
            <!-- Main Navigation -->
            <nav id="main-nav" class="flex-grow space-y-2 px-2">
                <a href="#" data-section="inicio" class="nav-link active"><i class="fas fa-home w-5 text-center"></i><span>Inicio</span></a>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer mt-auto flex flex-col gap-2 px-2 pt-4 border-t border-border">

            <div id="section-inicio" class="section"></div>
            <div id="section-buscadores" class="section hidden"></div>
            <div id="section-links" class="section hidden"></div>
            <div id="section-prompts" class="section hidden"></div>
            <div id="section-notes-tasks" class="section hidden"></div>
        </main>
    </div>
    
    <!-- MODALS & OVERLAYS -->
    <div id="editPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="eventPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="settingsHelpPanel" class="hidden fixed inset-0 z-[1000] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="toast" class="hidden fixed bottom-5 right-5 p-4 rounded-lg font-bold z-[2000] shadow-lg" style="background-color: var(--primary); color: var(--primary-foreground);"></div>
    <div id="confirmModal" class="hidden fixed inset-0 z-[1100] p-4 flex items-center justify-center modal-overlay"></div>
    <div id="preview-modal" class="hidden fixed z-[1300] w-80 h-60 p-1 bg-card-background rounded-lg shadow-lg pointer-events-none transition-opacity duration-200 opacity-0">
        <div id="preview-modal-content" class="relative w-full h-full bg-cover bg-center rounded-md border border-border">
             <div id="preview-modal-tags"></div>
        </div>
    </div>

<script>
// --- STATE & CONFIG ---
const FILENAME_IN_GIST = 'Botones.json';
let data = { items: [], categories: {}, categoryOrders: {}, favoriteOrders: {}, events: [] };
let viewModes = {};
let homeDesign = localStorage.getItem('homeDesign') || 'clasico';
const themes = ['dark', 'light'];
let currentTheme = localStorage.getItem('theme') || 'dark';
let previewTimeout = null;
let selectedSearchEngineId = null;
const typeMap = { 'inicio': 'Inicio', 'buscadores': 'Buscador', 'links': 'Link', 'prompts': 'Promp', 'notes-tasks': ['Nota', 'Tarea'] };


// --- MOCK DATA (Fallback) ---
const mockData = {
    items: [
        { id: 1, type: 'Buscador', title: 'Google', action: 'https://www.google.com/search?q={search_term}', category: 'General', icon: 'fab fa-google', tags: ['motor', 'busqueda'], isFavorite: true, shortcut: 'g' },
        { id: 2, type: 'Buscador', title: 'YouTube', action: 'https://www.youtube.com/results?search_query={search_term}', category: 'Video', icon: 'fab fa-youtube', tags: ['videos', 'tutoriales'], isFavorite: false, shortcut: 'y' },
        { id: 3, type: 'Link', title: 'GitHub', action: 'https://github.com', category: 'Desarrollo', icon: 'fab fa-github', tags: ['codigo', 'proyectos'], isFavorite: true },
        { id: 4, type: 'Promp', title: 'Generar Idea', action: 'Crea una lista de 5 ideas para un video de YouTube sobre IA.', category: 'Creatividad', icon: 'fas fa-lightbulb', tags: ['ideas'], isFavorite: false },
        { id: 5, type: 'Nota', title: 'Reunión Lunes', action: '<div>Discutir presupuesto Q3.</div><div>Revisar métricas.</div><div>Asignar tareas.</div>', category: 'Trabajo', icon: 'fas fa-sticky-note', tags: ['reunion'], isFavorite: false },
        { id: 6, type: 'Tarea', title: 'Proyecto Web', action: [{text: 'Diseñar mockup', status: true}, {text: 'Desarrollar landing', status: false}], category: 'Proyectos', icon: 'fas fa-tasks', tags: ['web'], isFavorite: true }
    ],
    categories: { 'Video': {}, 'Desarrollo': {} },
    categoryOrders: { buscadores: ["General", "Video"], links: ["Desarrollo"], prompts: ["Creatividad"], "notes-tasks": ["Trabajo", "Proyectos"] },
    favoriteOrders: {
        buscadores: [1],
        links: [3],
        "notes-tasks": [6]
    },
    events: [
        { id: 1, title: 'Cumpleaños de Ana', date: '2000-09-15', type: 'birthday', note: 'Comprar regalo.', reminderDays: 7 },
        { id: 2, title: 'Entrega Proyecto Final', date: '2025-09-22', type: 'reminder', note: '', reminderDays: 3 },
        { id: 3, title: 'Llamar a Juan', date: '2025-09-22', type: 'reminder', note: '', reminderDays: 1 }
    ]
};


// --- DATA HANDLING ---
function ensureAllIcons() {
    if (!data.items) return;
    data.items.forEach(item => {
        if ((item.type === 'Link' || item.type === 'Buscador') && !item.icon) {
            try {
                const url = new URL(item.action);
                item.icon = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
            } catch (e) {
                console.error(`URL inválida para auto-generar favicon para "${item.title}":`, item.action);
            }
        }
    });
}

async function loadData() {
    let gistId = localStorage.getItem('gist_id');
    const localData = localStorage.getItem('appData');
    viewModes = JSON.parse(localStorage.getItem('viewModes')) || {};

    const processLoadedData = (loadedData) => {
        const defaults = { items: [], categories: {}, categoryOrders: {}, favoriteOrders: {}, events: [] };
        data = { ...defaults, ...loadedData };
        data.items = (data.items || []).map(i => ({...i, isFavorite: i.isFavorite || false}));

        // Generar atajos para buscadores si no existen
        const searchEngines = data.items.filter(item => item.type === 'Buscador');
        const usedShortcuts = new Set(searchEngines.map(e => e.shortcut).filter(Boolean));
        searchEngines.forEach(engine => {
            if (!engine.shortcut) {
                let potentialShortcut = engine.title.charAt(0).toLowerCase();
                let counter = 1;
                while (usedShortcuts.has(potentialShortcut)) {
                    if (counter < engine.title.length) {
                        potentialShortcut = engine.title.charAt(counter).toLowerCase();
                        counter++;
                    } else {
                        potentialShortcut = `${engine.title.charAt(0).toLowerCase()}${counter - engine.title.length + 1}`;
                    }
                }
                engine.shortcut = potentialShortcut;
                usedShortcuts.add(potentialShortcut);
            }
        });

        if (data.favoriteOrder && !data.favoriteOrders) {
            data.favoriteOrders = {};
            data.favoriteOrder.forEach(id => {
                const item = data.items.find(i => i.id === id);
                if (item) {
                    const sectionName = Object.keys(typeMap).find(key => {
                        const type = typeMap[key];
                        return Array.isArray(type) ? type.includes(item.type) : type === item.type;
                    });
                    if (sectionName) {
                        if (!data.favoriteOrders[sectionName]) {
                            data.favoriteOrders[sectionName] = [];
                        }
                        data.favoriteOrders[sectionName].push(id);
                    }
                }
            });
            delete data.favoriteOrder;
        }
        if (!data.favoriteOrders) {
            data.favoriteOrders = {};
        }
    };

    if (!gistId && localData) {
        processLoadedData(JSON.parse(localData));
        showToast("Datos cargados desde guardado local.");
        updateSyncStatus('local');
        ensureAllIcons();
        initializeUI();
        return;
    }

    if (!gistId) {
        processLoadedData(JSON.parse(JSON.stringify(mockData)));
        ensureAllIcons();
        initializeUI();
        return;
    }
    
    updateSyncStatus('loading');
    const token = localStorage.getItem('github_pat');
    const headers = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) { headers['Authorization'] = `token ${token}`; }

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const gistData = await response.json();
        const fileContent = gistData.files[FILENAME_IN_GIST]?.content;
        if (!fileContent) {
            showToast("Archivo no encontrado en Gist. Usando datos de ejemplo.");
            processLoadedData(mockData);
        } else {
            processLoadedData(JSON.parse(fileContent));
            showToast("Datos cargados desde Gist.");
        }
        updateSyncStatus('synced');
    } catch (error) {
        console.error("Fallo al cargar datos:", error);
        showToast(`Error al cargar: ${error.message}.`, 'error');
        processLoadedData(mockData);
    }
    ensureAllIcons();
    initializeUI();
}

async function saveData() {
    const gistId = localStorage.getItem('gist_id');
    const dataString = JSON.stringify(data, null, 2);

    localStorage.setItem('appData', dataString);

    if (!gistId) {
        updateSyncStatus('local');
        return;
    }
    
    let token = localStorage.getItem('github_pat');
    if (!token) {
        showToast("Falta token de GitHub. Guardado localmente.", 'error');
        updateSyncStatus('error', 'Falta token');
        return;
    }
    
    updateSyncStatus('saving');

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify({
                files: {
                    [FILENAME_IN_GIST]: {
                        content: dataString
                    }
                }
            })
        });
        if (!response.ok) {
             if(response.status === 401 || response.status === 404) {
                 showToast("Token inválido. Revisa la configuración.", 'error');
                 updateSyncStatus('error', 'Token inválido');
             }
             throw new Error(`Error al guardar: ${response.status}`)
        };
        showToast("Cambios guardados en Gist.");
        updateSyncStatus('synced');
    } catch (error) {
        console.error("Fallo al guardar en Gist:", error);
        showToast("Error al guardar en Gist.", 'error');
        updateSyncStatus('error', 'Error al guardar');
    }
}

// --- UI INITIALIZATION & EVENT LISTENERS ---
document.addEventListener("DOMContentLoaded", () => {
    loadData();
    setupEventListeners();
});

function debounce(func, delay) {
    let timeout;
    return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
    };
}

function setupEventListeners() {
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.querySelector('main');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
        sidebar.classList.toggle('is-collapsed');
        if (window.innerWidth >= 1024) {
           mainContent.style.marginLeft = sidebar.classList.contains('is-collapsed') ? '80px' : '280px';
        }
    });

    const overlay = document.getElementById('sidebar-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const toggleMobileSidebar = () => {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    };
    menuToggle.addEventListener('click', toggleMobileSidebar);
    overlay.addEventListener('click', toggleMobileSidebar);

    document.getElementById('main-nav').addEventListener('click', (e) => {
        const navLink = e.target.closest('.nav-link');
        if (navLink) {
            e.preventDefault();
            switchTab(navLink.dataset.section);
            if (window.innerWidth < 1024) toggleMobileSidebar();
        }
    });
    
    document.getElementById('addNewButton').addEventListener('click', () => openEditPanel());
    document.getElementById('fab-theme').addEventListener('click', changeTheme);
    document.getElementById('open-settings-help').addEventListener('click', openSettingsHelpModal);
    
    document.getElementById('global-view-switcher').addEventListener('click', (e) => {
        const button = e.target.closest('button');
        if(button && button.dataset.view) {
            const activeSection = document.querySelector('#main-nav .active')?.dataset.section;
            if (activeSection) {
                viewModes[activeSection] = button.dataset.view;
                localStorage.setItem('viewModes', JSON.stringify(viewModes));
            }
            document.querySelectorAll('#global-view-switcher button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            if (activeSection === 'inicio') {
                renderInicioSection();
            } else {
                applyGlobalFilter();
            }
        }
    });
    
    // Listener para cerrar el dropdown de búsqueda
    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('search-engine-dropdown');
        const button = document.getElementById('search-engine-selector-button');
        if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && button && !button.contains(e.target)) {
            closeSearchEngineDropdown();
        }
    });

    // Listener para atajos de teclado globales
    document.addEventListener('keydown', handleGlobalShortcuts);
}

function initializeUI() {
    applyTheme(currentTheme);
    if (window.innerWidth >= 1024) {
        document.querySelector('main').style.marginLeft = '280px';
    }
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const shortcutEl = document.getElementById('search-shortcut');
    if (shortcutEl) {
        shortcutEl.innerHTML = `<kbd>${isMac ? '⌘' : 'Ctrl'}</kbd><kbd>B</kbd>`;
    }
    switchTab('inicio');
}

function refreshUI() {
    const activeSection = document.querySelector('#main-nav .active')?.dataset.section || 'inicio';
    if (activeSection === 'inicio') {
        renderInicioSection();
    } else {
        applyGlobalFilter();
    }
}

function switchTab(tabName) {
    document.querySelectorAll("#main-nav .nav-link").forEach(b => b.classList.remove("active"));
    const activeLink = document.querySelector(`#main-nav .nav-link[data-section="${tabName}"]`);
    activeLink.classList.add("active");
    
    document.getElementById('main-title').textContent = activeLink.querySelector('span').textContent.toUpperCase();

    document.querySelectorAll(".section").forEach(s => s.classList.add("hidden"));
    document.getElementById(`section-${tabName}`).classList.remove("hidden");
    
    const viewSwitcher = document.getElementById('global-view-switcher');
    const addNewBtn = document.getElementById('addNewButton');

    const currentView = viewModes[tabName] || (tabName === 'inicio' ? 'list' : 'grid');
    document.querySelectorAll('#global-view-switcher button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
    
    if (tabName === 'inicio') {
        viewSwitcher.classList.remove('hidden');
        addNewBtn.classList.add('hidden');
        renderInicioSection();
    } else {
        viewSwitcher.classList.remove('hidden');
        addNewBtn.classList.remove('hidden');
        applyGlobalFilter();
    }
}

// --- RENDER FUNCTIONS ---
function renderSection(sectionName, itemsToRender, searchTerm = '') {
    const container = document.getElementById(`section-${sectionName}`);
    container.innerHTML = '';
    const currentView = viewModes[sectionName] || 'grid';

    if (sectionName === 'notes-tasks') {
        renderNotesAndTasksSection(container, itemsToRender, searchTerm, currentView);
        return;
    }

    if (itemsToRender.length === 0 && searchTerm === '') {
        renderEmptyState(container, sectionName);
        return;
    }
    
    renderFavoritesBar(container);

    if (itemsToRender.length === 0 && searchTerm !== '') {
        return;
    }

    const categorized = itemsToRender.reduce((acc, item) => {
        const category = item.category || 'Sin Categoría';
        if (!acc[category]) acc[category] = [];
        acc[category].push(item);
        return acc;
    }, {});

    const sectionOrders = data.categoryOrders?.[sectionName] || [];
    const sortedCategories = [...new Set([...sectionOrders, ...Object.keys(categorized).filter(c => !sectionOrders.includes(c))])];
    
    const categoryContainerWrapper = document.createElement('div');
    container.appendChild(categoryContainerWrapper);

    sortedCategories.forEach(categoryName => {
        if (categorized[categoryName] && categorized[categoryName].length > 0) {
            const catWrapper = document.createElement('div');
            catWrapper.className = 'mb-12 category-wrapper';
            catWrapper.dataset.categoryName = categoryName;
            
            let editButtonHTML = '';
            if (categoryName !== 'Sin Categoría') {
                editButtonHTML = `<button onclick="openCategoryEditModal(event, '${categoryName}')" class="btn btn-ghost !p-2 text-muted-foreground hover:text-foreground" title="Editar categoría"><i class="fas fa-pencil-alt text-sm"></i></button>`;
            }
            catWrapper.innerHTML = `<div class="flex items-center gap-2 mb-4"><h2 class="text-xl font-bold text-muted-foreground category-drag-handle">${categoryName}</h2>${editButtonHTML}</div>`;

            const contentContainer = document.createElement('div');
            
            const viewClasses = { grid: 'card-grid', list: 'list-view', table: 'table-view' };
            contentContainer.className = `item-container ${viewClasses[currentView] || 'card-grid'}`;
            
            categorized[categoryName].forEach(item => {
                let element;
                if (currentView === 'grid') {
                     if (item.type === 'Nota') element = createNoteCard(item, searchTerm);
                     else if (item.type === 'Tarea') element = createTaskCard(item, searchTerm);
                     else if (item.type === 'Promp') element = createPromptCard(item, searchTerm);
                     else element = createCard(item, searchTerm);
                } else if (currentView === 'list') {
                    element = createListItem(item, searchTerm);
                } else if (currentView === 'table') {
                    element = createTableItem(item, searchTerm);
                }
                
                if (element) {
                    contentContainer.appendChild(element);
                }
            });

            catWrapper.appendChild(contentContainer);
            categoryContainerWrapper.appendChild(catWrapper);

             new Sortable(contentContainer, {
                group: sectionName,
                animation: 150,
                handle: '.drag-handle',
                onEnd: (evt) => {
                    const movedItemId = parseInt(evt.item.dataset.id);
                    const toCategoryName = evt.to.closest('.category-wrapper').dataset.categoryName;
                    
                    const itemToUpdate = data.items.find(i => i.id === movedItemId);
                    if (itemToUpdate) {
                        itemToUpdate.category = toCategoryName;
                    }

                    const allDomItemIds = Array.from(document.querySelectorAll(`#section-${sectionName} .item-container > [data-id]`)).map(el => parseInt(el.dataset.id));
                    
                    const activeType = typeMap[sectionName];
                    const sectionItems = data.items.filter(item => Array.isArray(activeType) ? activeType.includes(item.type) : item.type === activeType);
                    const otherItems = data.items.filter(item => !sectionItems.find(i => i.id === item.id));

                    const sortedSectionItems = sectionItems.sort((a, b) => {
                        let indexA = allDomItemIds.indexOf(a.id);
                        let indexB = allDomItemIds.indexOf(b.id);
                        if (indexA === -1) indexA = Infinity;
                        if (indexB === -1) indexB = Infinity;
                        return indexA - indexB;
                    });
                    
                    data.items = [...otherItems, ...sortedSectionItems];

                    saveData();
                }
            });
        }
    });
    
    new Sortable(categoryContainerWrapper, {
        animation: 150,
        handle: '.category-drag-handle',
        onEnd: (evt) => {
            const newOrder = Array.from(evt.target.children).map(child => child.dataset.categoryName);
            if (!data.categoryOrders) data.categoryOrders = {};
            data.categoryOrders[sectionName] = newOrder;
            saveData();
        }
    });
}

// --- NUEVA SECCIÓN DE INICIO ---
function renderInicioSection() {
    const container = document.getElementById('section-inicio');
    container.innerHTML = ''; // Limpiar contenido

    // Renderizar diseño clásico (único diseño ahora)
    renderDisenoClasico(container);

    // Re-vincular eventos para la barra de búsqueda
    const activeSearchBar = container.querySelector(`#main-search-bar-container`);
    if(activeSearchBar) {
        activeSearchBar.querySelector('#main-search-button').addEventListener('click', performMainSearch);
        const mainSearchInput = activeSearchBar.querySelector('#main-search-input');
        mainSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performMainSearch();
        });
        mainSearchInput.addEventListener('input', handleSearchInputShortcut);
        activeSearchBar.querySelector('#search-engine-selector-button').addEventListener('click', toggleSearchEngineDropdown);
        const dropdownSearch = document.getElementById('dropdown-search-input');
        if(dropdownSearch) dropdownSearch.addEventListener('input', renderSearchEngineDropdown);
    }
    
    // Inicializar el selector de motor de búsqueda
    const searchEngines = data.items.filter(item => item.type === 'Buscador');
    const currentSelectionIsValid = searchEngines.some(e => e.id === selectedSearchEngineId);
    if (selectedSearchEngineId !== 'global' && (!selectedSearchEngineId || !currentSelectionIsValid)) {
        const defaultEngine = searchEngines.find(engine => engine.title.toLowerCase() === 'google') || searchEngines[0];
        if (defaultEngine) {
            selectSearchEngine(defaultEngine.id, false);
        } else {
            selectSearchEngine('global', false); // Fallback a búsqueda global si no hay motores
        }
    } else {
        // Asegurarse de que el placeholder esté actualizado
        selectSearchEngine(selectedSearchEngineId, false);
    }
}

function renderDisenoClasico(container) {
    container.innerHTML = getMainSearchBarHTML();
    
    const widgetsContainer = document.createElement('div');
    widgetsContainer.className = "grid grid-cols-1 md:grid-cols-3 gap-8 mb-12";
    container.appendChild(widgetsContainer);

    renderHomeAgendaWidget(widgetsContainer, 'md:col-span-1');
    renderHomeScratchpadWidget(widgetsContainer, 'md:col-span-2');

    const favoritesWrapper = document.createElement('div');
    favoritesWrapper.className = 'mt-12 space-y-8';
    let favoritesFound = false;
    const currentView = viewModes['inicio'] || 'list';

    Object.keys(data.categoryOrders).forEach(sectionName => {
        if (sectionName === 'buscadores') return;

        const orderedFavoritesIds = (data.favoriteOrders && data.favoriteOrders[sectionName]) ? data.favoriteOrders[sectionName] : [];
        const favoriteItems = orderedFavoritesIds.map(id => data.items.find(item => item.id === id && item.isFavorite)).filter(Boolean);

        if (favoriteItems.length > 0) {
            favoritesFound = true;
            const sectionWrapper = document.createElement('div');
            const sectionTitleText = document.querySelector(`#main-nav .nav-link[data-section="${sectionName}"] span`).textContent;
            sectionWrapper.innerHTML = `<h2 class="text-xl font-bold mb-4 text-muted-foreground">Favoritos de ${sectionTitleText}</h2>`;
            
            const itemsContainer = document.createElement('div');
            const viewClasses = { grid: 'card-grid', list: 'list-view', table: 'table-view' };
            itemsContainer.className = viewClasses[currentView] || 'list-view';

            favoriteItems.forEach(item => {
                let element;
                if (currentView === 'list') element = createListItem(item);
                else if (currentView === 'grid') {
                    if (item.type === 'Nota') element = createNoteCard(item);
                    else if (item.type === 'Tarea') element = createTaskCard(item);
                    else if (item.type === 'Promp') element = createPromptCard(item);
                    else element = createCard(item);
                } else element = createTableItem(item);
                
                if (element) itemsContainer.appendChild(element);
            });
            
            sectionWrapper.appendChild(itemsContainer);
            favoritesWrapper.appendChild(sectionWrapper);
        }
    });

    if (favoritesFound) {
        container.appendChild(favoritesWrapper);
    } else {
        const emptyState = document.createElement('div');
        emptyState.className = 'text-center py-16 px-6 mt-8 rounded-lg border-2 border-dashed border-border';
        emptyState.innerHTML = `<i class="fas fa-star text-4xl text-muted-foreground mb-4"></i><h3 class="text-xl font-semibold">Aún no tienes favoritos</h3><p class="text-muted-foreground mt-2">Haz clic en la estrella <i class="far fa-star text-yellow-400"></i> en cualquier elemento para agregarlo aquí.</p>`;
        container.appendChild(emptyState);
    }
}

function renderHomeAgendaWidget(container, gridClasses) {
    const widget = document.createElement('div');
    widget.className = `widget ${gridClasses} flex flex-col`;
    
    const upcomingEvents = getUpcomingEvents(30);
    
    let eventsHTML = upcomingEvents.length > 0
        ? upcomingEvents.map(event => {
            const noteIcon = event.note ? `<i class="fas fa-sticky-note text-gray-500 text-xs ml-1" title="${event.note}"></i>` : '';
            return `
            <div class="event-item flex items-center gap-2 text-sm py-1">
                <div class="flex-grow overflow-hidden">
                    <p class="font-medium truncate">${event.title} ${noteIcon}</p>
                    <p class="text-xs text-muted-foreground">${event.date.toLocaleDateString('es-ES', { timeZone: 'UTC', day: 'numeric', month: 'long' })}</p>
                </div>
                <div class="actions flex items-center">
                    <button onclick="openEventPanel(${event.id})" class="btn btn-ghost !p-1"><i class="fas fa-pencil-alt text-xs"></i></button>
                    <button onclick="deleteEvent(event, ${event.id})" class="btn btn-ghost !p-1"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
            </div>`;
        }).join('')
        : '<p class="text-sm text-muted-foreground">No hay eventos próximos.</p>';

    widget.innerHTML = `
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-lg">Agenda</h3>
            <button onclick="openEventPanel()" class="btn btn-ghost !p-2" title="Añadir evento"><i class="fas fa-plus"></i></button>
        </div>
        <div class="flex-grow overflow-y-auto max-h-48 space-y-2 pr-2">
            ${eventsHTML}
        </div>
    `;
    container.appendChild(widget);
}

function renderHomeScratchpadWidget(container, gridClasses) {
    const widget = document.createElement('div');
    widget.className = `widget ${gridClasses}`;
    widget.innerHTML = `
        <h3 class="font-bold mb-3 text-lg">Bloc de Notas Rápido</h3>
        <textarea id="scratchpad-textarea" class="w-full h-full min-h-[145px] p-2 bg-secondary/50 border border-border rounded-md focus:ring-2 focus:ring-primary focus:outline-none resize-none text-sm" placeholder="Apunta algo...">${localStorage.getItem('scratchpadContent') || ''}</textarea>
    `;
    widget.querySelector('textarea').addEventListener('input', debounce((e) => {
        localStorage.setItem('scratchpadContent', e.target.value);
    }, 500));
    container.appendChild(widget);
}

        <div class="flex relative w-full text-lg bg-card-background border border-border rounded-xl shadow-lg focus-within:ring-4 focus-within:ring-purple-500/20 transition-shadow">
            <div class="relative flex-shrink-0">
                <button id="search-engine-selector-button" class="flex items-center gap-2 h-full pl-5 pr-4 text-sm font-medium text-foreground bg-secondary/50 rounded-l-xl hover:bg-muted focus:outline-none border-r border-border" type="button">
                    <!-- JS will populate this -->
                </button>
                <div id="search-engine-dropdown" class="absolute top-full left-0 mt-2 w-72 border border-border bg-card-background rounded-lg shadow-lg z-[1001] hidden">
                    <div class="p-2 border-b border-border">
                        <input type="text" id="dropdown-search-input" placeholder="Buscar motor..." class="input-base w-full text-sm">
                    </div>
                    <div id="dropdown-options-container" class="max-h-60 overflow-y-auto p-1">

                    </div>

                <i class="fas fa-search text-lg"></i>
            </button>

}


function renderNotesAndTasksSection(container, itemsToRender, searchTerm = '', currentView) {
    if (itemsToRender.length === 0) {
        renderEmptyState(container, 'notes-tasks');
        return;
    }

    renderFavoritesBar(container);

    const notes = itemsToRender.filter(item => item.type === 'Nota');
    const tasks = itemsToRender.filter(item => item.type === 'Tarea');
    
    const viewClasses = { grid: 'card-grid', list: 'list-view', table: 'table-view' };
    const viewClass = viewClasses[currentView] || 'card-grid';

    if (notes.length > 0) {
        const notesWrapper = document.createElement('div');
        notesWrapper.className = 'mb-12';
        notesWrapper.innerHTML = `<h2 class="text-xl font-bold mb-4 text-muted-foreground">Notas</h2>`;
        const notesContainer = document.createElement('div');
        notesContainer.className = viewClass;
        notes.forEach(note => {
            let element = (currentView === 'grid') ? createNoteCard(note, searchTerm) : createListItem(note, searchTerm);
            if(element) notesContainer.appendChild(element);
        });
        notesWrapper.appendChild(notesContainer);
        container.appendChild(notesWrapper);
    }

    if (tasks.length > 0) {
        const tasksWrapper = document.createElement('div');
        tasksWrapper.className = 'mb-12';
        tasksWrapper.innerHTML = `<h2 class="text-xl font-bold mb-4 text-muted-foreground">Tareas</h2>`;
        const tasksContainer = document.createElement('div');
        tasksContainer.className = viewClass;
        tasks.forEach(task => {
            let element = (currentView === 'grid') ? createTaskCard(task, searchTerm) : createListItem(task, searchTerm);
            if(element) tasksContainer.appendChild(element);
        });
        tasksWrapper.appendChild(tasksContainer);
        container.appendChild(tasksWrapper);
    }
}

function renderFavoritesBar(container) {
    let bar = container.querySelector('.favorites-bar');
    if (bar) bar.remove();

    const activeNavBtn = document.querySelector('.nav-link.active');
    if (!activeNavBtn) return;
    const activeSectionName = activeNavBtn.dataset.section;
    
    const orderedFavoritesIds = (data.favoriteOrders && data.favoriteOrders[activeSectionName]) ? data.favoriteOrders[activeSectionName] : [];

    const orderedFavorites = orderedFavoritesIds
        .map(id => data.items.find(item => item.id === id && item.isFavorite))
        .filter(Boolean);


    if (orderedFavorites.length === 0) return;

    bar = document.createElement('div');
    bar.className = 'mb-8 favorites-bar';
    bar.innerHTML = `<h2 class="text-xl font-bold mb-4 text-muted-foreground">Favoritos</h2>`;
    const favContainer = document.createElement('div');
    favContainer.className = 'flex flex-wrap gap-4';
    
    orderedFavorites.forEach(item => {
        const favIcon = document.createElement('div');
        favIcon.className = 'fav-item flex items-center gap-2 p-2 pr-4 rounded-full bg-secondary hover:bg-accent transition';
        favIcon.dataset.id = item.id;
        favIcon.innerHTML = `
            <div class="w-8 h-8 bg-card-background rounded-full flex items-center justify-center">${getIconHtml(item.icon, 'text-lg')}</div>
            <span class="font-semibold text-sm pointer-events-none">${item.title}</span>
        `;
        favIcon.onclick = (e) => handleCardClick(item.id, e);
        favContainer.appendChild(favIcon);
    });

    bar.appendChild(favContainer);
    container.prepend(bar);

    new Sortable(favContainer, {
        animation: 150,
        onEnd: (evt) => {
            const newOrderOfIds = Array.from(evt.target.children).map(child => parseInt(child.dataset.id));
            if (data.favoriteOrders && data.favoriteOrders[activeSectionName]) {
                data.favoriteOrders[activeSectionName] = newOrderOfIds;
            }
            saveData();
        }
    });
}


function createCard(item, searchTerm = '') {
    const card = document.createElement("div");
    card.className = 'card fade-in';
    card.dataset.id = item.id;
    if (item.isFavorite) card.classList.add('is-favorite');
    if (item.id === selectedSearchEngineId) card.classList.add('is-selected');

    const previewUrl = (item.type === 'Link' || item.type === 'Buscador') 
        ? `https://s.wordpress.com/mshots/v1/${encodeURIComponent(item.action.split('?')[0])}?w=400`
        : '';

    card.innerHTML = `
        <div class="drag-handle absolute top-2 left-2 p-2 text-white/50 hover:text-white"><i class="fas fa-grip-vertical"></i></div>
        <div class="card-bg-preview" style="background-image: url('${previewUrl}')"></div>
        <div class="card-overlay">
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center flex-shrink-0">
                        ${getIconHtml(item.icon, 'text-2xl', true)}
                    </div>
                    <div class="overflow-hidden">
                        <h4 class="font-bold text-base uppercase truncate text-white" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">${item.title}</h4>
                        <p class="text-xs text-white/80 truncate">${item.category || ''}</p>
                    </div>
                </div>
                <div class="card-actions flex gap-1">
                     <button onclick="toggleFavorite(event, '${item.id}')" class="btn btn-ghost !p-2 !text-white/80 hover:!bg-white/20"><i class="${item.isFavorite ? 'fas' : 'far'} fa-star text-yellow-400"></i></button>
                     <button onclick="openEditPanel('${item.id}')" class="btn btn-ghost !p-2 !text-white/80 hover:!bg-white/20"><i class="fas fa-pencil-alt"></i></button>
                </div>
            </div>
        </div>
    `;
    card.addEventListener('click', (e) => handleCardClick(item.id, e));
    return card;
}

function createListItem(item, searchTerm = '') {
    const listItem = document.createElement("div");
    listItem.className = 'list-item';
    listItem.dataset.id = item.id;
    if (item.isFavorite) listItem.classList.add('is-favorite');
    if (item.id === selectedSearchEngineId) listItem.classList.add('is-selected');


    listItem.innerHTML = `
        <div class="drag-handle p-2 text-muted-foreground"><i class="fas fa-grip-vertical"></i></div>
        <div class="w-10 h-10 bg-secondary rounded-lg flex items-center justify-center flex-shrink-0">${getIconHtml(item.icon, 'text-xl')}</div>
        <div class="flex-grow overflow-hidden">
            <h4 class="font-bold truncate">${item.title}</h4>
            <p class="text-sm text-muted-foreground truncate">${item.type} / ${item.category || 'Sin Categoría'}</p>
        </div>
        <div class="list-item-actions flex items-center gap-2">
            <button onclick="toggleFavorite(event, '${item.id}')" class="btn btn-ghost !p-2"><i class="${item.isFavorite ? 'fas' : 'far'} fa-star text-yellow-400"></i></button>
            <button onclick="openEditPanel('${item.id}')" class="btn btn-ghost !p-2"><i class="fas fa-pencil-alt"></i></button>
        </div>
    `;
    listItem.addEventListener('click', (e) => handleCardClick(item.id, e));
    return listItem;
}

function createTableItem(item, searchTerm = '', isGlobalSearch = false) {
    const tableItem = document.createElement("div");
    tableItem.className = 'table-item';
    tableItem.dataset.id = item.id;
    if (item.isFavorite) tableItem.classList.add('is-favorite');
    if (item.id === selectedSearchEngineId) tableItem.classList.add('is-selected');

    const typeBadge = isGlobalSearch 
        ? `<span class="absolute bottom-1 right-1 bg-primary text-primary-foreground text-[10px] font-bold px-1.5 py-0.5 rounded-full">${item.type}</span>`
        : '';

    tableItem.innerHTML = `
        <div class="drag-handle absolute top-1 left-1 p-1 text-muted-foreground"><i class="fas fa-grip-vertical"></i></div>
        <div class="table-item-actions absolute top-1 right-1 flex">
            <button onclick="openEditPanel('${item.id}')" class="btn btn-ghost !p-1 !text-xs" title="Editar"><i class="fas fa-pencil-alt"></i></button>
            <button onclick="toggleFavorite(event, '${item.id}')" class="btn btn-ghost !p-1 !text-xs" title="Favorito"><i class="${item.isFavorite ? 'fas' : 'far'} fa-star text-yellow-400"></i></button>
        </div>
        <div class="w-16 h-16 mb-2 flex items-center justify-center">${getIconHtml(item.icon, 'text-4xl')}</div>
        <h4 class="font-semibold text-sm text-center truncate w-full">${item.title}</h4>
        ${typeBadge}
    `;
    tableItem.addEventListener('click', (e) => handleCardClick(item.id, e));
    
    tableItem.addEventListener('mouseenter', (e) => {
        clearTimeout(previewTimeout);
        previewTimeout = setTimeout(() => {
            showPreviewModal(item, e);
        }, 500);
    });

// --- ACTIONS & EVENT HANDLERS ---
function handleCardClick(id, event) {
    if (event.target.closest('button, input, .drag-handle')) return; 
    const item = data.items.find(i => String(i.id) === String(id));
    if (!item) return;

    if (item.type === "Link") {
        window.open(item.action, "_blank");
    } else if (item.type === "Buscador") {
        selectSearchEngine(item.id);
        const activeSection = document.querySelector('#main-nav .active')?.dataset.section
        if(activeSection !== 'inicio') {
            switchTab('inicio')
        }
        document.getElementById('main-search-input')?.focus();
    } else if (item.type === "Promp") {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.action;
        navigator.clipboard.writeText(tempDiv.textContent || tempDiv.innerText).then(() => showToast("Prompt copiado."));
    } else {
        openEditPanel(id);
    }
}

function handleSearchInputShortcut(e) {
    const input = e.target;
    const value = input.value;

    if (value.length > 1 && value.endsWith(' ')) {
        const shortcut = value.slice(0, -1).toLowerCase();
        const engine = data.items.find(item => item.type === 'Buscador' && item.shortcut === shortcut);

        if (engine) {
            e.preventDefault();
            selectSearchEngine(engine.id);
            input.value = '';
        }
    }
}

function toggleSearchEngineDropdown() {
    const dropdown = document.getElementById('search-engine-dropdown');

    if(!dropdown || !button) return;
    
    const isOpen = !dropdown.classList.contains('hidden');

function performMainSearch() {

        return;

        renderGlobalSearchResultsInHome(term);
        return;
    }

    const engine = data.items.find(i => i.id === selectedSearchEngineId);
    if (engine) {
        const url = engine.action.replace('{search_term}', encodeURIComponent(term));
        window.open(url, '_blank');
    }

function handleGlobalShortcuts(e) {
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const modifier = isMac ? e.metaKey : e.ctrlKey;
    const isInputFocused = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.isContentEditable;

    if (e.key === 'Escape') {
        const modals = ['editPanel', 'eventPanel', 'settingsHelpPanel', 'confirmModal'];
        modals.forEach(id => document.getElementById(id).classList.add('hidden'));
        closeSearchEngineDropdown();
        return;
    }

    if (modifier && e.altKey) {
        switch (e.key.toLowerCase()) {
            case 'n': e.preventDefault(); openEditPanel(); break;
            case 't': e.preventDefault(); changeTheme(); break;
            case 'v':
                e.preventDefault();
                const viewButtons = Array.from(document.querySelectorAll('#global-view-switcher button'));
                const activeButton = document.querySelector('#global-view-switcher button.active');
                if (activeButton) {
                    const currentIndex = viewButtons.indexOf(activeButton);
                    const nextIndex = (currentIndex + 1) % viewButtons.length;
                    viewButtons[nextIndex].click();
                }
                break;
        }
    }
}


function toggleFavorite(event, itemId) {
    event.stopPropagation();
    const numericId = parseInt(itemId, 10);
    const item = data.items.find(i => i.id === numericId);
    if (!item) return;

    const itemSectionName = Object.keys(typeMap).find(key => {
        const type = typeMap[key];
        return Array.isArray(type) ? type.includes(item.type) : type === item.type;
    });

    if (!itemSectionName) {
        console.error("No se pudo determinar la sección para el elemento:", item);
        return;
    }

    item.isFavorite = !item.isFavorite;

    if (!data.favoriteOrders) data.favoriteOrders = {};
    if (!data.favoriteOrders[itemSectionName]) data.favoriteOrders[itemSectionName] = [];
    
    const favoritesArray = data.favoriteOrders[itemSectionName];
    const indexInFavorites = favoritesArray.indexOf(numericId);

    if (item.isFavorite) {
        // Add to favorites if it's not already there (safety check)
        if (indexInFavorites === -1) {
            favoritesArray.unshift(numericId);
        }
    } else {
        // Remove from favorites if it exists
        if (indexInFavorites > -1) {
            favoritesArray.splice(indexInFavorites, 1);
        }
    }
    
    showToast(item.isFavorite ? `"${item.title}" añadido a favoritos.` : `"${item.title}" quitado de favoritos.`);
    saveData().then(refreshUI);
}

// --- AGENDA WIDGET ---
function getUpcomingEvents(days) {
    if (!data.events || data.events.length === 0) return [];
    
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const limitDate = new Date();
    limitDate.setHours(0, 0, 0, 0);
    limitDate.setDate(limitDate.getDate() + days);

    const upcoming = data.events.map(event => {
        const dateParts = event.date.split('-').map(Number);
        const eventDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
        eventDate.setHours(0,0,0,0);
        
        let nextOccurrence = new Date(eventDate);

        if (event.type === 'birthday' || event.type === 'anniversary') {
            nextOccurrence.setFullYear(today.getFullYear());
            if (nextOccurrence < today) {
                nextOccurrence.setFullYear(today.getFullYear() + 1);
            }
        }
        
        if (nextOccurrence >= today && nextOccurrence <= limitDate) {
             const diffTime = nextOccurrence - today;
             const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
             const reminderDays = parseInt(event.reminderDays) || 0;
             const isReminderActive = reminderDays > 0 && diffDays <= reminderDays;
             return { ...event, date: nextOccurrence, isReminderActive };
        }
        return null;
    }).filter(Boolean);

    return upcoming.sort((a, b) => a.date - b.date);
}

function handleSaveEvent(event) {
    event.preventDefault();
    const id = document.getElementById('eventId').value;
    const newEvent = {
        id: id ? parseInt(id) : Date.now(),
        title: document.getElementById('eventTitle').value,
        date: document.getElementById('eventDate').value,
        type: document.getElementById('eventType').value,
        note: document.getElementById('eventNote').value,
        reminderDays: parseInt(document.getElementById('eventReminder').value) || 0
    };

    if (id) {
        const index = data.events.findIndex(e => e.id === newEvent.id);
        if (index !== -1) data.events[index] = newEvent;
    } else {
        if (!data.events) data.events = [];
        data.events.push(newEvent);
    }
    document.getElementById('eventPanel').classList.add('hidden');
    saveData().then(refreshUI);
    showToast('Evento guardado.');
}

function deleteEvent(event, eventId) {
    event.stopPropagation();
    showConfirmModal('¿Seguro que quieres eliminar este evento?', (confirmed) => {
        if (confirmed) {
            data.events = data.events.filter(e => e.id !== eventId);
            saveData().then(refreshUI);
            showToast('Evento eliminado.');
        }
    });
}

    localStorage.setItem('theme', theme);
}

function showToast(message, type = 'success') {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    
    toast.style.backgroundColor = '';
    toast.style.color = '';

    if (type === 'error') {
        toast.style.backgroundColor = '#ef4444'; // red-500
        toast.style.color = 'white';
    } else {
        toast.style.backgroundColor = 'var(--primary)';
        toast.style.color = 'var(--primary-foreground)';
    }

    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
}

function getIconHtml(icon, sizeClass = 'text-2xl', isForCard = false) {
    const colorClass = isForCard ? 'text-white/90' : 'text-foreground';
    const errorColorClass = isForCard ? 'text-white/50' : 'text-muted-foreground';

    if (!icon) return `<i class="fas fa-question-circle ${sizeClass} ${errorColorClass}"></i>`;
    if (icon.startsWith('http')) {
        const imgClass = { 'text-lg': 'w-5 h-5', 'text-xl': 'w-6 h-6', 'text-2xl': 'w-8 h-8', 'text-4xl': 'w-12 h-12' }[sizeClass] || 'w-6 h-6';
        return `<img src="${icon}" class="${imgClass} object-contain" alt="Icono" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fas fa-question-circle ${sizeClass} ${errorColorClass}\\'></i>';">`;
    }
    return `<i class="${icon} ${sizeClass} ${colorClass}"></i>`;
}

// --- MODAL IMPLEMENTATIONS ---
function openEditPanel(itemId = null) {
    const modal = document.getElementById('editPanel');
    const item = itemId ? data.items.find(i => String(i.id) === String(itemId)) : null;
    const activeSection = document.querySelector('#main-nav .active')?.dataset.section || 'links';
    const defaultTypeMap = { 'buscadores': 'Buscador', 'links': 'Link', 'prompts': 'Promp', 'notes-tasks': 'Nota' };
    const type = item ? item.type : defaultTypeMap[activeSection];
    
    modal.innerHTML = `
        <div class="modal-container w-full max-w-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 id="editPanelTitle" class="text-2xl font-bold">${item ? 'Editar' : 'Nuevo'} Elemento</h2>
                <button onclick="document.getElementById('editPanel').classList.add('hidden')" class="btn btn-ghost !p-2">&times;</button>
            </div>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editItemId" value="${item?.id || ''}">
                <div>
                    <label class="font-semibold block mb-2">Tipo</label>
                    <div class="flex flex-wrap gap-2 type-selector">
                        ${['Buscador', 'Link', 'Promp', 'Nota', 'Tarea'].map(t => `
                            <button type="button" data-type="${t}" class="btn ${type === t ? 'btn-primary' : 'btn-secondary'} type-btn">${t}</button>
                        `).join('')}
                    </div>
                    <input type="hidden" id="newType" value="${type}">
                </div>
                <div>
                    <label class="font-semibold block mb-2">Título</label>
                    <input type="text" id="newTitle" class="input-base" placeholder="Nombre del elemento" value="${item?.title || ''}">
                </div>
                 <div id="actionFieldContainer">
                    <label id="actionLabel" class="font-semibold block mb-2">Contenido / URL</label>
                    <textarea id="newActionText" class="input-base hidden" rows="3">${(item && typeof item.action === 'string') ? item.action : ''}</textarea>
                    <div id="newActionRich" class="input-base hidden min-h-[100px]" contenteditable="true"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div id="iconFieldContainer">
                        <label class="font-semibold block mb-2">Icono (URL o FontAwesome)</label>
                        <input type="text" id="newIcon" class="input-base" placeholder="https://.../logo.png o fas fa-search" value="${item?.icon || ''}">
                    </div>
                    <div id="shortcutFieldContainer" class="hidden">
                        <label class="font-semibold block mb-2">Atajo (1-2 caracteres)</label>
                        <input type="text" id="newShortcut" class="input-base" placeholder="g" maxlength="2" value="${item?.shortcut || ''}">
                    </div>
                </div>
                <div>
                    <label class="font-semibold block mb-2">Categoría</label>
                    <input type="text" id="newCategory" class="input-base" list="category-suggestions" placeholder="Categoría nueva o existente" value="${item?.category || ''}">
                    <datalist id="category-suggestions"></datalist>
                </div>
                <div>
                    <label class="font-semibold block mb-2">Etiquetas (separadas por coma)</label>
                    <input type="text" id="newTags" class="input-base" placeholder="trabajo, personal" value="${item?.tags?.join(', ') || ''}">
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    ${item ? `<button type="button" id="deleteItemButton" class="btn btn-secondary !bg-red-500/10 !text-red-500 mr-auto">Eliminar</button>` : ''}
                    <button type="button" onclick="document.getElementById('editPanel').classList.add('hidden')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    `;
    modal.classList.remove('hidden');

    const form = modal.querySelector('#editForm');
    form.onsubmit = handleSaveItem;

    if (item) {
        document.getElementById('deleteItemButton').onclick = (e) => deleteItem(e, item.id);
    }
    
    modal.querySelector('.type-selector').addEventListener('click', e => {
        const button = e.target.closest('.type-btn');
        if (button) {
            const newType = button.dataset.type;
            modal.querySelectorAll('.type-btn').forEach(b => b.classList.replace('btn-primary', 'btn-secondary'));
            button.classList.replace('btn-secondary', 'btn-primary');
            document.getElementById('newType').value = newType;
            updateEditFormFields(newType);
        }
    });

    updateEditFormFields(type, item);
    populateCategorySuggestions(type);
}

function updateEditFormFields(type, item = null) {
    const richEditor = document.getElementById('newActionRich');
    const textEditor = document.getElementById('newActionText');
    const iconField = document.getElementById('iconFieldContainer');
    const shortcutField = document.getElementById('shortcutFieldContainer');
    const actionLabel = document.getElementById('actionLabel');

    richEditor.classList.add('hidden');
    textEditor.classList.add('hidden');
    iconField.style.display = 'block';
    shortcutField.classList.add('hidden');

    if(type === 'Buscador'){
        shortcutField.classList.remove('hidden');
        actionLabel.textContent = 'URL / Acción';
        textEditor.classList.remove('hidden');
        if (item) textEditor.value = item.action;
    } else if (type === 'Nota' || type === 'Promp') {
        actionLabel.textContent = 'Contenido';
        richEditor.classList.remove('hidden');
        iconField.style.display = 'none';
        if (item && typeof item.action === 'string') richEditor.innerHTML = item.action;
    } else if (type === 'Tarea') {
        actionLabel.textContent = 'Tareas (una por línea)';
        richEditor.classList.remove('hidden');
        iconField.style.display = 'none';
        if (item && Array.isArray(item.action)) {
            richEditor.innerHTML = item.action.map(t => `<div>${t.text}</div>`).join('');
        }
    } else { // Link
        actionLabel.textContent = 'URL / Acción';
        textEditor.classList.remove('hidden');
        if (item) textEditor.value = item.action;
    }
}

function populateCategorySuggestions(itemType) {
    const dataList = document.getElementById("category-suggestions");
    if (!dataList) return;
    dataList.innerHTML = '';
    const categories = [...new Set(data.items.filter(item => item.type === itemType).map(item => item.category).filter(Boolean))].sort();
    categories.forEach(cat => dataList.innerHTML += `<option value="${cat}"></option>`);
}

function handleSaveItem(event) {
    event.preventDefault();
    const id = document.getElementById("editItemId").value;
    const type = document.getElementById("newType").value;
    let action;
    if (type === 'Nota' || type === 'Promp') {
        action = document.getElementById('newActionRich').innerHTML;
    } else if (type === 'Tarea') {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = document.getElementById('newActionRich').innerHTML;
        const existingTasks = id ? (data.items.find(i => String(i.id) === id)?.action || []) : [];
        action = Array.from(tempDiv.children).map((child, index) => ({ text: child.textContent || child.innerText, status: existingTasks[index]?.status || false })).filter(t => t.text.trim());
    } else {
        action = document.getElementById('newActionText').value;
    }
    
    let icon = document.getElementById("newIcon").value.trim();
    if (!icon && (type === 'Link' || type === 'Buscador')) {
        try {
            const url = new URL(action);
            icon = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
        } catch (e) { console.error("URL inválida:", action); }
    }

    const newItemData = {
        title: document.getElementById("newTitle").value.trim() || 'Sin Título',
        action, type,
        category: document.getElementById("newCategory").value.trim() || 'Sin Categoría',
        icon,
        tags: document.getElementById("newTags").value.split(",").map(tag => tag.trim()).filter(Boolean)
    };

    if (type === 'Buscador') {
        const shortcut = document.getElementById("newShortcut").value.trim().toLowerCase();
        if (shortcut) {
            const otherEngineWithShortcut = data.items.find(i => i.type === 'Buscador' && i.shortcut === shortcut && String(i.id) !== id);
            if (otherEngineWithShortcut) {
                showToast(`Atajo "${shortcut}" ya está en uso por "${otherEngineWithShortcut.title}".`, 'error');
                return;
            }
            newItemData.shortcut = shortcut;
        }
    }

    if (id) {
        const index = data.items.findIndex(i => String(i.id) === id);
        if (index !== -1) data.items[index] = { ...data.items[index], ...newItemData };
    } else {
        newItemData.id = Date.now();
        newItemData.isFavorite = false;
        data.items.push(newItemData);
    }
    
    saveData().then(() => {
        refreshUI();
        document.getElementById("editPanel").classList.add("hidden");
        showToast(`Elemento "${newItemData.title}" guardado.`);
    });
}

function deleteItem(event, id) {
    event.stopPropagation();
    showConfirmModal("¿Seguro que quieres eliminar este elemento?", (confirmed) => {
        if (confirmed) {
            const numericId = parseInt(id, 10);
            data.items = data.items.filter(i => i.id !== numericId);
            if (data.favoriteOrders) {
                for (const section in data.favoriteOrders) {
                    data.favoriteOrders[section] = data.favoriteOrders[section].filter(favId => favId !== numericId);
                }
            }
            saveData().then(() => {
                refreshUI();
                document.getElementById("editPanel").classList.add("hidden");
                showToast("Elemento eliminado.");
            });
        }
    });
}

                    <div class="flex justify-end gap-2 pt-4">

                    <h3 class="font-bold text-lg">¿Qué es esto?</h3>

                          <li><kbd>${isMac ? '⌘' : 'Ctrl'}</kbd> + <kbd>B</kbd> : Activar barra de búsqueda global</li>
                          <li><kbd>${isMac ? '⌘' : 'Ctrl'}</kbd> + <kbd>Alt</kbd> + <kbd>N</kbd> : Agregar nuevo elemento</li>
                          <li><kbd>${isMac ? '⌘' : 'Ctrl'}</kbd> + <kbd>Alt</kbd> + <kbd>T</kbd> : Cambiar tema (claro/oscuro)</li>

            document.getElementById(`${tab.dataset.tab}-tab-content`).classList.remove('hidden');
        });

      else t.style.borderBottom = 'none';

        tab.addEventListener('click', () => {
            tabs.forEach(t => {
                t.classList.remove('active');
                t.style.borderBottom = 'none';

function saveSettings() {
    const gistId = document.getElementById('gistIdInput').value.trim();
    const pat = document.getElementById('githubPatInput').value.trim();
    if (gistId) localStorage.setItem('gist_id', gistId);
    if (pat) localStorage.setItem('github_pat', pat);
    document.getElementById('settingsHelpPanel').classList.add('hidden');
    showToast("Configuración guardada. Recargando...");
    loadData();
}

function showConfirmModal(message, callback) {
    const modal = document.getElementById('confirmModal');
    modal.innerHTML = `
        <div class="modal-container w-full max-w-md p-6 text-center">
            <p class="text-lg mb-6">${message}</p>
            <div class="flex justify-center gap-4">
                <button id="confirmCancel" class="btn btn-secondary">Cancelar</button>
                <button id="confirmOk" class="btn btn-primary">Aceptar</button>
            </div>
        </div>
    `;
    modal.classList.remove('hidden');
    modal.querySelector('#confirmOk').onclick = () => { modal.classList.add('hidden'); callback(true); };
    modal.querySelector('#confirmCancel').onclick = () => { modal.classList.add('hidden'); callback(false); };
}

function openCategoryEditModal(event, originalName) {
    event.stopPropagation();
    const modal = document.getElementById('editPanel');
    modal.innerHTML = `
        <div class="modal-container w-full max-w-md p-6">
            <h2 class="text-2xl font-bold mb-4">Editar Categoría</h2>
            <form id="categoryEditForm">
                <input type="hidden" id="originalCategoryName" value="${originalName}">
                <div>
                    <label for="categoryNameInput" class="font-semibold block mb-2">Nuevo nombre</label>
                    <input type="text" id="categoryNameInput" class="input-base" value="${originalName}" required>
                </div>
                <div class="flex justify-end gap-2 pt-4 mt-2">
                    <button type="button" onclick="document.getElementById('editPanel').classList.add('hidden')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    `;
    modal.classList.remove('hidden');
    document.getElementById('categoryNameInput').focus();
    document.getElementById('categoryEditForm').onsubmit = saveCategoryChanges;
}

function saveCategoryChanges(event) {
    event.preventDefault();
    const originalName = document.getElementById('originalCategoryName').value;
    const newName = document.getElementById('categoryNameInput').value.trim();

    if (!newName || newName === originalName) {
        document.getElementById('editPanel').classList.add('hidden');
        return;
    }
    data.items.forEach(item => {
        if (item.category === originalName) item.category = newName;
    });
    Object.keys(data.categoryOrders).forEach(section => {
        data.categoryOrders[section] = data.categoryOrders[section].map(cat => cat === originalName ? newName : cat);
    });
    document.getElementById('editPanel').classList.add('hidden');
    saveData().then(refreshUI);
    showToast(`Categoría renombrada a "${newName}".`);
}

function showPreviewModal(item, event) {
    const modal = document.getElementById('preview-modal');
    if (item.type !== 'Link' && item.type !== 'Buscador') return;
    
    const modalContent = document.getElementById('preview-modal-content');
    const previewUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(item.action.split('?')[0])}?w=400`;
    modalContent.style.backgroundImage = `url('${previewUrl}')`;
    
    const tagsContainer = document.getElementById('preview-modal-tags');
    if (item.tags && item.tags.length > 0) {
        tagsContainer.innerHTML = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
        tagsContainer.style.display = 'flex';
    } else {
        tagsContainer.style.display = 'none';
    }

    const modalWidth = 320; 
    const modalHeight = 240;
    const cursorX = event.clientX; 
    const cursorY = event.clientY;
    const viewportWidth = window.innerWidth; 
    const viewportHeight = window.innerHeight;
    const offset = 20;

    let top = cursorY + offset; 
    let left = cursorX + offset;

    if (top + modalHeight > viewportHeight - offset) top = cursorY - modalHeight - offset;
    if (left + modalWidth > viewportWidth - offset) left = cursorX - modalWidth - offset;
    
    modal.style.top = `${top}px`;
    modal.style.left = `${left}px`;
    modal.classList.remove('hidden');
    setTimeout(() => { modal.style.opacity = '1'; }, 10);
}

function hidePreviewModal() {
    const modal = document.getElementById('preview-modal');
    modal.style.opacity = '0';
    setTimeout(() => { modal.classList.add('hidden'); }, 200);
}

function updateSyncStatus(status, message = '') {
    const iconEl = document.getElementById('sync-icon');
    const textEl = document.getElementById('sync-text');
    iconEl.className = 'fas'; 
    switch (status) {
        case 'loading':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Cargando...';
            break;
        case 'saving':
            iconEl.classList.add('fa-spinner', 'fa-spin');
            textEl.textContent = 'Guardando...';
            break;
        case 'synced':
            iconEl.classList.add('fa-check-circle');
            textEl.textContent = 'Sincronizado';
            break;
        case 'local':
            iconEl.classList.add('fa-save');
            textEl.textContent = 'Guardado Local';
            break;
        case 'error':
            iconEl.classList.add('fa-exclamation-triangle');
            textEl.textContent = message || 'Error';
            break;
    }
}
