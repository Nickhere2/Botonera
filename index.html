<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Accesos - Xeneize</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <!-- Librería para Drag and Drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    /* --- TEMAS DE COLORES --- */
    :root { --boca-blue: #003366; --boca-gold: #FFCC00; }
    
    /* --- TEMA POR DEFECTO (CLARO) --- */
    body { --theme-color: #0d9488; --theme-color-hover: #0f766e; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f0f2f5;color:#333;transition:background-color .3s,color .3s}
    .main-layout { display: grid; grid-template-columns: auto 1fr; height: 100vh; }
    .sidebar-nav { background-color: #e5e7eb; border-right: 1px solid #d1d5db; }
    .sidebar-nav .nav-link { color: #4b5563; }
    .sidebar-nav .nav-link.active { color: var(--theme-color); }
    .main-content { background-color: #f9fafb; }
    .category-title { color: #1f2937; }
    .filter-btn { background-color: #e5e7eb; }
    .filter-btn.active { background-color: var(--theme-color); color: white; }
    .card-preview-container, .list-item-container, .chip-item-container { background-color: white; }
    .card-content .text-gray-800 { color: #1f2937; }
    .card-content .text-gray-500 { color: #6b7280; }
    .tag { background-color: #e5e7eb; color: #4b5563; }
    .modal-content { background: white; }

    /* --- TEMA OSCURO --- */
    body.dark{background-color:#121212;color:#ddd; --theme-color: #5eead4; --theme-color-hover: #2dd4bf;}
    body.dark .sidebar-nav {background-color:#1e1e1e; border-color:rgba(255,255,255,0.1)}
    body.dark .main-content { background-color: #121212; }
    body.dark input,body.dark select,body.dark textarea, body.dark .rich-text-editor{background-color:#2a2a2a;color:#ddd;border-color:#444}
    body.dark .filter-btn{background-color:#3a3a3a;color:#ddd}
    body.dark .filter-btn.active{background-color:var(--theme-color);color:black}
    body.dark #editPanel,body.dark .modal-content, body.dark #tagFilterPanel, body.dark #search-palette{background-color:rgba(30,30,30,.97);backdrop-filter:blur(4px)}
    body.dark #noteModal, body.dark #taskModal, body.dark #search-palette-overlay{background-color:rgba(0,0,0,.7)}
    body.dark .category-title{color:#e5e7eb}
    body.dark .nav-link { color: #9ca3af; }
    body.dark .nav-link.active { color: var(--theme-color); }
    body.dark .card-preview-container, body.dark .list-item-container, body.dark .chip-item-container { background-color: #1f2937; }
    body.dark .card-content .text-gray-800 { color: white; }
    body.dark .card-content .text-gray-500 { color: #9ca3af; }
    body.dark .tag { background-color: #374151; color: #d1d5db; }

    /* --- TEMA BOCA JUNIORS --- */
    body.theme-boca {
        background: linear-gradient(135deg, #0c1a2e, #001f4d);
        color: #e5e7eb;
        --theme-color: var(--boca-gold);
        --theme-color-hover: #e6b800;
    }
    body.theme-boca .sidebar-nav {
        background-color: rgba(0, 25, 77, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-right: 1px solid rgba(255, 204, 0, 0.2);
    }
    body.theme-boca .main-content { background-color: transparent; }
    body.theme-boca .nav-link { color: white; }
    body.theme-boca .nav-link.active .franja-bg { left: 0; }
    body.theme-boca .nav-link.active .icon, body.theme-boca .nav-link.active .text { color: var(--boca-blue); }
    body.theme-boca .category-title { color: white; }
    body.theme-boca .filter-btn { background-color: rgba(255,255,255,0.1); color: #ccc; }
    body.theme-boca .filter-btn.active { background-color: var(--boca-gold); color: var(--boca-blue); }
    body.theme-boca .card-preview-container, body.theme-boca .list-item-container, body.theme-boca .chip-item-container {
        background-color: rgba(0, 40, 85, 0.4);
        border: 1px solid rgba(255, 204, 0, 0.15);
        backdrop-filter: blur(5px);
    }
    body.theme-boca .card-content .text-gray-800 { color: white; }
    body.theme-boca .card-content .text-gray-500 { color: #ccc; }
    body.theme-boca .tag { background-color: rgba(0, 51, 102, 0.8); color: var(--boca-gold); border: 1px solid var(--boca-gold); }
    
    /* --- Estilos Comunes para Sidebar, Tarjetas, etc. --- */
    .sidebar-nav { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 80px; overflow: hidden; }
    .sidebar-nav:hover { width: 256px; }
    .sidebar-nav .nav-link { position: relative; overflow: hidden; display: flex; align-items: center; height: 56px; padding: 0 24px; border-radius: 8px; transition: background-color 0.2s ease; }
    .sidebar-nav .nav-link .franja-bg { position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background-color: var(--boca-gold); transition: left 0.4s ease; z-index: 0; border-radius: 8px; }
    .sidebar-nav .icon { width: 32px; font-size: 1.25rem; transition: color 0.3s ease; position: relative; z-index: 1; }
    .sidebar-nav .text { margin-left: 1rem; font-weight: 600; white-space: nowrap; transition: color 0.3s ease; position: relative; z-index: 1; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .list-view { display: flex; flex-direction: column; gap: 0.75rem; }
    .chip-view { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  </style>
</head>
<body class="theme-boca">

<div class="main-layout">
    <!-- Barra de Navegación Vertical -->
    <nav id="sidebar-nav" class="sidebar-nav p-4 flex flex-col gap-2">
        <div class="flex items-center h-16 mb-4 pl-2">
            <i class="fas fa-shield-alt text-3xl text-white"></i>
            <span class="text ml-4 text-xl font-bold text-white">Botonera</span>
        </div>

        <button class="nav-link active" data-target="buscadores">
            <span class="franja-bg"></span>
            <i class="icon fas fa-search"></i><span class="text">Buscadores</span>
        </button>
        <button class="nav-link" data-target="links">
            <span class="franja-bg"></span>
            <i class="icon fas fa-link"></i><span class="text">Links</span>
        </button>
        <button class="nav-link" data-target="prompts">
            <span class="franja-bg"></span>
            <i class="icon fas fa-brain"></i><span class="text">Prompts</span>
        </button>
        <button class="nav-link" data-target="notes">
            <span class="franja-bg"></span>
            <i class="icon fas fa-sticky-note"></i><span class="text">Notas</span>
        </button>
        <button class="nav-link" data-target="tasks">
            <span class="franja-bg"></span>
            <i class="icon fas fa-tasks"></i><span class="text">Tareas</span>
        </button>

        <div class="mt-auto">
             <button class="nav-link" id="settings-btn">
                <span class="franja-bg"></span>
                <i class="icon fas fa-cog"></i><span class="text">Ajustes</span>
            </button>
        </div>
    </nav>

    <!-- Área de Contenido Principal -->
    <main class="main-content">
        <h1 id="content-title" class="text-4xl font-bold text-white mb-8">Buscadores</h1>
        
        <div id="section-buscadores" class="section">
            <div class="flex justify-between items-center mb-4">
                <div id="searchFilterButtons" class="flex flex-wrap gap-2"></div>
                <div id="searchViewSwitcher" class="flex items-center gap-2"></div>
            </div>
            <div id="searchEnginesContainer" class="space-y-8"></div>
        </div>
        <div id="section-links" class="section hidden">
            <div class="flex justify-between items-center mb-4">
                <div id="linkFilterButtons" class="flex flex-wrap gap-2"></div>
                <div id="linkViewSwitcher" class="flex items-center gap-2"></div>
            </div>
            <div id="linksContainer" class="space-y-8"></div>
        </div>
        <div id="section-prompts" class="section hidden">
            <div class="flex justify-between items-center mb-4">
                <div id="promptFilterButtons" class="flex flex-wrap gap-2"></div>
                <div id="promptViewSwitcher" class="flex items-center gap-2"></div>
            </div>
            <div id="promptsContainer" class="space-y-8"></div>
        </div>
        <div id="section-notes" class="section hidden">
            <div class="flex justify-between items-center mb-4">
                <div id="noteFilterButtons" class="flex flex-wrap gap-2"></div>
                <div id="noteViewSwitcher" class="flex items-center gap-2"></div>
            </div>
            <div id="notesContainer" class="space-y-8"></div>
        </div>
        <div id="section-tasks" class="section hidden">
            <div class="flex justify-between items-center mb-4">
                <div id="taskFilterButtons" class="flex flex-wrap gap-2"></div>
                <div id="taskViewSwitcher" class="flex items-center gap-2"></div>
            </div>
            <div id="tasksContainer" class="space-y-8"></div>
        </div>
    </main>
</div>

<!-- Modales y otros elementos flotantes -->
<div id="editPanel" class="hidden fixed top-0 left-0 w-full h-full z-[1000] overflow-y-auto">
    <!-- Contenido del panel de edición -->
</div>
<div id="toast" class="hidden fixed bottom-5 right-5 bg-green-600 text-white py-2 px-4 rounded-md shadow-lg"></div>
<div id="noteModal" class="modal hidden">
    <!-- Contenido del modal de notas -->
</div>
<div id="taskModal" class="modal hidden">
    <!-- Contenido del modal de tareas -->
</div>
<div id="search-palette-overlay" class="fixed inset-0 z-50 flex justify-center items-start pt-[15vh] hidden">
    <!-- Contenido de la paleta de búsqueda -->
</div>
<div id="imagePreviewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[2000] flex items-center justify-center pointer-events-none">
    <img id="imagePreviewSrc" src="" class="max-w-[80%] max-h-[80%] rounded-lg shadow-2xl">
</div>
<div class="fab-container">
    <ul class="fab-actions">
        <li class="fab-action"><button id="fab-add" class="fab-action-item" title="Añadir Tarjeta"><i class="fas fa-plus"></i></button></li>
        <li class="fab-action"><button id="fab-search" class="fab-action-item" title="Buscar en Sección"><i class="fas fa-search"></i></button></li>
        <li class="fab-action"><button id="fab-theme" class="fab-action-item" title="Cambiar Tema"><i class="fas fa-palette"></i></button></li>
    </ul>
    <div class="fab-main"><i class="fas fa-bars"></i></div>
</div>

<script>
    // El JavaScript completo de la aplicación iría aquí.
</script>

</body>
</html>
