<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Accesos v12 - Brutalist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        /* --- ESTILO BRUTALISTA --- */
        :root {
            --bg-color: #fefce8; /* Amarillo pálido */
            --text-color: #1e293b; /* Azul oscuro/negro */
            --accent-color: #facc15; /* Amarillo brillante */
            --accent-color-hover: #fde047;
            --border-width: 3px;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .brutalist-card {
            background: white;
            border: var(--border-width) solid var(--text-color);
            box-shadow: 8px 8px 0 var(--text-color);
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .brutalist-card:hover {
            box-shadow: 4px 4px 0 var(--text-color);
            transform: translate(4px, 4px);
        }

        .brutalist-sidebar {
            background-color: var(--bg-color);
            border-right: var(--border-width) solid var(--text-color);
        }

        .nav-link {
            border: var(--border-width) solid var(--text-color);
            font-weight: 700;
            transition: background-color 0.2s;
        }
        .nav-link.active {
            background-color: var(--accent-color);
            color: var(--text-color);
        }
        .nav-link:hover:not(.active) {
             background-color: var(--accent-color-hover);
        }

        .brutalist-button {
            background-color: var(--accent-color);
            border: var(--border-width) solid var(--text-color);
            box-shadow: 4px 4px 0 var(--text-color);
            font-weight: 700;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }
        .brutalist-button:hover {
            box-shadow: 2px 2px 0 var(--text-color);
            transform: translate(2px, 2px);
        }
        .brutalist-button:active {
            box-shadow: 0 0 0 var(--text-color);
            transform: translate(4px, 4px);
        }

        .brutalist-input {
            background: white;
            border: var(--border-width) solid var(--text-color);
            padding: 0.75rem;
            width: 100%;
            font-family: 'Space Mono', monospace;
        }
        .brutalist-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .main-header {
             border-bottom: 4px solid var(--text-color);
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 3rem;
        }
        
        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 3px solid var(--text-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .brutalist-card:hover .card-actions {
            opacity: 1;
        }
        .action-btn {
            width: 32px;
            height: 32px;
            border: var(--border-width) solid var(--text-color);
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:hover {
            background: var(--accent-color);
        }
        .card-drag-handle {
            position: absolute;
            top: 8px;
            left: 8px;
            cursor: move;
            padding: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .brutalist-card:hover .card-drag-handle {
            opacity: 1;
        }
        
        /* --- PANEL DE EDICIÓN --- */
        #editPanel {
            background-color: rgba(254, 252, 232, 0.8);
            backdrop-filter: blur(4px);
        }
        .edit-container {
            background-color: white;
            border: var(--border-width) solid var(--text-color);
            box-shadow: 8px 8px 0px var(--text-color);
        }
        .type-btn {
            border: var(--border-width) solid var(--text-color);
            transition: all 0.2s;
        }
        .type-btn.active {
            background-color: var(--accent-color);
            box-shadow: 4px 4px 0 var(--text-color);
            transform: translate(-4px, -4px);
        }
        .rich-text-editor {
            border: var(--border-width) solid var(--text-color);
            min-height: 120px;
            padding: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="flex h-screen">
        <!-- Barra Lateral de Navegación -->
        <aside class="w-64 brutalist-sidebar p-6 flex-shrink-0 flex-col hidden sm:flex">
            <h1 class="text-3xl font-bold mb-12">ACCESOS_</h1>
            <nav id="main-nav" class="space-y-4">
                <a href="#" data-section="buscadores" class="nav-link active block px-4 py-3"><i class="fas fa-search w-5 mr-2"></i><span>BUSCADORES</span></a>
                <a href="#" data-section="links" class="nav-link block px-4 py-3"><i class="fas fa-link w-5 mr-2"></i><span>LINKS</span></a>
                <a href="#" data-section="prompts" class="nav-link block px-4 py-3"><i class="fas fa-brain w-5 mr-2"></i><span>PROMPTS</span></a>
                <a href="#" data-section="notes" class="nav-link block px-4 py-3"><i class="fas fa-sticky-note w-5 mr-2"></i><span>NOTAS</span></a>
                <a href="#" data-section="tasks" class="nav-link block px-4 py-3"><i class="fas fa-tasks w-5 mr-2"></i><span>TAREAS</span></a>
            </nav>
            <div class="mt-auto w-full">
                 <p class="text-xs text-center">v12.brutalist.mod</p>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="flex-1 p-4 sm:p-8 overflow-y-auto">
            <!-- Cabecera -->
            <header class="main-header flex justify-between items-center mb-8 pb-4">
                <h2 id="main-title" class="text-3xl sm:text-4xl font-bold tracking-tighter">BUSCADORES</h2>
                <div class="flex items-center gap-4">
                    <button id="addNewButton" class="brutalist-button px-4 py-2">
                        <span>+ NUEVO</span>
                    </button>
                </div>
            </header>
            
            <div id="main-search-bar" class="brutalist-card p-6 lg:col-span-2 flex flex-col gap-4 mb-8">
                <div class="flex items-center gap-3">
                    <i id="search-bar-icon" class="fab fa-google text-2xl"></i>
                    <h4 id="search-bar-title" class="text-xl font-bold">BUSQUEDA RAPIDA</h4>
                </div>
                <input type="text" id="searchInput" list="searchSuggestions" placeholder="INGRESAR BUSQUEDA..." class="brutalist-input">
                <datalist id="searchSuggestions"></datalist>
                <button id="searchButton" class="brutalist-button w-full py-3">BUSCAR</button>
            </div>

            <!-- Contenedores de Secciones -->
            <div id="section-buscadores" class="section space-y-8"></div>
            <div id="section-links" class="section hidden space-y-8"></div>
            <div id="section-prompts" class="section hidden space-y-8"></div>
            <div id="section-notes" class="section hidden space-y-8"></div>
            <div id="section-tasks" class="section hidden space-y-8"></div>

        </main>
    </div>
    
    <!-- Panel de Edición -->
    <div id="editPanel" class="hidden fixed inset-0 z-[1000] overflow-y-auto p-8 flex items-center justify-center">
        <div class="edit-container w-full max-w-2xl p-8">
            <div class="flex justify-between items-center mb-6">
              <h2 id="editPanelTitle" class="text-2xl font-bold">AGREGAR ELEMENTO</h2>
              <button id="closeEditButton" class="brutalist-button !shadow-none !bg-transparent !border-none text-2xl font-bold">X</button>
            </div>
            
            <form id="editForm" class="space-y-6">
                <input type="hidden" id="editItemId">
                
                <div>
                  <label class="font-bold block mb-2">TIPO</label>
                  <div class="type-selector grid grid-cols-3 sm:grid-cols-5 gap-2">
                    <div class="type-btn text-center p-2" data-type="Buscador"><i class="fas fa-search"></i><span class="block text-xs">Buscador</span></div>
                    <div class="type-btn text-center p-2" data-type="Link"><i class="fas fa-link"></i><span class="block text-xs">Link</span></div>
                    <div class="type-btn text-center p-2" data-type="Promp"><i class="fas fa-brain"></i><span class="block text-xs">Prompt</span></div>
                    <div class="type-btn text-center p-2" data-type="Nota"><i class="fas fa-sticky-note"></i><span class="block text-xs">Nota</span></div>
                    <div class="type-btn text-center p-2" data-type="Tarea"><i class="fas fa-tasks"></i><span class="block text-xs">Tarea</span></div>
                  </div>
                  <select id="newType" class="hidden">
                    <option value="Buscador">Buscador</option>
                    <option value="Link">Link</option>
                    <option value="Promp">Promp</option>
                    <option value="Nota">Nota</option>
                    <option value="Tarea">Tarea</option>
                  </select>
                </div>

                <div>
                  <label class="font-bold block mb-2">TITULO</label>
                  <input type="text" id="newTitle" class="brutalist-input" placeholder="Nombre del elemento">
                </div>

                <div id="actionFieldContainer">
                  <label id="actionLabel" class="font-bold block mb-2">URL / ACCION</label>
                  <textarea id="newActionText" class="brutalist-input" rows="3"></textarea>
                  <div id="newActionRich" class="rich-text-editor hidden" contenteditable="true"></div>
                </div>

                <div id="iconFieldContainer">
                  <label class="font-bold block mb-2">ICONO (fas fa-search)</label>
                  <input type="text" id="newIcon" class="brutalist-input" placeholder="ej: fas fa-search o fab fa-youtube">
                </div>

                <div>
                  <label class="font-bold block mb-2">CATEGORIA</label>
                  <input type="text" id="newCategory" class="brutalist-input" list="category-suggestions" placeholder="Escribe o selecciona una categoría">
                  <datalist id="category-suggestions"></datalist>
                </div>
                 
                <div>
                  <label class="font-bold block mb-2">ETIQUETAS (separadas por coma)</label>
                  <input type="text" id="newTags" class="brutalist-input" placeholder="trabajo, personal">
                </div>
                
                <button id="saveItemButton" type="submit" class="brutalist-button w-full py-3">
                  GUARDAR
                </button>
            </form>
        </div>
    </div>
    
    <div id="toast" class="hidden fixed bottom-5 right-5 p-4 border-4 font-bold" style="border-color: var(--text-color); background-color: var(--accent-color);"></div>

<script>
// --- CONFIG & GLOBAL STATE ---
const FILENAME_IN_GIST = 'Botones.json';
let data = [];
let searchHistory = JSON.parse(localStorage.getItem("searchHistory") || "[]");

// --- MOCK DATA (for when Gist is not available) ---
const mockData = {
    "items": [
        { id: 1, type: 'Buscador', title: 'Google', action: 'https://www.google.com/search?q={search_term}', category: 'General', icon: 'fab fa-google', tags: ['motor', 'busqueda'] },
        { id: 2, type: 'Buscador', title: 'YouTube', action: 'https://www.youtube.com/results?search_query={search_term}', category: 'Video', icon: 'fab fa-youtube', tags: ['videos', 'tutoriales'] },
        { id: 3, type: 'Link', title: 'GitHub', action: 'https://github.com', category: 'Desarrollo', icon: 'fab fa-github', tags: ['codigo', 'proyectos'] },
        { id: 4, type: 'Promp', title: 'Generar Idea', action: 'Crea una lista de 5 ideas para un video de YouTube sobre IA.', category: 'Creatividad', icon: 'fas fa-lightbulb', tags: ['ideas'] },
        { id: 5, type: 'Nota', title: 'Reunión Lunes', action: 'Discutir presupuesto Q3.', category: 'Trabajo', icon: 'fas fa-sticky-note', tags: ['reunion'] },
        { id: 6, type: 'Tarea', title: 'Proyecto Web', action: [{text: 'Diseñar mockup', status: true}, {text: 'Desarrollar landing', status: false}], category: 'Proyectos', icon: 'fas fa-tasks', tags: ['web'] }
    ]
};

// --- DATA HANDLING ---
async function loadData() {
    const gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        showToast("USANDO DATOS DE EJEMPLO");
        data = mockData.items;
        initializeUI();
        return;
    }

    showToast("CARGANDO DATOS...");
    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`);
        if (!response.ok) throw new Error(`GIST NO ENCONTRADO: ${response.status}`);
        const gistData = await response.json();
        const fileContent = gistData.files[FILENAME_IN_GIST]?.content;
        
        if (!fileContent) {
            showToast("ARCHIVO NO ENCONTRADO EN GIST");
            data = mockData.items;
        } else {
            let loadedJson = JSON.parse(fileContent);
            data = (loadedJson.items || loadedJson).map(item => ({ ...item, icon: item.icon || '' }));
            showToast("DATOS CARGADOS.");
        }
    } catch (error) {
        console.error("Fallo al cargar datos:", error);
        showToast(`ERROR: ${error.message}`);
        data = [];
    }
    initializeUI();
}

async function saveData() {
    const gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        showToast("NO GIST ID. CAMBIOS NO GUARDADOS.");
        return;
    }
    
    const token = localStorage.getItem('github_pat');
    if (!token) {
        const userToken = prompt('INGRESA GITHUB PERSONAL ACCESS TOKEN:');
        if (userToken) localStorage.setItem('github_pat', userToken);
        else {
            showToast("ACCION CANCELADA. SE NECESITA TOKEN.");
            return;
        }
    }
    
    showToast("GUARDANDO...");
    const dataToSave = { items: data };

    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${localStorage.getItem('github_pat')}`, 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify({ files: { [FILENAME_IN_GIST]: { content: JSON.stringify(dataToSave, null, 2) } } })
        });
        if (!response.ok) throw new Error(`ERROR AL GUARDAR: ${response.status}`);
        showToast("CAMBIOS GUARDADOS.");
    } catch (error) {
        console.error("Fallo al guardar:", error);
        showToast("ERROR AL GUARDAR.");
    }
}

// --- UI INITIALIZATION & EVENT LISTENERS ---
document.addEventListener("DOMContentLoaded", () => {
    loadData();
    setupEventListeners();
});

function setupEventListeners() {
    document.getElementById('main-nav').addEventListener('click', (e) => {
        if (e.target.closest('.nav-link')) {
            e.preventDefault();
            const section = e.target.closest('.nav-link').dataset.section;
            switchTab(section);
        }
    });
    
    document.getElementById('editForm').addEventListener('submit', handleSaveItem);
    document.getElementById('addNewButton').addEventListener('click', () => openEditPanel());
    document.getElementById('closeEditButton').addEventListener('click', () => document.getElementById('editPanel').classList.add('hidden'));

    document.querySelectorAll('.type-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('newType').value = this.dataset.type;
            updateEditFormFields(this.dataset.type);
        });
    });

    document.querySelector("#searchButton").addEventListener("click", performSearch);
    document.querySelector("#searchInput").addEventListener("keypress", e => { if (e.key === 'Enter') performSearch(); });
}

function initializeUI() {
    if (!data) return;
    switchTab('buscadores'); // Start on the first tab
}

function switchTab(tabName) {
    // Update nav links
    document.querySelectorAll("#main-nav .nav-link").forEach(b => b.classList.remove("active"));
    document.querySelector(`#main-nav .nav-link[data-section="${tabName}"]`).classList.add("active");
    
    // Update main title
    document.getElementById('main-title').textContent = tabName.toUpperCase();

    // Show/hide sections
    document.querySelectorAll(".section").forEach(s => s.classList.add("hidden"));
    const activeSection = document.querySelector(`#section-${tabName}`);
    activeSection.classList.remove("hidden");
    
    // Show/hide search bar
    document.getElementById('main-search-bar').style.display = (tabName === 'buscadores') ? 'flex' : 'none';
    
    renderSection(tabName);
    updateSearchSuggestions();
}

// --- RENDERING ---
function renderSection(sectionName) {
    const typeMap = {
        buscadores: 'Buscador', links: 'Link', prompts: 'Promp',
        notes: 'Nota', tasks: 'Tarea'
    };
    const type = typeMap[sectionName];
    const container = document.getElementById(`section-${sectionName}`);
    container.innerHTML = '';
    
    const items = data.filter(item => item.type === type);
    
    const categorized = items.reduce((acc, item) => {
        const category = item.category || 'SIN CATEGORIA';
        (acc[category] = acc[category] || []).push(item);
        return acc;
    }, {});

    Object.keys(categorized).sort().forEach(cat => {
        const catDiv = document.createElement('div');
        const grid = document.createElement('div');
        grid.className = "card-grid";
        grid.dataset.category = cat;

        catDiv.innerHTML = `<h3 class="category-title">${cat}</h3>`;
        
        categorized[cat].forEach(item => grid.appendChild(createCard(item)));
        catDiv.appendChild(grid);
        container.appendChild(catDiv);

        new Sortable(grid, {
            animation: 150,
            handle: '.card-drag-handle',
            onEnd: function (evt) {
                const itemId = evt.item.dataset.id;
                const newCategory = evt.to.dataset.category;
                const item = data.find(d => String(d.id) === itemId);
                if (item && item.category !== newCategory) {
                    item.category = newCategory;
                    saveData().then(() => renderSection(sectionName));
                }
            }
        });
    });
}

function createCard(item) {
    const card = document.createElement("div");
    card.className = 'brutalist-card p-6';
    card.dataset.id = item.id;
    
    const iconHtml = `<i class="${item.icon || 'fas fa-question-circle'} text-4xl sm:text-6xl mb-3"></i>`;
    const titleHtml = `<h4 class="font-bold text-lg uppercase">${item.title}</h4>`;
    const categoryHtml = `<p class="text-sm">CATEGORIA: ${item.category}</p>`;
    
    let contentHtml = '';
    if (item.type === 'Tarea' && Array.isArray(item.action)) {
        contentHtml = `<ul class="space-y-2 list-none mt-4 flex-grow">
            ${item.action.map(task => `<li class="flex items-center gap-3">
                <input type="checkbox" class="w-6 h-6 appearance-none border-2 border-slate-900 checked:bg-slate-900" ${task.status ? 'checked' : ''} onchange="toggleTask(event, '${item.id}', '${task.text}')">
                <span class="${task.status ? 'line-through' : ''}">${task.text}</span>
            </li>`).join('')}
        </ul>`;
    } else if (item.type === 'Nota' || item.type === 'Promp') {
        contentHtml = `<div class="flex-grow mt-4 p-4 bg-gray-100 border-2 border-slate-900">
            <p class="opacity-90">${item.action}</p>
        </div>
        <button class="mt-4 brutalist-button w-full py-2" onclick="copyAction('${item.id}')">COPIAR</button>`;
    } else { // Link or Buscador
        contentHtml = `<div class="flex-grow"></div><button class="mt-4 brutalist-button w-full py-2" onclick="handleCardClick('${item.id}')">ABRIR</button>`;
    }

    card.innerHTML = `
        <div class="card-drag-handle"><i class="fas fa-grip-vertical"></i></div>
        <div class="card-actions">
            <button onclick="openEditPanel('${item.id}')" class="action-btn" title="Editar"><i class="fas fa-pencil-alt"></i></button>
            <button onclick="deleteItem('${item.id}')" class="action-btn" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
        </div>
        <div class="flex-grow flex flex-col items-center text-center">
            ${iconHtml}
            ${titleHtml}
            ${categoryHtml}
        </div>
        ${contentHtml}
    `;
    
    if (item.type !== 'Link' && item.type !== 'Buscador') {
        card.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                openEditPanel(item.id);
            }
        });
    }
    
    return card;
}

// --- ACTIONS & EVENT HANDLERS ---
function handleCardClick(id) {
    const item = data.find(i => String(i.id) === id);
    if (!item) return;

    if (item.type === "Link") {
        window.open(item.action, "_blank");
    } else if (item.type === "Buscador") {
        const searchBar = document.getElementById('main-search-bar');
        searchBar.querySelector('#search-bar-title').textContent = item.title.toUpperCase();
        searchBar.querySelector('#search-bar-icon').className = `${item.icon || 'fas fa-search'} text-2xl`;
        showToast(`MOTOR SELECCIONADO: ${item.title}`);
    }
}

function copyAction(id) {
    const item = data.find(i => String(i.id) === id);
    if (item) {
        navigator.clipboard.writeText(item.action).then(() => showToast("TEXTO COPIADO."));
    }
}

function toggleTask(event, itemId, taskText) {
    const item = data.find(i => String(i.id) === itemId);
    if (item && Array.isArray(item.action)) {
        const task = item.action.find(t => t.text === taskText);
        if (task) {
            task.status = event.target.checked;
            saveData();
        }
    }
}

function performSearch() {
    const searchTerm = document.getElementById("searchInput").value.trim();
    if (!searchTerm) return;
    if (!searchHistory.includes(searchTerm)) {
        searchHistory.push(searchTerm);
        localStorage.setItem("searchHistory", JSON.stringify(searchHistory));
        updateSearchSuggestions();
    }
    const engineTitle = document.getElementById("search-bar-title").textContent;
    const engine = data.find(item => item.type === "Buscador" && item.title.toUpperCase() === engineTitle);
    
    if (engine) {
        window.open(engine.action.replace("{search_term}", encodeURIComponent(searchTerm)), "_blank");
    } else { // Fallback to first engine if none selected
        const firstEngine = data.find(item => item.type === "Buscador");
        if (firstEngine) {
            window.open(firstEngine.action.replace("{search_term}", encodeURIComponent(searchTerm)), "_blank");
        } else {
            showToast("NO HAY BUSCADORES CONFIGURADOS");
        }
    }
}

function updateSearchSuggestions() {
    document.getElementById("searchSuggestions").innerHTML = searchHistory.map(term => `<option value="${term}"></option>`).join("");
}

// --- EDIT PANEL ---
function openEditPanel(itemId = null) {
    const form = document.getElementById('editForm');
    form.reset();
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    
    if (itemId) {
        const item = data.find(i => String(i.id) === itemId);
        if (item) {
            document.getElementById('editPanelTitle').textContent = 'EDITAR ELEMENTO';
            document.getElementById('editItemId').value = item.id;
            document.getElementById('newTitle').value = item.title;
            
            if (item.type === 'Nota' || item.type === 'Promp') {
                document.getElementById('newActionRich').innerHTML = item.action;
            } else if (item.type === 'Tarea' && Array.isArray(item.action)) {
                 document.getElementById('newActionRich').innerHTML = item.action.map(t => `<div>${t.text}</div>`).join('');
            } else {
                document.getElementById('newActionText').value = item.action;
            }

            document.getElementById('newTags').value = item.tags ? item.tags.join(', ') : '';
            document.getElementById('newIcon').value = item.icon || '';
            document.getElementById('newCategory').value = item.category || '';
            
            const typeBtn = document.querySelector(`.type-btn[data-type="${item.type}"]`);
            if(typeBtn) typeBtn.classList.add('active');
            document.getElementById('newType').value = item.type;
        }
    } else {
        document.getElementById('editPanelTitle').textContent = 'AGREGAR ELEMENTO';
        document.getElementById('editItemId').value = '';
        const defaultTypeBtn = document.querySelector('.type-btn[data-type="Link"]');
        if(defaultTypeBtn) defaultTypeBtn.classList.add('active');
        document.getElementById('newType').value = 'Link';
    }
    
    updateEditFormFields(document.getElementById('newType').value);
    populateCategorySuggestions();
    document.getElementById('editPanel').classList.remove('hidden');
}

function handleSaveItem(event) {
    event.preventDefault();
    const id = document.getElementById("editItemId").value;
    const type = document.getElementById("newType").value;
    let action;

    if (type === 'Nota' || type === 'Promp') {
        action = document.getElementById('newActionRich').innerHTML;
    } else if (type === 'Tarea') {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = document.getElementById('newActionRich').innerHTML;
        action = Array.from(tempDiv.children).map(child => ({ text: child.textContent, status: false }));
    } else {
        action = document.getElementById('newActionText').value;
    }

    const newItemData = {
        title: document.getElementById("newTitle").value.trim(),
        action: action,
        type: type,
        category: document.getElementById("newCategory").value.trim(),
        icon: document.getElementById("newIcon").value.trim(),
        tags: document.getElementById("newTags").value.split(",").map(tag => tag.trim()).filter(Boolean)
    };
  
    if (id) {
        const index = data.findIndex(i => String(i.id) === id);
        if (index !== -1) data[index] = { ...data[index], ...newItemData };
    } else {
        newItemData.id = Date.now();
        data.push(newItemData);
    }
  
    saveData().then(() => {
        const activeSection = document.querySelector('#main-nav .active').dataset.section;
        renderSection(activeSection);
        document.getElementById("editPanel").classList.add("hidden");
    });
}

function updateEditFormFields(type) {
    const richTextEditor = document.getElementById('newActionRich');
    const plainTextEditor = document.getElementById('newActionText');
    const actionLabel = document.getElementById('actionLabel');

    if (type === 'Nota' || type === 'Tarea' || type === 'Promp') {
        richTextEditor.classList.remove('hidden');
        plainTextEditor.classList.add('hidden');
        actionLabel.textContent = (type === 'Tarea') ? 'TAREAS (una por linea)' : 'CONTENIDO';
    } else {
        richTextEditor.classList.add('hidden');
        plainTextEditor.classList.remove('hidden');
        actionLabel.textContent = 'URL / ACCION';
    }
}

function populateCategorySuggestions() {
    const dataList = document.getElementById("category-suggestions");
    const categories = [...new Set(data.map(item => item.category))].sort();
    dataList.innerHTML = '';
    categories.forEach(cat => {
        if (cat) dataList.innerHTML += `<option value="${cat}"></option>`;
    });
}

function deleteItem(id) {
    if (confirm("SEGURO QUE QUIERES ELIMINAR ESTE ELEMENTO?")) {
        data = data.filter(i => String(i.id) !== id);
        saveData().then(() => {
            const activeSection = document.querySelector('#main-nav .active').dataset.section;
            renderSection(activeSection);
        });
    }
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message.toUpperCase();
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
}

</script>
