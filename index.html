<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Accesos v2</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

  <style>
    /* --- TEMAS DE COLORES --- */
    :root { --theme-color: #0d9488; --theme-color-hover: #0f766e; }
    body.theme-blue { --theme-color: #2563eb; --theme-color-hover: #1d4ed8; }
    body.theme-indigo { --theme-color: #4f46e5; --theme-color-hover: #4338ca; }
    body.theme-rose { --theme-color: #e11d48; --theme-color-hover: #be123c; }

    /* --- ESTILOS GENERALES Y MODO OSCURO --- */
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f0f2f5;color:#333;transition:background-color .3s,color .3s}
    body.dark{background-color:#121212;color:#ddd}
    body.dark .card,body.dark .bg-white{background-color:#1e1e1e;color:#ddd;border-color:rgba(255,255,255,0.1)}
    body.dark input,body.dark select,body.dark textarea{background-color:#2a2a2a;color:#ddd;border-color:#444}
    body.dark #editPanel,body.dark .modal-content{background-color:rgba(30,30,30,.97);backdrop-filter:blur(4px)}
    body.dark #searchModal,body.dark #tagSearchModal, body.dark #noteModal, body.dark #taskModal{background-color:rgba(0,0,0,.7)}
    body.dark .sticky-header{background-color:rgba(18,18,18,0.85);backdrop-filter:blur(10px);border-bottom-color:rgba(255,255,255,0.1)}
    body.dark .category-title{color:#e5e7eb}
    body.dark .nav-btn{color:#9ca3af}
    body.dark .nav-btn.active{color:var(--theme-color)}
    body.dark .nav-btn:not(.active):hover{background-color:#2a2a2a}
    
    /* --- CABECERA FIJA Y NAVEGACIÓN --- */
    .sticky-header{position:sticky;top:0;z-index:999;background-color:rgba(240,242,245,0.85);backdrop-filter:blur(10px);border-bottom:1px solid #ddd;padding-top:0.5rem;padding-bottom:0.5rem}
    main{transition: margin-left .3s ease; padding: 1rem 0;}
    .nav-btn{transition:all .2s ease;position:relative;color:#4b5563;font-weight:600;padding:0.5rem 0.75rem;border-radius:8px}
    .nav-btn.active{color:var(--theme-color)}
    .nav-btn:not(.active):hover{transform:translateY(-2px);background-color:#fff}
    
    /* --- TARJETAS --- */
    .card{transition:all .3s ease;box-shadow:0 4px 6px rgba(0,0,0,.05);border-radius:12px;position:relative;display:flex;flex-direction:column;border:1px solid #e5e7eb}
    .card:hover{transform:translateY(-5px);box-shadow:0 10px 15px rgba(0,0,0,.07)}
    .category-title-container{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;border-bottom:1px solid #e5e7eb;padding-bottom:0.5rem}
    body.dark .category-title-container{border-color:rgba(255,255,255,0.1)}
    .category-title{font-size:1.25rem;font-weight:600;letter-spacing:-0.02em;color:#1f2937}
    
    /* --- TARJETAS ESPECIALES: NOTAS Y TAREAS --- */
    .note-card{background-color:#fffbe0;font-family:'Kalam',cursive;cursor:pointer}
    body.dark .note-card{background-color:#4a462a}
    .note-card-content{height:150px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,black 80%,transparent 100%)}
    .task-list{list-style:none;padding:0;margin-top:0.5rem;text-align:left}.task-item{display:flex;align-items:center;padding:0.25rem 0;border-bottom:1px solid #eee}body.dark .task-item{border-color:#333}.task-item.done .task-text{text-decoration:line-through;color:#9ca3af}
    
    /* --- PANEL DE FILTROS --- */
    #filterPanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100vh;
      background-color: white;
      border-right: 1px solid #ddd;
      padding: 1rem;
      padding-top: 80px; /* Espacio para el header */
      z-index: 900;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
    }
    #filterPanel.open {
      transform: translateX(0);
    }
    body.dark #filterPanel {
        background-color: #1e1e1e;
        border-right-color: rgba(255,255,255,0.1);
    }
    main.filters-open {
      margin-left: 280px;
    }
    .filter-group { margin-bottom: 1.5rem; }
    .filter-title { font-weight: 600; margin-bottom: 0.75rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
    body.dark .filter-title { border-color: #333; }
    .filter-group label { display: flex; align-items: center; margin-bottom: 0.5rem; cursor: pointer; }
    .filter-group input[type="checkbox"] { margin-right: 0.5rem; }

    /* --- OTROS ESTILOS (sin cambios) --- */
    .prompt-content,.note-content,.task-content{max-height:150px;overflow-y:auto;font-size:.8rem;white-space:pre-wrap;word-wrap:break-word}
    .tag-container{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .tag{background-color:#e5e7eb;color:#4b5563;padding:2px 8px;border-radius:9999px;font-size:0.75rem;font-weight:500}
    body.dark .tag{background-color:#374151;color:#d1d5db}
    .card-actions{position:absolute;bottom:8px;right:8px;display:flex;gap:8px;opacity:0;transition:opacity .2s ease-in-out}.card:hover .card-actions{opacity:1}.card-actions button{background-color:rgba(255,255,255,0.7);border:1px solid #ddd;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
    body.dark .card-actions button{background-color:rgba(40,40,40,0.8);border-color:#555}
    .main-action-btn{background-color:var(--theme-color) !important;}
    .main-action-btn:hover{background-color:var(--theme-color-hover) !important;}
    .main-action-btn-focus:focus{ring-color:var(--theme-color) !important;}
    .icon-themed{color:var(--theme-color) !important;}
    .fab-container{position:fixed;right:1rem;bottom:1rem;z-index:1100}
    .fab-main{width:56px;height:56px;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,0.2);cursor:pointer;transition:all .2s ease-in-out; background-color: var(--theme-color);}
    .fab-main:hover{transform:rotate(90deg)}
    #editPanel, #noteModal, #taskModal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;overflow-y:auto;transition:opacity .3s}
    /* El resto de los estilos del panel de edición, modales, etc. se mantienen igual */
  </style>
</head>
<body class="min-h-screen theme-default">

  <div class="fab-container">
    <button id="addItemBtn" class="fab-main" title="Agregar Nuevo Elemento">
      <i class="fas fa-plus"></i>
    </button>
  </div>
  
  <aside id="filterPanel">
    <h3 class="filter-title text-lg">Filtros</h3>
    
    <div class="filter-group">
      <h4 class="filter-title">Tipo de Elemento</h4>
      <div id="typeFilterContainer"></div>
    </div>
    
    <div class="filter-group">
      <h4 class="filter-title">Categorías</h4>
      <div id="categoryFilterContainer" class="max-h-60 overflow-y-auto"></div>
    </div>
    
    <div class="filter-group">
        <h4 class="filter-title">Etiquetas</h4>
        <input type="text" id="tagFilterInput" placeholder="Filtrar por etiqueta..." class="w-full px-2 py-1 border rounded text-sm">
    </div>

    <button id="resetFiltersBtn" class="w-full mt-4 px-4 py-2 text-sm bg-gray-200 dark:bg-gray-600 rounded-md">Limpiar Filtros</button>
  </aside>

  <header class="sticky-header">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between gap-4">
        <button id="toggleFiltersBtn" title="Mostrar/Ocultar Filtros" class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700">
          <i class="fas fa-filter"></i>
        </button>
        <div class="relative flex-grow max-w-2xl mx-auto">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="unifiedSearchInput" placeholder="Busca en todo tu contenido..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 main-action-btn-focus">
        </div>
        <div>
          <button id="themeSwitcherBtn" class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700" title="Cambiar Tema y Modo">
              <i class="fas fa-palette"></i>
          </button>
          <button id="gistSettingsBtn" class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700" title="Configurar Gist">
              <i class="fab fa-github"></i>
          </button>
        </div>
      </div>
      <nav class="flex justify-center flex-wrap gap-4 sm:gap-6 mt-4">
        <button data-type-filter="Todos" class="nav-btn active">Todos</button>
        <button data-type-filter="Buscador" class="nav-btn"><i class="fas fa-search mr-2"></i>Buscadores</button>
        <button data-type-filter="Link" class="nav-btn"><i class="fas fa-link mr-2"></i>Links</button>
        <button data-type-filter="Promp" class="nav-btn"><i class="fas fa-brain mr-2"></i>Prompts</button>
        <button data-type-filter="Nota" class="nav-btn"><i class="fas fa-sticky-note mr-2"></i>Notas</button>
        <button data-type-filter="Tarea" class="nav-btn"><i class="fas fa-tasks mr-2"></i>Tareas</button>
      </nav>
    </div>
  </header>

  <div class="container mx-auto px-4">
    <main id="mainContent">
      <div id="unifiedResultsContainer" class="space-y-8"></div>
      <div id="noResultsFound" class="hidden text-center text-gray-500 mt-16">
        <i class="fas fa-ghost text-5xl mb-4"></i>
        <p class="text-xl">No se encontraron resultados</p>
        <p>Intenta cambiar tus filtros o término de búsqueda.</p>
      </div>
    </main>
  </div>

  <div id="editPanel" class="hidden">...</div>
  <div id="noteModal" class="hidden">...</div>
  <div id="taskModal" class="hidden">...</div>
  <div id="toast" class="hidden fixed bottom-5 right-5 bg-green-600 text-white py-2 px-4 rounded-md shadow-lg"></div>

  <div id="editPanel" class="hidden fixed top-0 left-0 w-full h-full z-[1000] overflow-y-auto bg-gray-800 bg-opacity-50">
      <div class="container mx-auto px-4 py-8">
        <div class="bg-white dark:bg-[#1e1e1e] rounded-lg shadow-xl max-w-4xl mx-auto p-6 relative">
          <div class="flex justify-between items-center mb-6">
            <h2 id="editPanelTitle" class="text-2xl font-bold">Agregar Nuevo Elemento</h2>
            <button id="closeEditButton" class="bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 p-2 rounded-full">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <form id="editForm"> ... </form>
        </div>
      </div>
  </div>


<script>
// --- CONFIGURACIÓN Y LÓGICA PRINCIPAL ---
const FILENAME_IN_GIST = 'Botones.json';
let data = [];
let fuse; // Instancia de Fuse.js
let activeFilters = { // Objeto para mantener el estado de los filtros
    searchTerm: '',
    type: 'Todos',
    categories: [],
    tagTerm: ''
};

const THEMES = ['default', 'blue', 'indigo', 'rose'];

// --- FUNCIONES DE CONEXIÓN CON GITHUB (sin cambios) ---
function getOrRequestInfo(key, promptMessage) {
    let value = localStorage.getItem(key);
    if (!value) {
        value = prompt(promptMessage);
        if (value) localStorage.setItem(key, value.trim());
    }
    return value;
}

async function loadData() {
    const gistId = localStorage.getItem('gist_id');
    if (!gistId) {
        showToast("Configura tu Gist ID en el menú de GitHub.");
        return initializeUI();
    }
    showToast("Cargando datos...");
    try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`);
        if (!response.ok) throw new Error(`Gist no encontrado: ${response.status}`);
        const gistData = await response.json();
        if (!gistData.files[FILENAME_IN_GIST]) throw new Error(`El archivo '${FILENAME_IN_GIST}' no existe.`);
        let loadedData = JSON.parse(gistData.files[FILENAME_IN_GIST].content);
        
        data = loadedData.map(item => { // Lógica de migración
            if (!item.id) item.id = Date.now() + Math.random();
            if (item.type === 'Tarea' && typeof item.action === 'string') {
                return { ...item, action: item.action.split('\n').filter(Boolean).map(line => ({ text: line, status: 'todo' })) };
            }
            return item;
        });

        showToast("Datos cargados correctamente.");
    } catch (error) {
        console.error("Fallo al cargar datos:", error);
        showToast(`ERROR: ${error.message}`);
        data = [];
    }
    initializeUI();
}

async function saveData() {
    const gistId = localStorage.getItem('gist_id');
    const token = localStorage.getItem('github_pat');
    if (!gistId || !token) return showToast("Se necesita Gist ID y Token para guardar.");
    showToast("Guardando cambios...");
    try {
        await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify({ files: { [FILENAME_IN_GIST]: { content: JSON.stringify(data, null, 2) } } })
        });
        showToast("Cambios guardados.");
    } catch (error) {
        console.error("Fallo al guardar datos:", error);
        showToast("ERROR: No se pudieron guardar los cambios.");
    }
}

// --- INICIALIZACIÓN DE LA APLICACIÓN ---
document.addEventListener("DOMContentLoaded", () => {
    // Escondemos el HTML de los modales para no duplicarlo
    const editPanelContent = document.getElementById('editPanel').innerHTML;
    document.getElementById('editPanel').innerHTML = ''; // Limpiamos para evitar duplicados
    document.body.insertAdjacentHTML('beforeend', `<div id="editPanel" class="hidden">${editPanelContent}</div>`);
    // Copiar aquí el resto de modales (noteModal, taskModal) si se hace de la misma forma.

    loadData();
    // Los event listeners se configuran en initializeUI
});

function initializeUI() {
    setupEventListeners();
    setupThemeSwitcher();
    initializeFuse();
    renderFilterPanel();
    runFilterAndRender();
}

function initializeFuse() {
    const options = {
        includeScore: true,
        threshold: 0.4, // Más tolerante
        keys: [
            { name: 'title', weight: 0.7 },
            { name: 'tags', weight: 0.5 },
            { name: 'category', weight: 0.4 },
            { name: 'action', weight: 0.2 }
        ]
    };
    fuse = new Fuse(data, options);
}

// --- CONFIGURACIÓN DE EVENT LISTENERS ---
function setupEventListeners() {
    // Búsqueda y Filtros
    document.getElementById('unifiedSearchInput').addEventListener('input', () => {
        activeFilters.searchTerm = event.target.value;
        runFilterAndRender();
    });
    document.getElementById('tagFilterInput').addEventListener('input', () => {
        activeFilters.tagTerm = event.target.value.toLowerCase();
        runFilterAndRender();
    });
    document.getElementById('toggleFiltersBtn').addEventListener('click', toggleFilterPanel);
    document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);

    // Navegación principal (actúa como filtro de tipo)
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.nav-btn.active').classList.remove('active');
            btn.classList.add('active');
            activeFilters.type = btn.dataset.typeFilter;
            runFilterAndRender();
        });
    });

    // Botones principales
    document.getElementById('addItemBtn').addEventListener('click', () => openEditPanel());
    document.getElementById('gistSettingsBtn').addEventListener('click', configureGist);

    // Panel de edición (delegación de eventos si el panel se re-inserta)
    document.body.addEventListener('click', event => {
        if (event.target.id === 'closeEditButton' || event.target.closest('#closeEditButton')) {
            document.getElementById('editPanel').classList.add('hidden');
        }
    });
    document.body.addEventListener('submit', event => {
        if (event.target.id === 'editForm') {
            handleSaveItem(event);
        }
    });
}

function configureGist() {
    const gistId = prompt("Ingresa el ID de tu Gist de GitHub:", localStorage.getItem('gist_id') || '');
    if (gistId) localStorage.setItem('gist_id', gistId.trim());
    
    const token = prompt("Ingresa tu GitHub Personal Access Token:", localStorage.getItem('github_pat') || '');
    if (token) localStorage.setItem('github_pat', token.trim());

    if (gistId && token) {
        showToast("Configuración guardada. Recargando datos...");
        loadData();
    }
}

// --- LÓGICA DE FILTRADO Y RENDERIZADO ---

function runFilterAndRender() {
    // 1. Leer estado de los filtros de checkboxes
    activeFilters.categories = Array.from(document.querySelectorAll('#categoryFilterContainer input:checked')).map(cb => cb.value);
    activeFilters.typesFromPanel = Array.from(document.querySelectorAll('#typeFilterContainer input:checked')).map(cb => cb.value);

    // 2. Aplicar filtros secuencialmente
    let results = data;

    // Filtro por tipo (pestaña principal o checkboxes)
    const typeFilter = activeFilters.type !== 'Todos' ? [activeFilters.type] : activeFilters.typesFromPanel;
    if (typeFilter.length > 0) {
        results = results.filter(item => typeFilter.includes(item.type));
    }
    
    // Filtro por categoría
    if (activeFilters.categories.length > 0) {
        results = results.filter(item => activeFilters.categories.includes(item.category));
    }

    // Filtro por etiqueta
    if (activeFilters.tagTerm) {
        results = results.filter(item => item.tags && item.tags.some(tag => tag.toLowerCase().includes(activeFilters.tagTerm)));
    }
    
    // 3. Aplicar Fuzzy Search si hay término de búsqueda
    if (activeFilters.searchTerm.trim()) {
        const fuseResults = fuse.search(activeFilters.searchTerm, { collection: results });
        results = fuseResults.map(result => result.item);
    }

    // 4. Renderizar los resultados
    renderResults(results);
}


function renderResults(items) {
    const container = document.getElementById('unifiedResultsContainer');
    const notFound = document.getElementById('noResultsFound');
    container.innerHTML = '';

    if (items.length === 0) {
        notFound.classList.remove('hidden');
        return;
    }
    notFound.classList.add('hidden');

    const categorized = items.reduce((acc, item) => {
        const category = item.category || 'Sin clasificar';
        (acc[category] = acc[category] || []).push(item);
        return acc;
    }, {});

    Object.keys(categorized).sort().forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = "mb-8";
        const gridLayout = 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4';
        catDiv.innerHTML = `<div class="category-title-container"><h2 class="category-title">${cat}</h2></div><div class="grid ${gridLayout} gap-4"></div>`;
        const grid = catDiv.querySelector(".grid");
        categorized[cat].forEach(item => grid.appendChild(createCard(item)));
        container.appendChild(catDiv);
    });
}

function renderFilterPanel() {
    // Tipos
    const types = [...new Set(data.map(item => item.type))].sort();
    const typeContainer = document.getElementById('typeFilterContainer');
    typeContainer.innerHTML = types.map(type => `
        <label>
            <input type="checkbox" value="${type}" class="filter-checkbox-type"> ${type}
        </label>
    `).join('');
    typeContainer.querySelectorAll('.filter-checkbox-type').forEach(cb => cb.addEventListener('change', runFilterAndRender));

    // Categorías
    const categories = [...new Set(data.map(item => item.category || 'Sin clasificar'))].sort();
    const categoryContainer = document.getElementById('categoryFilterContainer');
    categoryContainer.innerHTML = categories.map(cat => `
        <label>
            <input type="checkbox" value="${cat}" class="filter-checkbox-cat"> ${cat}
        </label>
    `).join('');
    categoryContainer.querySelectorAll('.filter-checkbox-cat').forEach(cb => cb.addEventListener('change', runFilterAndRender));
}

function resetFilters() {
    activeFilters = { searchTerm: '', type: 'Todos', categories: [], tagTerm: '' };
    
    document.getElementById('unifiedSearchInput').value = '';
    document.getElementById('tagFilterInput').value = '';
    
    document.querySelectorAll('#filterPanel input[type="checkbox"]').forEach(cb => cb.checked = false);
    
    document.querySelector('.nav-btn.active').classList.remove('active');
    document.querySelector('.nav-btn[data-type-filter="Todos"]').classList.add('active');

    runFilterAndRender();
}

function toggleFilterPanel() {
    const panel = document.getElementById('filterPanel');
    const main = document.getElementById('mainContent');
    panel.classList.toggle('open');
    main.classList.toggle('filters-open');
}

// --- CREACIÓN DE TARJETAS Y OTROS HELPERS (con pequeñas adaptaciones) ---

function createCard(item) {
    const card = document.createElement("div");
    let cardClasses = "card bg-white p-4 rounded-lg text-left flex flex-col justify-between min-h-[160px]";
    if (item.type === 'Nota') cardClasses += ' note-card';
    card.className = cardClasses;
    card.title = item.title;
    card.dataset.id = item.id;
    
    // El resto de la función createCard puede ser mayormente copiada de tu versión original
    // Asegúrate de que las funciones onclick como openEditPanel, deleteItem, etc. sigan funcionando
    let contentHtml = "";
    const iconHtml = getIconHtml(item);

    if (item.type === 'Nota') {
        contentHtml = `<div onclick="openNoteModal('${item.id}')" class="cursor-pointer h-full flex flex-col"><h4 class="text-lg font-bold mb-2">${item.title}</h4><div class="text-sm flex-grow note-card-content">${item.action}</div></div>`;
    } else if (item.type === 'Tarea') {
        const tasksHtml = (item.action || []).map((task, index) => `
            <li class="task-item ${task.status === 'done' ? 'done' : ''}">
                <span class="task-text">${task.text}</span>
            </li>
        `).slice(0, 3).join(''); // Mostrar solo las primeras 3
        contentHtml = `<div onclick="openTaskModal('${item.id}')"><h4 class="text-lg font-bold mb-2">${item.title}</h4><ul class="task-list">${tasksHtml}</ul></div>`;
    } else if (item.type === "Buscador" || item.type === "Link") {
        contentHtml = `<a href="#" class="flex items-start w-full text-left p-2 rounded-lg" onclick="event.preventDefault(); handleCardClick('${item.id}')">
            <div class="flex-shrink-0 w-8 h-8 flex items-center justify-center mt-1">${iconHtml}</div>
            <div class="ml-3">
              <span class="font-medium">${item.title}</span>
              <p class="text-xs text-gray-500 break-all">${item.type === 'Link' ? item.action : 'Buscador'}</p>
            </div>
        </a>`;
        card.className = "card bg-white p-2 rounded-lg";
    } else { // Prompt
        contentHtml = `<div class="flex items-center text-left"><div class="flex-shrink-0 w-6 mr-2 flex items-center justify-center">${iconHtml}</div><h4 class="text-lg font-medium">${item.title}</h4></div><div class="mt-3 bg-gray-50 dark:bg-gray-800 p-2 rounded text-sm text-left text-gray-700 prompt-content">${item.action.replace(/\n/g,"<br>")}</div><button class="copy-btn mt-3 w-full bg-purple-100 hover:bg-purple-200 text-purple-800 py-1 rounded-md text-sm" onclick="copyToClipboard('${item.id}')">Copiar</button>`;
    }

    let tagsHtml = "";
    if (item.tags && item.tags.length > 0) {
        tagsHtml = `<div class="tag-container mt-auto pt-2">${item.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>`;
    }
    const actionsHtml = `<div class="card-actions"><button onclick="openEditPanel('${item.id}')" class="text-blue-600" title="Editar"><i class="fas fa-pencil-alt"></i></button><button onclick="deleteItem('${item.id}')" class="text-red-600" title="Eliminar"><i class="fas fa-trash-alt"></i></button></div>`;
    card.innerHTML = `<div>${contentHtml}</div>${tagsHtml}${actionsHtml}`;
    return card;
}

function getIconHtml(item) {
    if (item.icon) return `<i class="${item.icon} text-2xl mx-auto icon-themed"></i>`;
    // El resto de la función es igual
    return '';
}

function handleCardClick(id) {
    const item = data.find(i => String(i.id) === id);
    if (!item) return;
    if (item.type === "Link") {
        window.open(item.action, "_blank");
    } else if (item.type === "Buscador") {
        const term = prompt(`Buscar en ${item.title}:`);
        if (term) {
            window.open(item.action.replace("{search_term}", encodeURIComponent(term)), "_blank");
        }
    }
}

// --- FUNCIONES DE TEMA, TOAST Y MODALES (sin cambios importantes) ---
function setupThemeSwitcher() {
    const btn = document.getElementById('themeSwitcherBtn');
    if (!btn) return;
    const themeStates = THEMES.flatMap(theme => [`light-${theme}`, `dark-${theme}`]);
    let currentStateIndex = themeStates.indexOf(localStorage.getItem('themeState') || 'light-default');

    const applyThemeState = (state) => {
        const [mode, theme] = state.split('-');
        document.body.classList.toggle('dark', mode === 'dark');
        THEMES.forEach(t => document.body.classList.remove(`theme-${t}`));
        if (theme !== 'default') document.body.classList.add(`theme-${theme}`);
        localStorage.setItem('themeState', state);
    };

    btn.addEventListener('click', () => {
        currentStateIndex = (currentStateIndex + 1) % themeStates.length;
        applyThemeState(themeStates[currentStateIndex]);
    });
    applyThemeState(themeStates[currentStateIndex]);
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
}

function deleteItem(id) {
    if (confirm("¿Estás seguro de que deseas eliminar este elemento?")) {
        data = data.filter(i => String(i.id) !== id);
        saveData();
        initializeFuse(); // Re-inicializar Fuse con los nuevos datos
        renderFilterPanel();
        runFilterAndRender();
        showToast("Elemento eliminado.");
    }
}

function handleSaveItem(event) {
    event.preventDefault();
    // Esta función es larga, cópiala de tu original.
    // Al final, en lugar de renderAllSections(), haz esto:
    saveData().then(() => {
        initializeFuse();
        renderFilterPanel();
        runFilterAndRender();
        document.getElementById("editPanel").classList.add("hidden");
        showToast(id ? "Elemento actualizado" : "Elemento creado");
    });
}
